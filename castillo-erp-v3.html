    var st = root.Integrations.vueloActual(r) || {};
    var cls = st.etiqueta === 'Retrasado' ? 'amber' : st.etiqueta === 'Adelantado' ? 'sky' : st.estado === 'Aterrizó' ? 'violet' : 'slate';
    return '<span class="badge badge-' + cls + '" title="' + U.esc(r.vuelo.numero + ' · ' + (st.estado || '')) + '">' + U.icon('plane') + U.esc(r.vuelo.numero || 'Vuelo') + '</span>';
  }
  function tipoBadge(r) {
    if (r.tipo === 'bloqueo') return U.badge('Taller', 'amber', 'wrench');
    return '';
  }

  function contractActions(r) {
    var t = S.totales(r);
    var out = '<div class="row-actions">';
    out += '<button class="icon-btn" data-act="open-contract" data-id="' + U.esc(r.id) + '" title="Ver contrato" aria-label="Ver contrato">' + U.icon('eye') + '</button>';
    if (r.tipo === 'renta' && r.clienteSnapshot.tel) {
      out += '<button class="icon-btn" data-act="wa-compose" data-id="' + U.esc(r.id) + '" title="WhatsApp" aria-label="Enviar WhatsApp">' + U.icon('whatsapp') + '</button>';
    }
    if (r.tipo === 'renta' && r.estado === 'Activo') {
      out += '<button class="icon-btn" data-act="checkin-form" data-id="' + U.esc(r.id) + '" title="Recibir vehículo" aria-label="Recibir vehículo">' + U.icon('key') + '</button>';
    } else if (r.tipo === 'renta' && r.estado === 'Confirmada') {
      out += '<button class="icon-btn" data-act="checkout-form" data-id="' + U.esc(r.id) + '" title="Entregar vehículo" aria-label="Entregar vehículo">' + U.icon('check') + '</button>';
    }
    if (r.tipo === 'renta' && t.pendienteUSD > 0.01) {
      out += '<button class="icon-btn" data-act="payment-form" data-id="' + U.esc(r.id) + '" title="Registrar pago" aria-label="Registrar pago">' + U.icon('cash') + '</button>';
    }
    out += '<button class="icon-btn" data-act="print-contract" data-id="' + U.esc(r.id) + '" title="Imprimir contrato" aria-label="Imprimir contrato">' + U.icon('print') + '</button>';
    if (r.tipo === 'renta' && t.costoPropietarioTotalUSD > 0) {
      out += '<button class="icon-btn" data-act="print-owner-receipt" data-id="' + U.esc(r.id) + '" title="Imprimir recibo de liquidación al dueño" aria-label="Recibo propietario">' + U.icon('file') + '</button>';
    }
    out += '<button class="icon-btn" data-act="toggle-contract-read" data-id="' + U.esc(r.id) + '" title="' + (r.leido === false ? 'Marcar como visto/leído' : 'Marcar como no leído') + '" aria-label="Leído">' + U.icon(r.leido === false ? 'check' : 'rotate-left') + '</button>';
    out += '</div>';
    return out;
  }

  function contractRow(r) {
    var t = S.totales(r);
    var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId);
    var est = U.estadoBadge(r.estado);
    if (r.tipo === 'bloqueo') est = U.badge('Bloqueo', 'amber', 'wrench');
    var propBadge = (r.esVehiculoInvitado || r.vehiculoId === 'INVITADO')
      ? ' ' + U.badge('Invitado', 'violet')
      : (v && v.esPropio === false ? ' ' + U.badge('Subarrendado', 'amber') : '');
    var unreadTag = r.leido === false ? ' ' + U.badge('Nuevo', 'sky') : '';
    var rowStyle = r.leido === false ? ' style="background:#f0f7ff;border-left:3px solid var(--brand)"' : '';
    return '<tr' + rowStyle + '>' +
      '<td><div class="cell-client">' + U.avatar(r.clienteSnapshot.nombre, r.tipo === 'bloqueo' ? 'dark' : '') +
      '<div><div class="strong">' + U.esc(r.clienteSnapshot.nombre) + ' ' + tipoBadge(r) + unreadTag + '</div>' +
      '<div class="sub">' + U.esc(r.id) + (r.clienteSnapshot.tel ? ' · ' + U.esc(r.clienteSnapshot.tel) : '') + '</div></div></div></td>' +
      '<td><div class="strong">' + U.esc(vehiculoFull(v)) + propBadge + '</div><div class="sub">' + U.esc(v ? v.placa : '—') + ' ' + flightPill(r) + (t.costoPropietarioTotalUSD > 0 ? ' · <span style="color:var(--green);font-weight:700">Ganancia neta: ' + C.money(t.gananciaNetaUSD, 'USD') + '</span>' : '') + '</div></td>' +
      '<td><div class="strong">' + C.fmtDate(r.salida) + ' → ' + C.fmtDate(r.retorno) + '</div><div class="sub">' + U.esc(r.horaSalida) + ' · ' + t.dias + ' día(s)</div></td>' +
      '<td class="num"><div class="strong">' + C.money(t.total, r.tarifaMoneda) + '</div>' +
      (t.pendienteUSD > 0.01 ? '<div class="sub" style="color:var(--amber)">Pend. ' + C.money(t.pendienteUSD, 'USD') + '</div>' : '<div class="sub" style="color:var(--green)">Pagado</div>') + '</td>' +
      '<td>' + est + '<div class="sub" style="margin-top:3px">' + U.badge(t.cobro, t.cobro === 'Pagado' ? 'emerald' : t.cobro === 'Parcial' ? 'amber' : t.cobro === 'Saldo a favor' ? 'violet' : 'slate') + '</div></td>' +
      '<td>' + contractActions(r) + '</td></tr>';
  }

  function vehicleOption(v) {
    return ((v.marca ? v.marca + ' ' : '') + v.modelo + ' ' + v.anio + ' · ' + v.placa).trim();
  }

  function fleetStatusLegend() {
    return '<div class="cal-legend">' +
      '<span><i style="background:var(--sky)"></i> En la calle</span>' +
      '<span><i style="background:var(--lime)"></i> Confirmada</span>' +
      '<span><i style="background:#f59e0b"></i> Taller</span>' +
      '<span><i style="background:var(--green)"></i> Disponible</span></div>';
  }

  function kpi(label, value, foot, ico, tone, attrs) {
    return '<div class="kpi ' + (tone || '') + '" ' + (attrs || '') + ' tabindex="0">' +
      '<div class="kpi-top"><span class="kpi-label">' + U.esc(label) + '</span><span class="kpi-icon">' + U.icon(ico) + '</span></div>' +
      '<div class="kpi-value">' + value + '</div><div class="kpi-foot">' + foot + '</div></div>';
  }

  function paymentMethodOptions(selected) {
    return C.METODOS_PAGO.map(function (m) {
      return '<option value="' + U.esc(m) + '"' + (m === selected ? ' selected' : '') + '>' + U.esc(m) + '</option>';
    }).join('');
  }

  function bankOptions(selected) {
    var list = S.settings().bancos || [];
    var out = '<option value="">—</option>';
    list.forEach(function (b) {
      out += '<option value="' + U.esc(b.nombre) + '"' + (b.nombre === selected ? ' selected' : '') + '>' + U.esc(b.nombre) + '</option>';
    });
    out += '<option value="Otra entidad"' + (selected === 'Otra entidad' ? ' selected' : '') + '>Otra entidad</option>';
    return out;
  }

  function depositTypeOptions(selected) {
    return C.TIPOS_DEPOSITO.map(function (t) {
      return '<option value="' + U.esc(t.id) + '"' + (t.id === selected ? ' selected' : '') + '>' + U.esc(t.label) + '</option>';
    }).join('');
  }

  function employeeOptions(selected, blank) {
    var list = S.settings().empleados || [];
    var out = blank != null ? '<option value="">' + U.esc(blank) + '</option>' : '';
    list.forEach(function (e) {
      out += '<option value="' + U.esc(e.id) + '"' + (e.id === selected ? ' selected' : '') + '>' + U.esc(e.nombre) + '</option>';
    });
    return out;
  }

  root.VH = {
    db: db, vehiculoNombre: vehiculoNombre, vehiculoFull: vehiculoFull, flightPill: flightPill,
    contractRow: contractRow, contractActions: contractActions, vehicleOption: vehicleOption,
    fleetStatusLegend: fleetStatusLegend, kpi: kpi, paymentMethodOptions: paymentMethodOptions,
    bankOptions: bankOptions, depositTypeOptions: depositTypeOptions, employeeOptions: employeeOptions
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-dashboard.js ==== */
/* Vista: Dashboard */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH;

  function saludo() {
    var h = new Date().getHours();
    if (h < 12) return 'Buenos días';
    if (h < 19) return 'Buenas tardes';
    return 'Buenas noches';
  }

  function agendaItem(r, tipo) {
    var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId);
    var tone = tipo === 'entrega' ? 'lime' : tipo === 'devolucion' ? 'sky' : 'violet';
    var ico = tipo === 'entrega' ? 'check' : tipo === 'devolucion' ? 'key' : 'plane';
    var hora = tipo === 'entrega' ? r.horaSalida : tipo === 'devolucion' ? r.horaRetorno : (r.vuelo.hora || '');
    var detalle = tipo === 'vuelo'
      ? ('Vuelo ' + (r.vuelo.numero || '') + ' · ' + (r.vuelo.aerolinea || '') + ' · ' + (r.vuelo.origen || ''))
      : ((v ? v.placa : '') + ' · ' + (tipo === 'entrega' ? 'entrega' : 'devolución') + ' · ' + (r.clienteSnapshot.tel || 'sin teléfono'));
    return '<button class="alert-card" data-tone="' + tone + '" data-act="open-contract" data-id="' + U.esc(r.id) + '">' +
      '<span class="a-ico">' + U.icon(ico) + '</span><span><strong>' + U.esc(r.clienteSnapshot.nombre) + '</strong>' +
      '<small>' + U.esc(detalle) + '</small></span><span class="badge badge-' + tone + '">' + U.esc(hora || '—') + '</span></button>';
  }

  root.Views = root.Views || {};
  root.Views.dashboard = function () {
    var k = S.kpis();
    var alerts = S.alerts();
    var activas = S.activas();
    var proximas = S.proximas().slice(0, 4);
    var dh = S.devolucionesHoy();
    var eh = S.entregasHoy();
    var rem = S.reminders();
    var pend = S.pagosPendientes().slice(0, 4);
    var vuelos = S.vuelosProximos().slice(0, 3);
    var notas = S.data().bitacora.slice(0, 3);
    var tasa = S.tasa();
    var agenda = [].concat(
      eh.map(function (r) { return { r: r, tipo: 'entrega' }; }),
      dh.map(function (r) { return { r: r, tipo: 'devolucion' }; }),
      vuelos.map(function (r) { return { r: r, tipo: 'vuelo' }; })
    );

    var html = '<div class="page">';

    // saludo + alertas
    html += '<div class="page-top"><div><h2>' + saludo() + ', ' + U.esc(S.actor().nombre.split(' ')[0]) + ' 👋</h2>' +
      '<p>' + U.esc(U.hoyTexto()) + ' · ' + k.contratosActivos + ' contrato(s) activo(s), ' + k.proximas + ' reserva(s) próxima(s).</p></div>' +
      '<div class="page-actions">' +
      '<button class="btn btn-outline btn-sm" data-act="open-alerts">' + U.icon('bell') + ' Alertas <span class="badge badge-red">' + alerts.length + '</span></button></div></div>';

    if (alerts.length) {
      html += '<div class="grid g4 alerts-grid">' + alerts.slice(0, 4).map(function (a) {
        var firstId = a.ids && a.ids.length === 1 ? a.ids[0] : '';
        return '<button class="alert-card" data-tone="' + a.tone + '" data-act="alert-jump" data-key="' + U.esc(a.key) + '" data-target="' + U.esc(firstId) + '">' +
          '<span class="a-ico">' + U.icon(a.icon) + '</span><span><strong>' + U.esc(a.titulo) + '</strong><small>' + U.esc(a.detalle) + '</small></span>' +
          '<span class="count">' + (a.ids ? a.ids.length : '') + '</span></button>';
      }).join('') + '</div>';
    } else {
      html += '<div class="banner banner-success">' + U.icon('check') + '<div><strong>Todo al día.</strong> No hay alertas operativas: entregas, devoluciones, cobros y mantenimiento están en orden.</div></div>';
    }

    // KPIs
    html += '<div class="grid g5">' +
      VH.kpi('Flota total', k.flota, 'Clic para ver la flota →', 'car', '', 'data-act="kpi-fleet" data-filter="TODOS" role="button"') +
      VH.kpi('En la calle', k.enCalle, 'Vehículos rentados ahora', 'route', 'sky', 'data-act="kpi-fleet" data-filter="En Calle" role="button"') +
      VH.kpi('Disponibles', k.disponibles, 'Listos para entregar', 'check', 'emerald', 'data-act="kpi-fleet" data-filter="Disponible" role="button"') +
      VH.kpi('En taller', k.taller, 'Bloqueados o mantenimiento', 'wrench', 'amber', 'data-act="kpi-fleet" data-filter="Taller" role="button"') +
      VH.kpi('Balance del mes', C.money(k.balanceUSD, 'USD'), C.money(C.r2(k.balanceUSD * tasa), 'DOP') + ' · clic para finanzas', 'cash', 'ink', 'data-act="nav" data-tab="finanzas" role="button"') +
      '</div>';

    // main
    html += '<div class="grid g-2-1"><div class="stack">';

    // activas
    html += '<div class="card"><div class="card-head"><div><h3>' + U.icon('key') + ' Rentas activas</h3><p>Seguimiento de vehículos en la calle y saldos</p></div>' +
      '<button class="btn btn-outline btn-sm" data-act="nav" data-tab="contratos">Ver todas ' + U.icon('chevron-right') + '</button></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Vehículo</th><th>Devolución</th><th class="num">Cobro</th><th></th></tr></thead><tbody>';
    if (!activas.length) {
      html += '<tr><td colspan="5">' + U.empty('Sin rentas activas', 'Cuando entregues un vehículo aparecerá aquí.', 'key') + '</td></tr>';
    } else {
      activas.slice(0, 6).forEach(function (r) {
        var t = S.totales(r);
        var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId);
        var vencida = r.retorno < C.todayISO();
        html += '<tr><td><div class="cell-client">' + U.avatar(r.clienteSnapshot.nombre) + '<div><div class="strong">' + U.esc(r.clienteSnapshot.nombre) + '</div><div class="sub">' + U.esc(r.id) + '</div></div></div></td>' +
          '<td><div class="strong">' + U.esc(VH.vehiculoFull(v)) + '</div><div class="sub">' + U.esc(v ? v.placa : '') + ' ' + VH.flightPill(r) + '</div></td>' +
          '<td><div class="strong" style="color:' + (vencida ? 'var(--red)' : 'inherit') + '">' + C.fmtDate(r.retorno) + ' ' + U.esc(r.horaRetorno) + '</div><div class="sub">' + (vencida ? 'Vencida' : C.relativeDay(r.retorno)) + '</div></td>' +
          '<td class="num"><div class="strong" style="color:' + (t.pendienteUSD > 0 ? 'var(--amber)' : 'var(--green)') + '">' + (t.pendienteUSD > 0 ? C.money(t.pendienteUSD, 'USD') : 'Pagado') + '</div><div class="sub">' + C.money(t.total, r.tarifaMoneda) + '</div></td>' +
          '<td class="row-actions"><button class="icon-btn" data-act="open-contract" data-id="' + U.esc(r.id) + '" aria-label="Ver contrato">' + U.icon('eye') + '</button>' +
          '<button class="icon-btn" data-act="checkin-form" data-id="' + U.esc(r.id) + '" aria-label="Recibir">' + U.icon('key') + '</button></td></tr>';
      });
    }
    html += '</tbody></table></div></div>';

    // próximas
    html += '<div class="card"><div class="card-head"><div><h3>' + U.icon('calendar') + ' Próximas reservas</h3><p>Contratos confirmados por entregar</p></div>' +
      '<button class="btn btn-outline btn-sm" data-act="new-contract">' + U.icon('plus') + ' Agregar</button></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Vehículo</th><th>Entrega</th><th class="num">Total</th><th></th></tr></thead><tbody>';
    if (!proximas.length) {
      html += '<tr><td colspan="5">' + U.empty('Sin reservas próximas', 'Las reservas confirmadas aparecerán aquí.', 'calendar') + '</td></tr>';
    } else {
      proximas.forEach(function (r) {
        var t = S.totales(r);
        var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId);
        html += '<tr><td><div class="cell-client">' + U.avatar(r.clienteSnapshot.nombre) + '<div><div class="strong">' + U.esc(r.clienteSnapshot.nombre) + '</div><div class="sub">' + U.esc(r.id) + ' · ' + U.esc(r.canal) + '</div></div></div></td>' +
          '<td><div class="strong">' + U.esc(VH.vehiculoFull(v)) + '</div><div class="sub">' + U.esc(v ? v.placa : '') + '</div></td>' +
          '<td><div class="strong">' + C.fmtDate(r.salida) + '</div><div class="sub">' + U.esc(r.horaSalida) + ' · ' + C.relativeDay(r.salida) + '</div></td>' +
          '<td class="num"><div class="strong">' + C.money(t.total, r.tarifaMoneda) + '</div><div class="sub">' + (t.pendienteUSD > 0 ? 'Pend. ' + C.money(t.pendienteUSD, 'USD') : 'Pagado') + '</div></td>' +
          '<td class="row-actions"><button class="icon-btn" data-act="open-contract" data-id="' + U.esc(r.id) + '" aria-label="Ver contrato">' + U.icon('eye') + '</button>' +
          '<button class="icon-btn" data-act="checkout-form" data-id="' + U.esc(r.id) + '" aria-label="Entregar">' + U.icon('check') + '</button></td></tr>';
      });
    }
    html += '</tbody></table></div></div>';

    // bitacora reciente
    html += '<div class="card"><div class="card-head"><div><h3>' + U.icon('note') + ' Bitácora reciente</h3></div>' +
      '<button class="btn btn-outline btn-sm" data-act="nav" data-tab="bitacora">Ver bitácora</button></div><div class="card-body stack">';
    if (!notas.length) html += U.empty('Sin observaciones', 'Registra daños, quejas o notas de taller.', 'note');
    else notas.forEach(function (n) {
      var nv = S.vehiculo(n.vehiculoId);
      var vtxt = nv ? VH.vehiculoFull(nv) + ' (' + nv.placa + ')' : '';
      html += '<div class="note-box"><div class="between"><strong>' + U.esc(n.tipo) + '</strong><span class="tiny muted">' + C.fmtDate(n.fecha) + '</span></div>' +
        '<div style="margin-top:3px">' + U.esc(n.texto) + '</div><div class="tiny muted" style="margin-top:4px">' + (vtxt ? U.esc(vtxt) + ' · ' : '') + U.esc(n.autor) + ' · ' + U.esc(n.cliente) + '</div></div>';
    });
    html += '</div></div>';

    html += '</div><div class="stack">';

    // agenda hoy
    html += '<div class="card"><div class="card-head"><div><h3>' + U.icon('clock') + ' Agenda de hoy</h3><p>Entregas, devoluciones y vuelos</p></div>' +
      '<span class="badge badge-slate">' + agenda.length + '</span></div><div class="card-body stack">';
    if (!agenda.length) {
      html += U.empty('Sin movimientos hoy', 'No hay entregas, devoluciones ni vuelos programados.', 'calendar');
    } else {
      var grupos = { entrega: [], devolucion: [], vuelo: [] };
      agenda.forEach(function (a) { grupos[a.tipo].push(a); });
      if (grupos.entrega.length) { html += '<div class="day-section-label">Entregas</div>' + grupos.entrega.map(function (a) { return agendaItem(a.r, 'entrega'); }).join(''); }
      if (grupos.devolucion.length) { html += '<div class="day-section-label">Devoluciones</div>' + grupos.devolucion.map(function (a) { return agendaItem(a.r, 'devolucion'); }).join(''); }
      if (grupos.vuelo.length) { html += '<div class="day-section-label">Vuelos</div>' + grupos.vuelo.map(function (a) { return agendaItem(a.r, 'vuelo'); }).join(''); }
    }
    html += '</div></div>';

    // recordatorios
    html += '<div class="card"><div class="card-head"><div><h3>' + U.icon('bell') + ' Recordatorios de devolución</h3><p>' + (S.settings().operacion.recordatorioDias || 2) + ' días antes del retorno</p></div>' +
      '<span class="badge badge-amber">' + rem.length + '</span></div><div class="card-body stack">';
    if (!rem.length) {
      html += '<div class="banner banner-slate tiny">' + U.icon('check') + '<span>No hay devoluciones que recordar hoy.</span></div>';
    } else {
      rem.forEach(function (r) {
        html += '<div class="between"><div class="row">' + U.avatar(r.clienteSnapshot.nombre, 'sm') +
          '<div><div class="strong" style="font-size:12px">' + U.esc(r.clienteSnapshot.nombre) + '</div><div class="tiny muted">' + C.fmtDate(r.retorno) + ' · ' + U.esc((S.vehiculo(r.vehiculoId) || {}).placa || '') + '</div></div></div>' +
          '<button class="btn btn-success btn-sm" data-act="wa-reminder" data-id="' + U.esc(r.id) + '">' + U.icon('whatsapp') + ' Recordar</button></div>';
      });
    }
    html += '</div></div>';

    // cobros
    html += '<div class="card"><div class="card-head"><div><h3>' + U.icon('cash') + ' Cobros pendientes</h3><p>Saldo por cobrar de contratos activos</p></div>' +
      '<span class="badge badge-violet">' + C.money(k.pendienteUSD, 'USD') + '</span></div><div class="card-body stack">';
    if (!pend.length) {
      html += '<div class="banner banner-success tiny">' + U.icon('check') + '<span>Todos los contratos están pagados.</span></div>';
    } else {
      pend.forEach(function (r) {
        var t = S.totales(r);
        html += '<div class="between"><div class="row">' + U.avatar(r.clienteSnapshot.nombre, 'sm') +
          '<div><div class="strong" style="font-size:12px">' + U.esc(r.clienteSnapshot.nombre) + '</div><div class="tiny muted">' + U.esc(r.id) + ' · ' + U.esc(r.estado) + '</div></div></div>' +
          '<div class="right"><div class="strong" style="color:var(--amber);font-size:12px">' + C.money(t.pendienteUSD, 'USD') + '</div>' +
          '<button class="link-btn tiny" data-act="payment-form" data-id="' + U.esc(r.id) + '">Registrar pago</button></div></div>';
      });
    }
    html += '</div></div>';

    // estado rápido
    html += '<div class="card"><div class="card-body">' +
      '<div class="section-title">' + U.icon('shield') + ' Estado del sistema</div>' +
      '<div class="kv"><span>Contratos activos</span><strong>' + k.contratosActivos + '</strong></div>' +
      '<div class="kv"><span>Reservas próximas</span><strong>' + k.proximas + '</strong></div>' +
      '<div class="kv"><span>Ingresos del mes</span><strong style="color:var(--green)">' + C.money(k.ingresosMesUSD, 'USD') + '</strong></div>' +
      '<div class="kv"><span>Gastos del mes</span><strong style="color:var(--red)">' + C.money(k.gastosMesUSD, 'USD') + '</strong></div>' +
      '<div class="kv"><span>Tasa USD → DOP</span><strong>RD$ ' + tasa.toFixed(2) + ' / US$ <button class="link-btn tiny" data-act="fetch-fx" style="margin-left:4px">Actualizar</button></strong></div>' +
      '<div class="kv"><span>Últ. actualización tasa</span><strong class="tiny muted">' + U.esc(C.fmtStamp((S.tasaInfo && S.tasaInfo().updatedAt) || C.todayISO())) + '</strong></div>' +
      '</div></div>';

    html += '</div></div></div>';
    return html;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-calendar.js ==== */
/* Vista: Calendario (día, semana, mes, año, Gantt) */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH;

  function db() { return S.data(); }
  function fechaRef() { return C.parseISO(S.ui.fechaCal) || C.parseISO(C.todayISO()); }
  function isoRef() { return C.todayISO(fechaRef()); }

  function eventsOn(iso) {
    return db().reservas.filter(function (r) {
      return r.estado !== 'Cancelada' && iso >= r.salida && iso <= r.retorno;
    }).sort(function (a, b) {
      if (a.tipo !== b.tipo) return a.tipo === 'bloqueo' ? -1 : 1;
      return a.id < b.id ? -1 : 1;
    });
  }

  function tone(r) {
    if (r.tipo === 'bloqueo') return 'amber';
    if (r.estado === 'Activo') return 'sky';
    if (r.estado === 'Confirmada') return 'lime';
    if (r.estado === 'Completado') return 'slate';
    return 'slate';
  }

  function eventBtn(r, iso, opts) {
    opts = opts || {};
    var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId);
    var vTag = v ? (v.modelo || v.placa) : 'Invitado';
    var prefix = iso === r.salida ? '▶ ' : (iso === r.retorno ? '⏹ ' : '● ');
    var label = prefix + r.clienteSnapshot.nombre.split(' ')[0] + ' · ' + vTag;
    var ico = r.vuelo && r.vuelo.activo && r.vuelo.fecha === iso ? U.icon('plane') : '';
    return '<button class="cal-ev ' + tone(r) + '" data-act="open-contract" data-id="' + U.esc(r.id) + '" title="' + U.esc(r.clienteSnapshot.nombre + ' · ' + vTag + ' (' + r.salida + ' → ' + r.retorno + ')') + '">' +
      ico + '<span>' + U.esc(label) + '</span></button>';
  }

  function titleFor(view, d) {
    if (view === 'dia') return C.fmtDateLong(C.todayISO(d));
    if (view === 'semana') {
      var start = C.startOfWeek(C.todayISO(d), true);
      return 'Semana del ' + C.fmtDate(start) + ' al ' + C.fmtDate(C.addDays(start, 6));
    }
    if (view === 'mes') return C.MESES[d.getMonth()] + ' ' + d.getFullYear();
    if (view === 'anio') return 'Año ' + d.getFullYear();
    var ini = C.startOfWeek(C.todayISO(d), true);
    return 'Gantt de flota · ' + C.fmtDate(ini) + ' + 20 días';
  }

  function toolbar(view, d) {
    return '<div class="cal-toolbar">' +
      '<div class="cal-nav">' +
      '<button class="icon-btn" data-act="cal-prev" aria-label="Anterior">' + U.icon('chevron-left') + '</button>' +
      '<button class="btn btn-outline btn-sm" data-act="cal-today">Hoy</button>' +
      '<button class="icon-btn" data-act="cal-next" aria-label="Siguiente">' + U.icon('chevron-right') + '</button>' +
      '<h3 class="cal-title">' + U.esc(titleFor(view, d)) + '</h3></div>' +
      '<div class="segmented">' +
      ['dia: Día', 'semana: Semana', 'mes: Mes', 'anio: Año', 'gantt: Flota Gantt'].map(function (pair) {
        var parts = pair.split(': ');
        return '<button class="seg-btn ' + (view === parts[0] ? 'is-active' : '') + '" data-act="cal-view" data-view="' + parts[0] + '">' + parts[1] + '</button>';
      }).join('') +
      '</div>' +
      VH.fleetStatusLegend() +
      '</div>';
  }

  function monthView(d) {
    var y = d.getFullYear(), m = d.getMonth();
    var first = C.todayISO(new Date(y, m, 1));
    var start = C.startOfWeek(first, true);
    var hoy = C.todayISO();
    var head = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(function (x) { return '<div>' + x + '</div>'; }).join('');
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var iso = C.addDays(start, i);
      var dd = C.parseISO(iso);
      var out = dd.getMonth() !== m;
      var evs = eventsOn(iso);
      var dayTone = evs.some(function (r) { return r.estado === 'Activo' && r.tipo === 'renta'; }) ? ' has-active'
        : evs.some(function (r) { return r.estado === 'Confirmada'; }) ? ' has-confirmed'
        : evs.length ? ' has-block' : '';
      cells += '<div class="cal-cell ' + (out ? 'is-out' : '') + (iso === hoy ? ' is-today' : '') + dayTone + ' is-clickable" role="button" tabindex="0" aria-label="Abrir el día ' + iso + '" data-act="cal-open-day" data-date="' + iso + '">' +
        '<div class="cal-daynum"><span>' + (iso === hoy ? '<span class="today-dot">' + dd.getDate() + '</span>' : dd.getDate()) + '</span>' +
        (evs.length > 0 ? '<span class="badge badge-' + (dayTone.indexOf('active') >= 0 ? 'sky' : dayTone.indexOf('confirmed') >= 0 ? 'lime' : 'amber') + '" style="padding:1px 6px;font-size:9.5px">' + evs.length + '</span>' : '') + '</div>' +
        '<div class="cal-events">' + evs.slice(0, 3).map(function (r) { return eventBtn(r, iso, { noExtra: true }); }).join('') +
        (evs.length > 3 ? '<span class="cal-more">+' + (evs.length - 3) + ' más</span>' : '') + '</div></div>';
    }
    return '<div class="cal-month-head">' + head + '</div><div class="cal-grid">' + cells + '</div>';
  }

  function weekView(d) {
    var start = C.startOfWeek(C.todayISO(d), true);
    var hoy = C.todayISO();
    var head = '';
    var cols = '';
    for (var i = 0; i < 7; i++) {
      var iso = C.addDays(start, i);
      var dd = C.parseISO(iso);
      head += '<div>' + U.esc(C.DIAS_CORTOS[dd.getDay()]) + '</div>';
      var evs = eventsOn(iso);
      cols += '<div class="cal-week-col ' + (iso === hoy ? 'is-today' : '') + '">' +
        '<button class="cal-week-day" data-act="cal-open-day" data-date="' + iso + '" style="width:100%;border:0;background:transparent;cursor:pointer">' +
        '<div class="tiny muted">' + U.esc(C.DIAS_CORTOS[dd.getDay()]) + '</div><strong>' + dd.getDate() + '</strong></button>' +
        '<div class="cal-week-body">' + (evs.length ? evs.map(function (r) {
          var time = iso === r.salida ? r.horaSalida : iso === r.retorno ? r.horaRetorno : '';
          return '<button class="cal-unit ' + tone(r) + '" data-act="open-contract" data-id="' + U.esc(r.id) + '">' +
            '<span class="u-time">' + U.esc(time || 'En curso') + '</span><div class="strong truncate">' + U.esc(r.clienteSnapshot.nombre) + '</div>' +
            '<div class="tiny muted truncate">' + U.esc(r.tipo === 'bloqueo' ? 'Taller' : (S.vehiculo(r.vehiculoId) || {}).placa || '') + '</div></button>';
        }).join('') : '<div class="tiny muted center" style="padding:10px 0">—</div>') + '</div></div>';
    }
    return '<div class="cal-week-head">' + head + '</div><div class="cal-week-grid">' + cols + '</div>';
  }

  function dayView(d) {
    var iso = C.todayISO(d);
    var evs = eventsOn(iso);
    var vuelos = db().reservas.filter(function (r) { return r.vuelo && r.vuelo.activo && r.vuelo.fecha === iso && r.estado !== 'Cancelada'; });
    var html = '<div class="card-body stack">';
    if (!evs.length) html += U.empty('Día libre', 'No hay reservas ni bloqueos para esta fecha.', 'calendar');
    else {
      html += '<div class="day-section-label">Rentas y bloqueos</div><div class="day-list">';
      evs.forEach(function (r) {
        var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId);
        var t = S.totales(r);
        var tipo = r.tipo === 'bloqueo' ? 'Bloqueo de taller' : (iso === r.salida ? 'Entrega' : iso === r.retorno ? 'Devolución' : 'En curso');
        var time = iso === r.salida ? r.horaSalida : iso === r.retorno ? r.horaRetorno : '—';
        html += '<button class="day-event ' + tone(r) + '" data-act="open-contract" data-id="' + U.esc(r.id) + '" style="width:100%;text-align:left">' +
          '<span class="bar"></span><span class="time">' + U.esc(time) + '</span>' +
          '<span class="grow"><span class="row wrap gap-6"><strong>' + U.esc(r.clienteSnapshot.nombre) + '</strong>' + U.estadoBadge(r.estado) +
          (r.tipo === 'bloqueo' ? U.badge('Taller', 'amber') : '') + '</span>' +
          '<span class="small muted" style="display:block;margin-top:2px">' + U.esc(tipo) + ' · ' + U.esc(VH.vehiculoFull(v)) + ' · ' + U.esc(v ? v.placa : '') + '</span>' +
          '<span class="tiny muted" style="display:block">' + U.esc(r.id) + ' · ' + C.fmtDate(r.salida) + ' → ' + C.fmtDate(r.retorno) + ' · ' + C.money(t.total, r.tarifaMoneda) + '</span></span>' +
          '<span class="badge badge-' + tone(r) + '">' + U.esc(tipo) + '</span></button>';
      });
      html += '</div>';
    }
    if (vuelos.length) {
      html += '<div class="day-section-label">Vuelos de clientes</div><div class="day-list">';
      vuelos.forEach(function (r) {
        var st = root.Integrations.vueloActual(r) || {};
        html += '<div class="day-event" style="align-items:center"><span class="bar" style="background:var(--violet)"></span><span class="time">' + U.esc(r.vuelo.hora || '—') + '</span>' +
          '<span class="grow"><strong>' + U.esc(r.vuelo.aerolinea) + ' ' + U.esc(r.vuelo.numero) + '</strong>' +
          '<span class="small muted" style="display:block">' + U.esc(r.vuelo.origen) + ' → ' + U.esc(r.vuelo.destino) + ' · ' + (r.vuelo.maletas || 0) + ' maleta(s) · ' + U.esc(r.clienteSnapshot.nombre) + '</span></span>' +
          '<span class="' + root.Integrations.statusClass(r) + '">' + U.esc(st.estado || '—') + (st.etiqueta ? ' · ' + U.esc(st.etiqueta) : '') + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function yearView(d) {
    var y = d.getFullYear();
    var hoy = C.todayISO();
    var meses = '';
    for (var m = 0; m < 12; m++) {
      var firstISO = C.todayISO(new Date(y, m, 1));
      var start = C.startOfWeek(firstISO, true);
      var total = C.daysInMonth(y, m);
      var head = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(function (x) { return '<span class="mini-dow">' + x + '</span>'; }).join('');
      var cells = '';
      for (var i = 0; i < 42; i++) {
        var iso = C.addDays(start, i);
        var dd = C.parseISO(iso);
        if (dd.getMonth() !== m) { cells += '<span class="mini-day blank"></span>'; continue; }
        var has = eventsOn(iso).length > 0;
        cells += '<button class="mini-day ' + (has ? 'has' : '') + (iso === hoy ? ' today' : '') + '" data-act="cal-open-day" data-date="' + iso + '" title="' + iso + '">' + dd.getDate() + '</button>';
      }
      meses += '<div class="mini-month"><h4 data-act="cal-open-month" data-month="' + m + '">' + C.MESES[m] + '</h4><div class="mini-grid">' + head + cells + '</div></div>';
    }
    return '<div class="year-grid">' + meses + '</div>';
  }

  function ganttView(d) {
    var start = C.startOfWeek(C.todayISO(d), true);
    var N = 21;
    var hoy = C.todayISO();
    var days = [];
    for (var i = 0; i < N; i++) days.push(C.addDays(start, i));
    var head = '<th class="veh">Vehículo</th>' + days.map(function (iso) {
      var dd = C.parseISO(iso);
      return '<th class="' + (iso === hoy ? 'g-today-col' : '') + '"><div>' + dd.getDate() + '</div><div style="font-size:8px;font-weight:600">' + U.esc(C.DIAS_CORTOS[dd.getDay()]) + '</div></th>';
    }).join('');
    var rows = db().flota.filter(function (v) { return v.estadoBase !== 'baja'; }).map(function (v) {
      var cells = days.map(function (iso) {
        var r = db().reservas.filter(function (x) {
          return x.vehiculoId === v.id && x.estado !== 'Cancelada' && iso >= x.salida && iso <= x.retorno;
        })[0];
        if (!r) return '<td class="g-idle ' + (iso === hoy ? 'g-today-col' : '') + '"></td>';
        var t = tone(r);
        var cls = 'g-cell ' + t + (iso === r.salida ? ' edge-start' : '') + (iso === r.retorno ? ' edge-end' : '') + (iso === hoy ? ' today' : '');
        var label = '<span class="g-label">' + U.esc(r.clienteSnapshot.nombre.split(' ')[0]) + '</span>';
        return '<td class="' + cls + '" role="button" tabindex="0" data-act="open-contract" data-id="' + U.esc(r.id) + '" title="' + U.esc(r.id + ' · ' + r.clienteSnapshot.nombre + ' · ' + r.salida + ' → ' + r.retorno) + '">' + label + '</td>';
      }).join('');
      var st = S.estadoVehiculo(v);
      return '<tr><td class="veh">' + U.esc(VH.vehiculoFull(v)) + '<div class="tiny muted">' + U.esc(v.placa) + ' · ' + U.badge(st.key, U.toneFor(st.key)) + '</div></td>' + cells + '</tr>';
    }).join('');
    return '<div class="gantt-wrap"><table class="gantt"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card-foot" style="border-radius:0"><span>' + U.icon('info') + ' Haz clic en una celda para abrir el contrato. La columna azul es hoy.</span><span>21 días</span></div>';
  }

  root.Views = root.Views || {};
  root.Views.calendario = function () {
    var view = S.ui.vistaCal || 'mes';
    var d = fechaRef();
    var body = view === 'dia' ? dayView(d) : view === 'semana' ? weekView(d) : view === 'anio' ? yearView(d) : view === 'gantt' ? ganttView(d) : monthView(d);
    var y = d.getFullYear(), m = d.getMonth();
    var totalDias = C.daysInMonth(y, m);
    var flota = db().flota.filter(function (v) { return v.estadoBase !== 'baja'; }).length || 1;
    var carDays = 0;
    for (var dd = 1; dd <= totalDias; dd++) {
      var isoDia = C.todayISO(new Date(y, m, dd));
      db().flota.forEach(function (v) {
        if (v.estadoBase === 'baja') return;
        var ocupado = db().reservas.some(function (r) {
          return r.vehiculoId === v.id && r.estado !== 'Cancelada' && isoDia >= r.salida && isoDia <= r.retorno;
        });
        if (ocupado) carDays++;
      });
    }
    var ocupacion = Math.round(carDays / Math.max(1, totalDias * flota) * 100);
    return '<div class="page">' +
      '<div class="page-top"><div><h2>Disponibilidad y reservas</h2><p>Vista ' + U.esc(view) + ' · Ocupación del mes ' + ocupacion + '% · ' + flota + ' vehículo(s) operativo(s).</p></div>' +
      '<div class="page-actions"><button class="btn btn-outline btn-sm" data-act="new-contract">' + U.icon('plus') + ' Nuevo contrato</button>' +
      '<button class="btn btn-dark btn-sm" data-act="new-block">' + U.icon('wrench') + ' Bloquear taller</button></div></div>' +
      '<div class="card"><div class="cal-wrap">' + toolbar(view, d) + body + '</div></div>' +
      '</div>';
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-fleet.js ==== */
/* Vista: Flota y taller */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH;

  function db() { return S.data(); }

  function meters(v) {
    var km = Number(v.km) || 0, mant = Number(v.kmMant) || 0;
    var restante = mant - km;
    var pct = mant > 0 ? Math.min(100, Math.round(km / mant * 100)) : 0;
    return { km: km, mant: mant, restante: restante, pct: pct, vencido: restante <= 0, proximo: restante > 0 && restante <= 500 };
  }

  function vehicleCard(item) {
    var v = item.vehiculo, st = item.estado;
    var m = meters(v);
    var docs = [];
    if (v.seguro && v.seguro.vence) docs.push(['Seguro', v.seguro.vence]);
    if (v.marbeteVence) docs.push(['Marbete', v.marbeteVence]);
    if (v.revisionVence) docs.push(['Revisión', v.revisionVence]);
    var docsAlert = docs.filter(function (d) { return d[1] <= C.addDays(C.todayISO(), 30); });
    var r = st.reserva || null;
    var tone = U.toneFor(st.key);
    var barTone = m.vencido ? 'red' : m.proximo ? 'amber' : 'green';

    return '<div class="card" style="overflow:hidden">' +
      '<div style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:15px 16px">' +
      '<div class="between" style="align-items:flex-start"><div>' +
      '<div class="row wrap gap-4"><span class="badge badge-' + tone + '">' + (st.key === 'En Calle' ? 'En la calle' : st.key) + '</span>' +
      '<span class="badge badge-' + (v.esPropio === false ? 'amber' : 'ink') + '">' + (v.esPropio === false ? '🤝 Subarrendado' : '🏢 Propio') + '</span></div>' +
      '<h4 style="font-size:17px;font-weight:800;margin-top:7px">' + U.esc(VH.vehiculoFull(v)) + '</h4>' +
      '<p style="font-size:11px;color:#94a3b8">' + U.esc(v.color || '') + ' · Placa <strong style="color:#fff">' + U.esc(v.placa) + '</strong>' + (v.esPropio === false && v.propietarioNombre ? ' · Dueño: <strong style="color:#fde68a">' + U.esc(v.propietarioNombre) + '</strong>' : '') + '</p></div>' +
      '<button class="btn btn-outline btn-sm" data-act="edit-vehicle" data-id="' + U.esc(v.id) + '" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff">' + U.icon('edit') + ' Editar</button>' +
      '</div></div>' +
      '<div style="padding:14px 16px" class="stack">' +
      (r ? '<button class="banner banner-' + (r.tipo === 'bloqueo' ? 'warn' : r.estado === 'Activo' ? 'info' : 'success') + '" data-act="open-contract" data-id="' + U.esc(r.id) + '" style="width:100%;text-align:left">' + U.icon(r.tipo === 'bloqueo' ? 'wrench' : 'key') +
        '<span><strong>' + U.esc(r.tipo === 'bloqueo' ? 'Bloqueado: ' + r.clienteSnapshot.nombre : r.clienteSnapshot.nombre) + '</strong><br>' +
        C.fmtDate(r.salida) + ' → ' + C.fmtDate(r.retorno) + (r.tipo === 'renta' ? ' · ' + U.esc(r.estado) : '') + '</span></button>' : '') +
      '<div class="row g2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<div><div class="tiny muted">Renta al cliente</div><div class="strong">' + C.money(v.tarifaUSD, 'USD') + ' /día</div></div>' +
      (v.esPropio === false
        ? '<div><div class="tiny muted">Pago al dueño / Margen</div><div class="strong" style="color:var(--amber)">' + C.money(v.costoDiaUSD || 0, 'USD') + ' <span style="color:var(--green);font-size:11px">(+' + C.money(Math.max(0, (v.tarifaUSD || 0) - (v.costoDiaUSD || 0)), 'USD') + ')</span></div></div>'
        : '<div><div class="tiny muted">Tarifa DOP</div><div class="strong">' + C.money(v.tarifaDOP || v.tarifaUSD * S.tasa(), 'DOP') + ' /día</div></div>') +
      '</div>' +
      '<div><div class="between tiny"><span class="muted">Kilometraje</span><span><strong>' + m.km.toLocaleString('es-DO') + '</strong> / ' + m.mant.toLocaleString('es-DO') + ' km</span></div>' +
      '<div class="progress ' + barTone + '" style="margin-top:4px"><span style="width:' + m.pct + '%"></span></div>' +
      '<div class="tiny ' + (m.vencido ? '' : 'muted') + '" style="margin-top:4px;color:' + (m.vencido ? 'var(--red)' : m.proximo ? 'var(--amber)' : 'var(--muted)') + '">' +
      (m.vencido ? '¡Mantenimiento vencido por ' + Math.abs(m.restante).toLocaleString('es-DO') + ' km!' : m.proximo ? 'Faltan ' + m.restante.toLocaleString('es-DO') + ' km para el servicio' : 'Próximo servicio en ' + m.restante.toLocaleString('es-DO') + ' km') + '</div></div>' +
      (docs.length ? '<div class="row wrap gap-4">' + docs.map(function (d) {
        var venc = d[1] < C.todayISO();
        var prox = !venc && d[1] <= C.addDays(C.todayISO(), 30);
        return '<span class="badge badge-' + (venc ? 'red' : prox ? 'amber' : 'slate') + '" title="' + U.esc(d[0]) + ' vence ' + C.fmtDate(d[1]) + '">' + U.icon('file') + U.esc(d[0]) + ': ' + C.fmtDate(d[1]) + '</span>';
      }).join('') + '</div>' : '') +
      (v.nota ? '<div class="note-box tiny">' + U.esc(v.nota) + '</div>' : '') +
      (v.gps ? '<div class="tiny muted">' + U.icon('map') + ' ' + U.esc(v.gps) + '</div>' : '') +
      '</div>' +
      '<div class="card-foot" style="gap:6px">' +
      '<button class="btn btn-outline btn-sm" data-act="vehicle-history" data-id="' + U.esc(v.id) + '">' + U.icon('file') + ' Historial</button>' +
      (v.estadoBase === 'operativo'
        ? '<button class="btn btn-ghost btn-sm" data-act="block-vehicle" data-id="' + U.esc(v.id) + '">' + U.icon('wrench') + ' Taller</button>'
        : '<button class="btn btn-ghost btn-sm" data-act="reactivate-vehicle" data-id="' + U.esc(v.id) + '">' + U.icon('check') + ' Reactivar</button>') +
      (v.estadoBase !== 'baja'
        ? '<button class="btn btn-ghost btn-sm" data-act="baja-vehicle" data-id="' + U.esc(v.id) + '" style="color:var(--red);margin-left:auto">' + U.icon('ban') + ' Baja</button>'
        : '<span class="badge badge-slate" style="margin-left:auto">Fuera de servicio</span>') +
      '</div></div>';
  }

  root.Views = root.Views || {};
  root.Views.flota = function () {
    var items = S.flotaConEstado();
    var filtro = S.ui.filtroFlota || 'TODOS';
    var counts = {
      TODOS: items.length,
      PROPIOS: items.filter(function (x) { return x.vehiculo.esPropio !== false; }).length,
      TERCEROS: items.filter(function (x) { return x.vehiculo.esPropio === false; }).length
    };
    items.forEach(function (x) { counts[x.estado.key] = (counts[x.estado.key] || 0) + 1; });
    var list = filtro === 'TODOS' ? items
      : filtro === 'PROPIOS' ? items.filter(function (x) { return x.vehiculo.esPropio !== false; })
      : filtro === 'TERCEROS' ? items.filter(function (x) { return x.vehiculo.esPropio === false; })
      : items.filter(function (x) { return x.estado.key === filtro; });
    var mant = S.alertasMantenimiento();
    var docs = S.alertasDocumentos();
    var activos = items.filter(function (x) { return x.estado.key !== 'Baja'; }).length;

    var html = '<div class="page">' +
      '<div class="page-top"><div><h2>Flota operativa</h2><p>' + activos + ' vehículo(s) en servicio · ' + mant.length + ' alerta(s) de mantenimiento · ' + docs.length + ' documento(s) por vencer.</p></div>' +
      '<div class="page-actions"><button class="btn btn-outline btn-sm" data-act="nav" data-tab="calendario">' + U.icon('calendar') + ' Calendario</button>' +
      '<button class="btn btn-primary btn-sm" data-act="new-vehicle">' + U.icon('plus') + ' Agregar vehículo</button></div></div>';

    if (mant.length) {
      html += '<div class="banner banner-warn">' + U.icon('wrench') + '<div><strong>Mantenimiento pendiente:</strong> ' +
        mant.map(function (m) { return U.esc(VH.vehiculoFull(m.vehiculo)) + ' (' + (m.vencido ? 'vencido' : 'faltan ' + m.restante + ' km') + ')'; }).join(' · ') + '</div></div>';
    }
    if (docs.length) {
      html += '<div class="banner banner-warn">' + U.icon('file') + '<div><strong>Documentos por vencer:</strong> ' +
        docs.slice(0, 4).map(function (d) { return U.esc(VH.vehiculoFull(d.vehiculo)) + ' · ' + U.esc(d.tipo) + ' ' + C.fmtDate(d.vence); }).join(' · ') + '</div></div>';
    }

    html += '<div class="row wrap gap-6">' +
      [['TODOS', 'Todos', 'slate'], ['PROPIOS', '🏢 Propios', 'ink'], ['TERCEROS', '🤝 Subarrendados', 'amber'], ['Disponible', 'Disponibles', 'emerald'], ['En Calle', 'En la calle', 'sky'], ['Reservado', 'Reservados', 'lime'], ['Taller', 'Taller', 'amber'], ['Baja', 'Baja', 'slate']].map(function (f) {
        return '<button class="chip ' + (filtro === f[0] ? 'is-active' : '') + '" data-act="fleet-filter" data-filter="' + f[0] + '">' +
          f[1] + ' <span class="count">' + (counts[f[0]] || 0) + '</span></button>';
      }).join('') + '</div>';

    html += '<div class="grid g3">' + (list.length ? list.map(vehicleCard).join('') : U.empty('Sin vehículos en este filtro', 'Cambia el filtro o agrega un vehículo.', 'car')) + '</div></div>';
    return html;
  };

  /* ---------- formularios ---------- */
  root.Views.vehicleForm = function (id) {
    var v = id ? S.vehiculo(id) : null;
    var d = v || { marca: '', modelo: '', anio: new Date().getFullYear(), color: 'Blanco', placa: '', vin: '', tarifaUSD: 50, tarifaDOP: 3000, km: 0, kmMant: 10000, estadoBase: 'operativo', gps: 'Doble GPS + cortacorriente', nota: '', seguro: { aseguradora: '', poliza: '', vence: '' }, marbeteVence: '', revisionVence: '' };
    var body = '<input type="hidden" id="veh-id" value="' + U.esc(v ? v.id : '') + '">' +
      '<div class="form-grid g3">' +
      U.field('Marca', '<input class="input" id="veh-marca" value="' + U.esc(d.marca) + '" placeholder="Hyundai">') +
      U.field('Modelo', '<input class="input" id="veh-modelo" value="' + U.esc(d.modelo) + '" placeholder="Cantus">', { req: true }) +
      U.field('Año', '<input class="input" id="veh-anio" type="number" min="1990" max="2100" value="' + U.esc(d.anio) + '">') +
      U.field('Color', '<input class="input" id="veh-color" value="' + U.esc(d.color) + '">') +
      U.field('Placa', '<input class="input" id="veh-placa" value="' + U.esc(d.placa) + '" placeholder="A-123456">') +
      U.field('VIN / Chasis', '<input class="input" id="veh-vin" value="' + U.esc(d.vin || '') + '">') +
      U.field('Tarifa diaria USD', '<input class="input" id="veh-tarifa-usd" type="number" min="0" step="0.01" value="' + U.esc(d.tarifaUSD) + '">') +
      U.field('Tarifa diaria DOP', '<input class="input" id="veh-tarifa-dop" type="number" min="0" step="0.01" value="' + U.esc(d.tarifaDOP || '') + '">') +
      U.field('Kilometraje actual', '<input class="input" id="veh-km" type="number" min="0" value="' + U.esc(d.km) + '">') +
      U.field('Próximo cambio de aceite (km)', '<input class="input" id="veh-km-mant" type="number" min="0" value="' + U.esc(d.kmMant) + '">') +
      U.field('Estado base', '<select class="select" id="veh-estado"><option value="operativo"' + (d.estadoBase === 'operativo' ? ' selected' : '') + '>Operativo</option><option value="taller"' + (d.estadoBase === 'taller' ? ' selected' : '') + '>En taller (bloqueado)</option><option value="baja"' + (d.estadoBase === 'baja' ? ' selected' : '') + '>Fuera de servicio / baja</option></select>') +
      U.field('Régimen de propiedad', '<select class="select" id="veh-propiedad"><option value="propio"' + (d.esPropio !== false ? ' selected' : '') + '>🏢 Propio (Castillo Rent Car)</option><option value="tercero"' + (d.esPropio === false ? ' selected' : '') + '>🤝 De tercero / Subarrendado</option></select>') +
      U.field('Costo pagado al dueño (US$/día)', '<input class="input" id="veh-costo-usd" type="number" min="0" step="0.01" value="' + U.esc(d.costoDiaUSD || 0) + '" placeholder="0.00">', { hint: '0 si es propio. Si es de un tercero, indica cuánto le pagas por día.' }) +
      U.field('Nombre del propietario', '<input class="input" id="veh-propietario" value="' + U.esc(d.propietarioNombre || '') + '" placeholder="Ej. Inversiones Pérez / Juan">') +
      U.field('Teléfono del propietario', '<input class="input" id="veh-propietario-tel" value="' + U.esc(d.propietarioTel || '') + '" placeholder="809-000-0000">') +
      '</div>' +
      '<div class="divider" style="margin:14px 0"></div>' +
      '<div class="section-title">' + U.icon('shield') + ' Documentos y equipamiento</div>' +
      '<div class="form-grid g3">' +
      U.field('Aseguradora', '<input class="input" id="veh-aseguradora" value="' + U.esc(d.seguro ? d.seguro.aseguradora : '') + '">') +
      U.field('Póliza', '<input class="input" id="veh-poliza" value="' + U.esc(d.seguro ? d.seguro.poliza : '') + '">') +
      U.field('Vence seguro', '<input class="input" id="veh-seguro-vence" type="date" value="' + U.esc(d.seguro ? d.seguro.vence : '') + '">') +
      U.field('Vence marbete', '<input class="input" id="veh-marbete" type="date" value="' + U.esc(d.marbeteVence || '') + '">') +
      U.field('Vence revisión', '<input class="input" id="veh-revision" type="date" value="' + U.esc(d.revisionVence || '') + '">') +
      U.field('GPS / equipamiento', '<input class="input" id="veh-gps" value="' + U.esc(d.gps || '') + '">') +
      '<div class="span-3">' + U.field('Notas', '<textarea class="textarea" id="veh-nota" rows="2">' + U.esc(d.nota || '') + '</textarea>') + '</div>' +
      '</div>';
    U.openModal({
      title: v ? 'Editar vehículo' : 'Agregar vehículo',
      subtitle: v ? VH.vehiculoFull(v) + ' · ' + v.placa : 'Registra un vehículo nuevo en la flota (Tasa actual: RD$ ' + S.tasa().toFixed(2) + ')',
      size: 'wide', body: body,
      footer: '<button class="btn btn-outline" data-act="close-modal">Cancelar</button>' +
        (v && S.isAdmin && S.isAdmin() ? '<button class="btn btn-danger-soft" data-act="delete-vehicle" data-id="' + U.esc(v.id) + '">' + U.icon('trash') + ' Eliminar</button>' : '') +
        '<button class="btn btn-primary" data-act="save-vehicle">' + U.icon('check') + ' Guardar vehículo</button>',
      onMount: function (rootEl) {
        var inUSD = rootEl.querySelector('#veh-tarifa-usd');
        var inDOP = rootEl.querySelector('#veh-tarifa-dop');
        if (inUSD && inDOP) {
          inUSD.addEventListener('input', function () {
            var u = Number(inUSD.value);
            if (isFinite(u) && u >= 0) inDOP.value = C.r2(u * S.tasa());
          });
          inDOP.addEventListener('input', function () {
            var dp = Number(inDOP.value);
            if (isFinite(dp) && dp >= 0 && S.tasa() > 0) inUSD.value = C.r2(dp / S.tasa());
          });
        }
      }
    });
  };

  root.Views.blockForm = function (vehiculoId) {
    var hoy = C.todayISO();
    var opciones = S.data().flota.filter(function (v) { return v.estadoBase !== 'baja'; }).map(function (v) {
      return '<option value="' + U.esc(v.id) + '"' + (v.id === vehiculoId ? ' selected' : '') + '>' + U.esc(VH.vehicleOption(v)) + '</option>';
    }).join('');
    var body = '<div class="form-grid g2">' +
      U.field('Vehículo', '<select class="select" id="block-vehiculo">' + opciones + '</select>', { req: true }) +
      U.field('Motivo', '<input class="input" id="block-motivo" value="Mantenimiento" placeholder="Cambio de aceite, frenos…">', { req: true }) +
      U.field('Desde', '<input class="input" id="block-desde" type="date" value="' + hoy + '">') +
      U.field('Hasta', '<input class="input" id="block-hasta" type="date" value="' + C.addDays(hoy, 1) + '">') +
      U.field('Hora inicio', '<input class="input" id="block-hora-ini" type="time" value="08:00">') +
      U.field('Hora fin', '<input class="input" id="block-hora-fin" type="time" value="18:00">') +
      '</div><div class="banner banner-info" style="margin-top:12px">' + U.icon('info') + '<span>El bloqueo ocupa el vehículo en el calendario y en la disponibilidad. No genera cobro.</span></div>';
    U.openModal({
      title: 'Bloquear vehículo por taller', subtitle: 'Reserva el vehículo para mantenimiento o reparación', size: 'narrow',
      body: body,
      footer: '<button class="btn btn-outline" data-act="close-modal">Cancelar</button><button class="btn btn-dark" data-act="save-block">' + U.icon('wrench') + ' Crear bloqueo</button>'
    });
  };

  root.Views.vehicleHistory = function (id) {
    var v = S.vehiculo(id);
    if (!v) return U.toast('Vehículo no encontrado', 'error');
    var rs = S.reservasOrdenadas().filter(function (r) { return r.vehiculoId === id; });
    var body = rs.length ? '<div class="table-wrap"><table class="table compact"><thead><tr><th>Contrato</th><th>Cliente</th><th>Fechas</th><th>Estado</th><th class="num">Total</th></tr></thead><tbody>' +
      rs.map(function (r) {
        var t = S.totales(r);
        return '<tr><td><button class="link-btn" data-act="open-contract" data-id="' + U.esc(r.id) + '">' + U.esc(r.id) + '</button></td>' +
          '<td>' + U.esc(r.clienteSnapshot.nombre) + '</td><td>' + C.fmtDate(r.salida) + ' → ' + C.fmtDate(r.retorno) + '</td>' +
          '<td>' + (r.tipo === 'bloqueo' ? U.badge('Taller', 'amber') : U.estadoBadge(r.estado)) + '</td>' +
          '<td class="num">' + (r.tipo === 'bloqueo' ? '—' : C.money(t.total, r.tarifaMoneda)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : U.empty('Sin historial', 'Este vehículo todavía no tiene contratos.', 'file');
    U.openModal({
      title: 'Historial del vehículo', subtitle: VH.vehiculoFull(v) + ' · ' + v.placa, size: 'wide', body: body,
      footer: '<button class="btn btn-outline" data-act="close-modal">Cerrar</button><button class="btn btn-primary" data-act="edit-vehicle" data-id="' + U.esc(v.id) + '">' + U.icon('edit') + ' Editar vehículo</button>'
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-contracts.js ==== */
/* Vista: Contratos — listado y formulario */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH;

  function db() { return S.data(); }

  function rangoPeriodoContratos() {
    var modo = S.ui.periodoContratos || 'TODOS';
    var ref = S.ui.fechaContratos || C.todayISO();
    var d = C.parseISO(ref) || new Date();
    if (modo === 'DIA') {
      return { modo: modo, desde: ref, hasta: ref, label: 'Día · ' + C.fmtDateLong(ref), seedSalida: ref, seedRetorno: C.addDays(ref, 1) };
    }
    if (modo === 'SEMANA') {
      var ini = C.startOfWeek(ref, true);
      var fin = C.addDays(ini, 6);
      return { modo: modo, desde: ini, hasta: fin, label: 'Semana · ' + C.fmtDate(ini) + ' al ' + C.fmtDate(fin), seedSalida: ini, seedRetorno: C.addDays(ini, 3) };
    }
    if (modo === 'MES') {
      var y = d.getFullYear(), m = d.getMonth();
      var iniM = y + '-' + C.pad2(m + 1) + '-01';
      var finM = y + '-' + C.pad2(m + 1) + '-' + C.pad2(C.daysInMonth(y, m));
      return { modo: modo, desde: iniM, hasta: finM, label: 'Mes · ' + C.MESES[m] + ' ' + y, seedSalida: ref, seedRetorno: C.addDays(ref, 3) };
    }
    if (modo === 'ANIO') {
      var yy = d.getFullYear();
      return { modo: modo, desde: yy + '-01-01', hasta: yy + '-12-31', label: 'Año ' + yy, seedSalida: ref, seedRetorno: C.addDays(ref, 4) };
    }
    return { modo: 'TODOS', desde: '', hasta: '', label: 'Todo el historial', seedSalida: C.todayISO(), seedRetorno: C.addDays(C.todayISO(), 3) };
  }

  function enRangoContrato(r, rng) {
    if (!rng || rng.modo === 'TODOS' || !rng.desde || !rng.hasta) return true;
    return r.salida <= rng.hasta && r.retorno >= rng.desde;
  }

  function filtroCounts() {
    var rng = rangoPeriodoContratos();
    var rs = db().reservas.filter(function (r) { return r.tipo === 'renta' && enRangoContrato(r, rng); });
    return {
      TODOS: rs.length,
      NO_LEIDOS: rs.filter(function (r) { return r.leido === false; }).length,
      ACTIVOS: rs.filter(function (r) { return r.estado === 'Activo'; }).length,
      PROXIMAS: rs.filter(function (r) { return r.estado === 'Confirmada'; }).length,
      VENCIDAS: rs.filter(function (r) { return r.estado === 'Activo' && r.retorno < C.todayISO(); }).length,
      RECORDATORIOS: S.reminders().filter(function (r) { return enRangoContrato(r, rng); }).length,
      PENDIENTES: S.pagosPendientes().filter(function (r) { return enRangoContrato(r, rng); }).length,
      COMPLETADOS: rs.filter(function (r) { return r.estado === 'Completado'; }).length,
      CANCELADAS: rs.filter(function (r) { return r.estado === 'Cancelada'; }).length
    };
  }

  function filtradas() {
    var f = S.ui.filtroContratos || 'TODOS';
    var q = String(S.ui.busquedaContratos || '').trim().toLowerCase();
    var hoy = C.todayISO();
    var rng = rangoPeriodoContratos();
    return S.reservasOrdenadas().filter(function (r) {
      if (r.tipo !== 'renta') return false;
      if (!enRangoContrato(r, rng)) return false;
      if (f === 'NO_LEIDOS' && r.leido !== false) return false;
      if (f === 'ACTIVOS' && r.estado !== 'Activo') return false;
      if (f === 'PROXIMAS' && r.estado !== 'Confirmada') return false;
      if (f === 'VENCIDAS' && !(r.estado === 'Activo' && r.retorno < hoy)) return false;
      if (f === 'COMPLETADOS' && r.estado !== 'Completado') return false;
      if (f === 'CANCELADAS' && r.estado !== 'Cancelada') return false;
      if (f === 'PENDIENTES' && !(S.totales(r).pendienteUSD > 0.01 && (r.estado === 'Activo' || r.estado === 'Confirmada'))) return false;
      if (f === 'RECORDATORIOS' && !S.reminders().some(function (x) { return x.id === r.id; })) return false;
      if (q) {
        var v = (S.vehiculoDeReserva ? S.vehiculoDeReserva(r) : S.vehiculo(r.vehiculoId)) || {};
        var blob = (r.id + ' ' + r.clienteSnapshot.nombre + ' ' + r.clienteSnapshot.doc + ' ' + r.clienteSnapshot.tel + ' ' + (v.placa || '') + ' ' + (v.modelo || '')).toLowerCase();
        if (blob.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function rowsHTML() {
    var list = filtradas();
    if (!list.length) return '<tr><td colspan="6">' + U.empty('Sin contratos en este período o filtro', 'Cambia entre Día, Semana, Mes, Año o Todos, o pulsa “+ Definir reserva en este período”.', 'file') + '</td></tr>';
    return list.map(VH.contractRow).join('');
  }

  root.Views = root.Views || {};
  root.Views.contractsRows = rowsHTML;
  root.Views.rangoPeriodoContratos = rangoPeriodoContratos;

  root.Views.contratos = function () {
    var c = filtroCounts();
    var rng = rangoPeriodoContratos();
    var listPeriodo = filtradas();
    var totalPeriodoUSD = C.r2(listPeriodo.reduce(function (a, r) { return a + S.totales(r).totalUSD; }, 0));
    var totalPend = S.pagosPendientes().filter(function (r) { return enRangoContrato(r, rng); }).reduce(function (a, r) { return a + S.totales(r).pendienteUSD; }, 0);
    var chips = [
      ['TODOS', 'Todos'], ['NO_LEIDOS', 'Nuevos / No leídos'], ['ACTIVOS', 'En la calle'], ['PROXIMAS', 'Confirmadas'], ['VENCIDAS', 'Vencidas'],
      ['RECORDATORIOS', 'Recordatorios'], ['PENDIENTES', 'Por cobrar / Con saldo'], ['COMPLETADOS', 'Completados'], ['CANCELADAS', 'Canceladas']
    ];
    var periodos = [
      ['TODOS', 'Todos'], ['DIA', 'Día'], ['SEMANA', 'Semana'], ['MES', 'Mes'], ['ANIO', 'Año']
    ];
    return '<div class="page">' +
      '<div class="page-top"><div><h2>Contratos, reservas y check-in</h2><p>' + U.esc(rng.label) + ' · ' + listPeriodo.length + ' contrato(s) · Facturado: ' + C.money(totalPeriodoUSD, 'USD') + ' · Por cobrar: ' + C.money(totalPend, 'USD') + '.</p></div>' +
      '<div class="page-actions">' +
      (c.NO_LEIDOS > 0 ? '<button class="btn btn-outline btn-sm" data-act="mark-all-contracts-read">' + U.icon('check') + ' Marcar ' + c.NO_LEIDOS + ' leído(s)</button>' : '') +
      '<button class="btn btn-outline btn-sm" data-act="new-block">' + U.icon('wrench') + ' Bloquear taller</button>' +
      '<button class="btn btn-primary btn-sm" data-act="new-contract-period">' + U.icon('plus') + ' Definir reserva (' + (rng.modo === 'TODOS' ? 'Nueva' : rng.modo.toLowerCase()) + ')</button></div></div>' +

      '<div class="card"><div class="card-body" style="padding:12px 16px"><div class="between wrap gap-10">' +
      '<div class="row wrap gap-8"><span class="tiny strong muted" style="text-transform:uppercase;letter-spacing:.08em">Clasificar por período:</span>' +
      '<div class="segmented">' + periodos.map(function (p) {
        return '<button class="seg-btn ' + (rng.modo === p[0] ? 'is-active' : '') + '" data-act="contract-period" data-period="' + p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div></div>' +
      (rng.modo !== 'TODOS' ? '<div class="row wrap gap-6">' +
        '<button class="icon-btn" data-act="contract-period-prev" style="width:32px;height:32px" title="Período anterior">' + U.icon('chevron-left') + '</button>' +
        '<input class="input sm" id="contract-period-date" type="date" value="' + U.esc(S.ui.fechaContratos || C.todayISO()) + '" style="width:148px" aria-label="Fecha de referencia">' +
        '<button class="btn btn-outline btn-sm" data-act="contract-period-today">Hoy</button>' +
        '<button class="icon-btn" data-act="contract-period-next" style="width:32px;height:32px" title="Período siguiente">' + U.icon('chevron-right') + '</button>' +
        '<span class="badge badge-sky">' + U.esc(rng.label) + '</span>' +
      '</div>' : '<span class="tiny muted">Selecciona <strong>Día, Semana, Mes o Año</strong> para filtrar y definir reservas individuales en ese bloque.</span>') +
      '</div></div></div>' +

      '<div class="grid g4">' +
      VH.kpi('En la calle', c.ACTIVOS, 'Clic para filtrar activos →', 'route', 'sky', 'data-act="contract-filter" data-filter="ACTIVOS" role="button"') +
      VH.kpi('Confirmadas', c.PROXIMAS, 'Clic para ver por entregar →', 'calendar', '', 'data-act="contract-filter" data-filter="PROXIMAS" role="button"') +
      VH.kpi('Vencidas', c.VENCIDAS, 'Clic para atención inmediata →', 'alert', c.VENCIDAS ? 'amber' : '', 'data-act="contract-filter" data-filter="VENCIDAS" role="button"') +
      VH.kpi('Por cobrar', C.money(totalPend, 'USD'), c.PENDIENTES + ' contrato(s) con saldo · clic para detallar →', 'cash', 'violet', 'data-act="open-ar-detail" role="button"') +
      '</div>' +

      '<div class="card"><div class="card-head" style="gap:12px">' +
      '<div class="row wrap gap-4" style="flex:1">' + chips.map(function (x) {
        return '<button class="chip ' + (S.ui.filtroContratos === x[0] ? 'is-active' : '') + '" data-act="contract-filter" data-filter="' + x[0] + '">' + x[1] +
          ' <span class="count">' + (c[x[0]] || 0) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="searchbox" style="width:250px;display:block">' + U.icon('search', 'search-ico') +

  root.Views.contractDetail = function (id, tab) {

    tab = tab || 'resumen';

      '<div class="hero-stat"><span>Fianza</span><strong style="color:#c4b5fd">' + (t.fianzaUSD > 0 ? C.money(t.fianzaUSD, 'USD') : '') + (t.fianzaDOP > 0 ? ' + ' + C.money(t.fianzaDOP, 'DOP') : '') + (!t.fianzaUSD && !t.fianzaDOP ? (t.documentos.length ? t.documentos.map(function (d) { return d.tipo; }).join(' + ') : '—') : '') + '</strong></div>' +
      '</div></div>';

    var body = hero + '<div class="tabs" style="margin-top:14px">' + tabs.map(function (x) {

      '</div><div class="banner banner-info" style="margin-top:12px">' + U.icon('plane') + '<span>El sistema consultará el estado del vuelo cada ' + (S.settings().vuelos.intervalo || 5) + ' minutos y avisará si se retrasa, se adelanta o aterriza.</span></div>';
