      ar.push({

      dop: C.r2(sum(deposits.filter(function (d) { return d.moneda === 'DOP' && d.monto > 0; }), function (d) { return d.monto; })),

      var inc = sum(ms.filter(isIncome), function (m) { return m.montoUSD; });

      var propTel = (v && v.propietarioTel) || (r.vehiculoSnapshot && r.vehiculoSnapshot.propietarioTel) || '';
      var vehLabel = v ? (((v.marca ? v.marca + ' ' : '') + v.modelo + ' ' + v.anio).trim()) : ((r.vehiculoSnapshot && ((r.vehiculoSnapshot.marca ? r.vehiculoSnapshot.marca + ' ' : '') + r.vehiculoSnapshot.modelo)) || 'Vehículo invitado');
      var vehPlaca = (v && v.placa) || (r.vehiculoSnapshot && r.vehiculoSnapshot.placa) || 'EXTERNO';
      ownerSettlements.push({
        id: r.id,
        propietario: propNombre,
        tel: propTel,
        vehiculo: vehLabel,
        placa: vehPlaca,
        esInvitado: !!(r.esVehiculoInvitado || r.vehiculoId === 'INVITADO'),
        cliente: r.clienteSnapshot.nombre,
        salida: r.salida,
        retorno: r.retorno,
        dias: t.dias,
        tarifaClienteUSD: r.tarifaMoneda === 'DOP' ? C.r2(r.tarifaMonto / t.tasa) : r.tarifaMonto,
        totalClienteUSD: t.totalUSD,
        costoDiaUSD: t.costoDiaUSD,
        brutoDuenoUSD: t.costoPropietarioBrutoUSD,
        descuentoDuenoUSD: t.descuentoPropietarioUSD,
        conceptoDescuento: r.conceptoDescuentoPropietario || '',
        netoDuenoUSD: t.costoPropietarioTotalUSD,
        netoDuenoDOP: t.costoPropietarioTotalDOP,
        gananciaAgenciaUSD: t.gananciaNetaUSD,
        pagado: !!r.propietarioPagado,
        estadoContrato: r.estado
      });
    });
    ownerSettlements.sort(function (a, b) {
      if (a.pagado !== b.pagado) return a.pagado ? 1 : -1;
      return a.salida < b.salida ? 1 : -1;
    });

    var ownerByPersonMap = {};
    ownerSettlements.forEach(function (o) {
      var k = o.propietario || 'Propietario externo';
      if (!ownerByPersonMap[k]) {
        ownerByPersonMap[k] = { propietario: k, tel: o.tel, contratos: 0, dias: 0, facturadoUSD: 0, brutoDuenoUSD: 0, descuentosUSD: 0, netoDuenoUSD: 0, pagadoUSD: 0, pendienteUSD: 0, gananciaAgenciaUSD: 0 };
      }
      var g = ownerByPersonMap[k];
      g.contratos++;
      g.dias += o.dias;
      g.facturadoUSD = C.r2(g.facturadoUSD + o.totalClienteUSD);
      g.brutoDuenoUSD = C.r2(g.brutoDuenoUSD + o.brutoDuenoUSD);
      g.descuentosUSD = C.r2(g.descuentosUSD + o.descuentoDuenoUSD);
      g.netoDuenoUSD = C.r2(g.netoDuenoUSD + o.netoDuenoUSD);
      if (o.pagado) g.pagadoUSD = C.r2(g.pagadoUSD + o.netoDuenoUSD);
      else g.pendienteUSD = C.r2(g.pendienteUSD + o.netoDuenoUSD);
      g.gananciaAgenciaUSD = C.r2(g.gananciaAgenciaUSD + o.gananciaAgenciaUSD);
    });
    var ownerGroups = Object.keys(ownerByPersonMap).map(function (k) { return ownerByPersonMap[k]; }).sort(function (a, b) { return b.netoDuenoUSD - a.netoDuenoUSD; });

    var ownerTotals = {
      count: ownerSettlements.length,
      dias: sum(ownerSettlements, function (x) { return x.dias; }),
      facturadoUSD: C.r2(sum(ownerSettlements, function (x) { return x.totalClienteUSD; })),
      brutoUSD: C.r2(sum(ownerSettlements, function (x) { return x.brutoDuenoUSD; })),
      descuentosUSD: C.r2(sum(ownerSettlements, function (x) { return x.descuentoDuenoUSD; })),
      netoUSD: C.r2(sum(ownerSettlements, function (x) { return x.netoDuenoUSD; })),
      netoDOP: C.r2(sum(ownerSettlements, function (x) { return x.netoDuenoDOP; })),
      pagadoUSD: C.r2(sum(ownerSettlements.filter(function (x) { return x.pagado; }), function (x) { return x.netoDuenoUSD; })),
      pendienteUSD: C.r2(sum(ownerSettlements.filter(function (x) { return !x.pagado; }), function (x) { return x.netoDuenoUSD; })),
      pendienteCount: ownerSettlements.filter(function (x) { return !x.pagado; }).length,
      gananciaAgenciaUSD: C.r2(sum(ownerSettlements, function (x) { return x.gananciaAgenciaUSD; }))
    };

    return {
      desde: desde, hasta: hasta, hoy: hoy, days: days.length, vehiculoId: vehicleFilter,
      vehicles: rows, totals: totals, unallocated: unallocated,
      ar: ar, arTotal: arTotal,
      deposits: deposits, depositTotals: depositTotals,
      ownerSettlements: ownerSettlements, ownerGroups: ownerGroups, ownerTotals: ownerTotals,
      channels: channels, monthly: monthly, late: late, clients: clients
    };
  }

  function csvVehicle(report) {
    var headers = ['Vehículo', 'Placa', 'Días disponibles', 'Días ocupados', 'Días bloqueados', 'Ocupación %', 'Ingresos USD', 'Ingresos renta USD', 'Costos USD', 'Mantenimiento USD', 'Margen USD', 'Km', 'Ingreso/km', 'Costo/km'];
    var rows = report.vehicles.map(function (v) {

    });
    if (report.unallocated.count) {
      rows.push(['Sin asignar / fuera de flota', '', '', '', '', '', report.unallocated.income, '', report.unallocated.costs, '', report.unallocated.margin, '', '', '']);
    }

  }

  function csvAR(report) {
    var headers = ['Contrato', 'Cliente', 'Teléfono', 'Vehículo', 'Salida', 'Retorno', 'Total USD', 'Pagado USD', 'Pendiente USD', 'Pendiente DOP', 'Días vencido', 'Bucket', 'Estado'];
    var rows = report.ar.map(function (a) {
      return [a.id, a.cliente, a.tel, a.vehiculo, a.salida, a.retorno, a.totalUSD, a.pagadoUSD, a.pendienteUSD, a.pendienteDOP, a.diasVencido, a.bucket, a.estado];
    });
    return C.toCSV(headers, rows);
  }

  function csvDeposits(report) {
    var headers = ['Contrato', 'Cliente', 'Vehículo', 'Tipo', 'Monto', 'Moneda', 'Detalle', 'Fecha', 'Días retenido', 'Estado del contrato'];
    var rows = report.deposits.map(function (d) {
      return [d.reservaId, d.cliente, d.vehiculo, d.tipo, d.monto, d.moneda, d.detalle, d.fecha, d.antiguedad, d.estadoReserva];
    });
    return C.toCSV(headers, rows);
  }

  function csvOwners(report) {
    var headers = ['Contrato', 'Propietario', 'Teléfono Dueño', 'Vehículo', 'Placa', 'Cliente', 'Salida', 'Retorno', 'Días', 'Facturado Cliente USD', 'Costo Día Dueño USD', 'Subtotal Dueño USD', 'Descuento Taller/Adelanto USD', 'Motivo Descuento', 'Neto a Pagar Dueño USD', 'Neto a Pagar Dueño DOP', 'Ganancia Neta Agencia USD', 'Estado Liquidación'];
    var rows = (report.ownerSettlements || []).map(function (o) {
      return [o.id, o.propietario, o.tel, o.vehiculo, o.placa, o.cliente, o.salida, o.retorno, o.dias, o.totalClienteUSD, o.costoDiaUSD, o.brutoDuenoUSD, o.descuentoDuenoUSD, o.conceptoDescuento, o.netoDuenoUSD, o.netoDuenoDOP, o.gananciaAgenciaUSD, o.pagado ? 'Liquidado' : 'Pendiente'];
    });
    return C.toCSV(headers, rows);
  }

  root.Reports = {
    build: build, presetRange: presetRange, daysList: daysList, firstOfMonth: firstOfMonth,
    lastOfMonth: lastOfMonth, monthKey: monthKey, monthLabel: monthLabel,
    csvVehicle: csvVehicle, csvAR: csvAR, csvDeposits: csvDeposits, csvOwners: csvOwners,
    RENT_CATS: RENT_CATS
  };

<script>
/* ==== cloud.js ==== */
/* Castillo Rent Car ERP — Autenticación Real + Nube Supabase (Auth + RLS + Roles) */
(function (root) {
  'use strict';
  var C = root.Core;
  var S = root.Store;

  var STORE_KEY = 'castillo_erp_cloud_v1';
  var DEFAULT_URL = 'https://lpobazowgswimkptjwlp.supabase.co';
  var DEFAULT_KEY = 'sb_publishable_KT9nGZMC8lFDNQcoXScKkQ_Bewrna8w';

  var cfg = {
    enabled: true,
    url: DEFAULT_URL,
    key: DEFAULT_KEY,
    token: '',
    refresh: '',
    user: null,
    role: '',
    version: 0,
    lastSync: '',
    pending: false,
    status: 'auth'
  };
  var conflict = null;
  var conflictShown = false;
  var busy = false;
  var applying = false;
  var pollTimer = null;
  var pushTimer = null;
  var remoteRow = null;

  function normalizeUrl(u) {
    return String(u || '').trim()
      .replace(/\/+$/, '')
      .replace(/\/rest\/v1$/i, '')
      .replace(/\/auth\/v1$/i, '')
      .replace(/\/+$/, '');
  }
  function now() { return C.nowStamp(); }

  function roleOf(user) {
    if (!user) return '';
    var appMeta = user.app_metadata || {};
    var userMeta = user.user_metadata || {};
    var r = String(appMeta.erp_role || userMeta.erp_role || '').toLowerCase();
    if (r === 'admin' || r === 'operator') return r;
    // Si el correo contiene elmer o admin, asignar admin por defecto si no tiene metadata
    var email = String(user.email || '').toLowerCase();
    if (email.indexOf('elmer') >= 0 || email.indexOf('admin') >= 0) return 'admin';
    return 'operator';
  }

  function empleadoIdOf(user, role) {
    if (!user) return 'EMP-001';
    var appMeta = user.app_metadata || {};
    var userMeta = user.user_metadata || {};
    if (appMeta.empleado_id || userMeta.empleado_id) return appMeta.empleado_id || userMeta.empleado_id;
    return role === 'admin' ? 'EMP-001' : 'EMP-002';
  }

  function hasData(d) {
    if (!d) return false;
    return ['flota', 'reservas', 'clientes', 'finanzas', 'bitacora'].some(function (k) {
      return Array.isArray(d[k]) && d[k].length > 0;
    });
  }

  function normalizeData(d) {
    if (!d || typeof d !== 'object') return null;
    return C.normalizeDB(d);
  }

  function statusText() {
    var map = {
      local: 'Modo local',
      auth: 'Supabase: inicia sesión',
      connecting: 'Supabase: conectando…',
      online: 'Supabase: sincronizado',
      syncing: 'Supabase: guardando…',
      pending: 'Supabase: cambios pendientes',
      offline: 'Sin internet · guardado local',
      conflict: 'Supabase: conflicto de versión',
      update: 'Supabase: actualización lista',
      error: 'Supabase: error de conexión'
    };
    return map[cfg.status] || 'Supabase';
  }

  function toneFor(status) {
    if (status === 'online') return 'ok';
    if (status === 'conflict' || status === 'error') return 'bad';
    return 'warn';
  }

  function load() {
    try {
      var raw = root.localStorage.getItem(STORE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        Object.keys(cfg).forEach(function (k) { if (saved[k] !== undefined) cfg[k] = saved[k]; });
      }
    } catch (e) {}
    cfg.enabled = true; // Siempre activo para exigir login y sincronizar con Supabase
    cfg.url = normalizeUrl(cfg.url || DEFAULT_URL) || DEFAULT_URL;
    cfg.key = cfg.key || DEFAULT_KEY;
  }

  function save() {
    try { root.localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  function enforceActorRole() {
    if (!S || !cfg.user) return;
    var empId = empleadoIdOf(cfg.user, cfg.role);
    var empleados = S.settings().empleados || [];
    if (cfg.role === 'operator') {
      var target = empleados.filter(function (e) { return e.id === empId; })[0] ||
                   empleados.filter(function (e) { return String(e.rol || '').toLowerCase().indexOf('propietario') < 0; })[0] ||
                   empleados[0];
      if (target && S.ui.actorId !== target.id) {
        S.setActor(target.id);
      }
    } else if (empId && empleados.some(function (e) { return e.id === empId; })) {
      if (!S.ui.actorId) S.setActor(empId);
    }
  }

  function updateStateBanner() {
    if (!root.document) return;
    var bar = root.document.getElementById('app-state-bar');
    if (!bar) return;
    if (cfg.status === 'syncing' || cfg.status === 'connecting') {
      bar.className = 'state-bar loading no-print';
      bar.innerHTML = '<span>⏳ Sincronizando datos con Supabase…</span><span>v' + C.VERSION + '</span>';
      bar.hidden = false;
    } else if (cfg.status === 'error' || cfg.status === 'conflict') {
      bar.className = 'state-bar error no-print';
      bar.innerHTML = '<span>⚠️ ' + (cfg.status === 'conflict' ? 'Conflicto de versión en Supabase.' : 'No se pudo sincronizar con Supabase.') + '</span>' +
        '<button class="btn btn-sm btn-outline" data-act="cloud-sync">Reintentar</button>';
      bar.hidden = false;
    } else if (cfg.status === 'offline' && cfg.pending) {
      bar.className = 'state-bar offline no-print';
      bar.innerHTML = '<span>📡 Sin conexión: los cambios están guardados en este dispositivo y se subirán a Supabase al reconectar.</span>' +
        '<button class="btn btn-sm btn-outline" data-act="cloud-sync">Subir ahora</button>';
      bar.hidden = false;
    } else {
      bar.hidden = true;
    }
  }

  function updateUI() {
    if (!root.document) return;
    var line = root.document.getElementById('cloud-status');
    var txt = root.document.getElementById('cloud-text');
    if (line) {
      line.hidden = false;
      line.setAttribute('title', statusText() + (cfg.lastSync ? ' · ' + cfg.lastSync : ''));
      var dot = line.querySelector('.dot');
      if (dot) dot.className = 'dot ' + toneFor(cfg.status);
      if (txt) txt.textContent = statusText() + (cfg.lastSync && cfg.status === 'online' ? ' · ' + cfg.lastSync.slice(11, 16) : '');
    }
    var logoutBtn = root.document.getElementById('footer-logout-btn');
    if (logoutBtn) logoutBtn.hidden = !cfg.token;

    var activeRole = cfg.role || (S && S.actorRole ? S.actorRole() : 'admin');
    var rolePill = root.document.getElementById('actor-role-pill');
    var actorSel = root.document.getElementById('actor-select');
    if (rolePill) {
      rolePill.textContent = activeRole === 'admin' ? 'Rol: Admin' : 'Rol: Operador';
      rolePill.className = 'role-pill ' + (activeRole === 'admin' ? 'admin' : 'operator');
    }
    if (actorSel) {
      actorSel.disabled = (!!cfg.token && activeRole === 'operator');
      actorSel.title = actorSel.disabled ? 'Tu cuenta de Operador está fijada a este perfil' : 'Seleccionar empleado activo';
    }

    root.document.querySelectorAll('[data-cloud-email]').forEach(function (el) { el.textContent = cfg.user && cfg.user.email ? cfg.user.email : '—'; });
    root.document.querySelectorAll('[data-cloud-role]').forEach(function (el) { el.textContent = activeRole === 'admin' ? 'Administrador (Control total)' : 'Operador (Mostrador)'; });
    root.document.querySelectorAll('[data-cloud-version]').forEach(function (el) { el.textContent = cfg.version ? 'v' + cfg.version : '—'; });
    root.document.querySelectorAll('[data-cloud-last]').forEach(function (el) { el.textContent = cfg.lastSync ? C.fmtStamp(cfg.lastSync) : '—'; });
    root.document.querySelectorAll('[data-cloud-pending]').forEach(function (el) { el.textContent = cfg.pending ? 'Sí' : 'No'; });
    root.document.querySelectorAll('[data-cloud-status]').forEach(function (el) { el.textContent = statusText(); });
    root.document.querySelectorAll('[data-cloud-auth]').forEach(function (el) { el.hidden = !cfg.token; });
    root.document.querySelectorAll('[data-cloud-noauth]').forEach(function (el) { el.hidden = !!cfg.token; });
    root.document.querySelectorAll('[data-cloud-admin]').forEach(function (el) { el.hidden = activeRole !== 'admin'; });
    root.document.querySelectorAll('[data-cloud-endpoint]').forEach(function (el) { el.textContent = cfg.url || '—'; });
    updateStateBanner();
  }

  function setStatus(st) {
    cfg.status = st;
    save();
    updateUI();
  }

  function friendlyError(e) {
    var m = String(e && e.message || 'Error de conexión');
    if (/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/email not confirmed/i.test(m)) return 'El correo no está confirmado en Supabase (activa Auto Confirm al crear el usuario).';
    if (/user not found/i.test(m)) return 'El usuario no existe en Supabase.';
    if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Sin conexión con Supabase. Verifica tu internet.';
    if (/row-level security|permission denied|violates row-level/i.test(m)) return 'Permiso denegado por RLS en Supabase. Verifica que el usuario tenga app_metadata {"erp_role":"admin"} o {"erp_role":"operator"}.';
    return m;
  }

  async function raw(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {});
    if (cfg.key) headers.apikey = cfg.key;
    if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    if (opts.auth !== false && cfg.token) headers.Authorization = 'Bearer ' + cfg.token;
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : null;
    try {
      var res = await fetch(cfg.url + path, {
        method: opts.method || 'GET',
        headers: headers,
        body: opts.body,
        signal: ctl ? ctl.signal : undefined
      });
      var text = await res.text();
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!res.ok) {
        var err = new Error((data && (data.message || data.error_description || data.msg || data.error)) || ('HTTP ' + res.status));
        err.status = res.status;
        err.code = data && data.code;
        err.body = data;
        throw err;
      }
      return { data: data, status: res.status };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  async function refreshSession() {
    if (!cfg.refresh) throw new Error('La sesión expiró. Inicia sesión de nuevo.');
    var r = await raw('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', auth: false,
      body: JSON.stringify({ refresh_token: cfg.refresh })
    });
    var d = r.data || {};
    if (!d.access_token) throw new Error('No se pudo renovar la sesión.');
    cfg.token = d.access_token;
    cfg.refresh = d.refresh_token || cfg.refresh;
    cfg.user = d.user || cfg.user;
    cfg.role = roleOf(cfg.user);
    save();
  }

  async function http(path, opts) {
    try {
      return await raw(path, opts);
    } catch (e) {
      if (e.status === 401 && opts && opts.auth !== false && cfg.refresh && !opts._retry) {
        await refreshSession();
        return raw(path, Object.assign({}, opts, { _retry: true }));
      }
      throw e;
    }
  }

  async function getState() {
    var r = await http('/rest/v1/erp_state?id=eq.main&select=id,data,version,updated_at,updated_by');
    var rows = Array.isArray(r.data) ? r.data : (r.data ? [r.data] : []);
    return rows[0] || null;
  }

  async function saveState(data, baseVersion) {
    var payload = JSON.stringify(data);
    var size = 0;
    try { size = new Blob([payload]).size; } catch (e) { size = payload.length; }
    if (size > 4 * 1024 * 1024) throw new Error('Los datos superan 4 MB; no se pueden guardar en la nube.');
    var body = {
      data: data,
      version: Number(baseVersion) + 1,
      updated_at: new Date().toISOString(),
      updated_by: cfg.user && cfg.user.email ? cfg.user.email : ''
    };
    if (!baseVersion) {
      try {
        var created = await http('/rest/v1/erp_state', {
          method: 'POST',
          headers: { Prefer: 'return=representation' },
          body: JSON.stringify(Object.assign({ id: 'main' }, body))
        });
        var rows = Array.isArray(created.data) ? created.data : [created.data];
        return { ok: true, row: rows[0] };
      } catch (e) {
        if (e.status === 409) return { ok: false, conflict: true, current: await getState() };
        throw e;
      }
    }
    var updated = await http('/rest/v1/erp_state?id=eq.main&version=eq.' + encodeURIComponent(baseVersion), {
      method: 'PATCH',
      headers: { Prefer: 'return=representation' },
      body: JSON.stringify(body)
    });
    var urows = Array.isArray(updated.data) ? updated.data : (updated.data ? [updated.data] : []);
    if (!urows.length) return { ok: false, conflict: true, current: await getState() };
    return { ok: true, row: urows[0] };
  }

  function backupLocal(reason) {
    try {
      root.localStorage.setItem('castillo_erp_v3_backup', JSON.stringify(S.data()));
      root.localStorage.setItem('castillo_erp_cloud_backup_reason', reason || '');
    } catch (e) {}
  }

  function applyRow(row, notify) {
    if (!row || !row.data) return false;
    var data = normalizeData(row.data);
    if (!data) return false;
    backupLocal('Antes de cargar Supabase');
    applying = true;
    try {
      S.replaceDB(data, { reason: 'Sincronizado desde Supabase' });
    } finally {
      applying = false;
    }
    cfg.version = Number(row.version) || 1;
    cfg.lastSync = now();
    cfg.pending = false;
    conflict = null;
    conflictShown = false;
    setStatus('online');
    enforceActorRole();
    if (notify && root.UI) root.UI.toast('Datos sincronizados desde Supabase.', 'success', 'Nube al día');
    return true;
  }

  async function afterLogin() {
    var row = await getState();
    if (row && hasData(row.data)) {
      if (cfg.pending) {
        setConflict(row);
        return;
      }
      applyRow(row, false);
    } else if (hasData(S.data())) {
      // Si Supabase está vacío y hay datos en localStorage, los importa automáticamente a Supabase
      var baseVer = row ? Number(row.version) || 0 : 0;
      var res = await saveState(S.data(), baseVer);
      if (res.ok && res.row) {
        cfg.version = Number(res.row.version) || 1;
        cfg.lastSync = now();
        cfg.pending = false;
      }
    }
    cfg.lastSync = now();
    cfg.pending = false;
    setStatus('online');
    enforceActorRole();
    save();
    startPolling();
  }

  async function login(email, password) {
    if (!cfg.url || !cfg.key) throw new Error('Configura la URL y Publishable Key de Supabase.');
    setStatus('connecting');
    try {
      var cleanEmail = String(email || '').trim();
      var r = await http('/auth/v1/token?grant_type=password', {
        method: 'POST', auth: false,
        body: JSON.stringify({ email: cleanEmail, password: String(password || '') })
      });
      var d = r.data || {};
      if (!d.access_token) throw new Error('Supabase no devolvió sesión activa.');
      cfg.enabled = true;
      cfg.token = d.access_token;
      cfg.refresh = d.refresh_token || '';
      cfg.user = d.user || null;
      cfg.role = roleOf(cfg.user);
      save();
      await afterLogin();
      return { ok: true };
    } catch (e) {
      setStatus('auth');
      save();
      throw new Error(friendlyError(e));
    }
  }

  async function logoutRemote() {
    try {
      if (cfg.token) await http('/auth/v1/logout', { method: 'POST' });
    } catch (e) {}
  }

  function clearAuth(preservePending) {
    cfg.token = '';
    cfg.refresh = '';
    cfg.user = null;
    cfg.role = '';
    if (!preservePending) {
      cfg.version = 0;
      cfg.pending = false;
    }
    conflict = null;
    conflictShown = false;
    save();
  }

  async function logout(ask) {
    if (ask && root.UI) {
      var ok = await root.UI.confirm({
        title: 'Cerrar sesión',
        message: 'Se bloqueará la pantalla y se pedirá tu correo y contraseña de Supabase para volver a entrar.',
        confirmText: 'Cerrar sesión', danger: true
      });
      if (!ok) return;
    }
    if (cfg.pending && root.navigator.onLine !== false) {
      try { await push(); } catch (e) {}
    }
    await logoutRemote();
    clearAuth(false);
    stopPolling();
    setStatus('auth');
    updateUI();
    renderAuthGate();
  }

  function setConflict(row) {
    conflict = {
      version: row ? Number(row.version) || 0 : 0,
      updatedAt: row ? row.updated_at || '' : '',
      updatedBy: row ? row.updated_by || '' : ''
    };
    cfg.pending = true;
    setStatus('conflict');
    if (!conflictShown) showConflict();
  }

  function showConflict() {
    if (!root.UI || root.UI.modalOpen) return;
    conflictShown = true;
    var c = conflict || {};
    root.UI.openModal({
      title: 'Conflicto de sincronización en Supabase',
      subtitle: 'Otro dispositivo guardó cambios antes que este',
      size: 'narrow',
      body: '<div class="banner banner-warn">' + root.UI.icon('alert') + '<div><strong>La base de datos en Supabase cambió (v' + (c.version || '?') + ').</strong><br>' +
        (c.updatedBy ? 'Última modificación por ' + root.UI.esc(c.updatedBy) : '') + '</div></div>' +
        '<p class="small muted" style="margin-top:10px">Elige si deseas cargar los datos del servidor o sobrescribirlos con los de este dispositivo.</p>',
      footer: '<button class="btn btn-outline" data-cloud-cancel>Cancelar</button>' +
        '<button class="btn btn-danger-soft" data-cloud-pull>Cargar de Supabase</button>' +
        '<button class="btn btn-primary" data-cloud-push>Sobrescribir con mis datos</button>',
      onMount: function (rootEl) {
        rootEl.querySelector('[data-cloud-cancel]').addEventListener('click', function () { conflictShown = false; root.UI.closeModal(); });
        rootEl.querySelector('[data-cloud-pull]').addEventListener('click', function () { conflictShown = false; forceDownload(false); });
        rootEl.querySelector('[data-cloud-push]').addEventListener('click', function () { conflictShown = false; forceUpload(false); });
      }
    });
  }

  async function forceDownload(ask) {
    if (ask && root.UI) {
      var ok = await root.UI.confirm({
        title: 'Descargar desde Supabase',
        message: 'Se reemplazarán los datos de este navegador por la última versión guardada en Supabase (se guarda respaldo local previo).',
        confirmText: 'Descargar de Supabase', danger: true
      });
      if (!ok) return;
    }
    try {
      var row = await getState();
      if (!row || !row.data) {
        if (root.UI) root.UI.toast('Supabase aún no tiene datos guardados. Usa “Subir datos locales” primero.', 'info');
        return;
      }
      applyRow(row, true);
      if (root.UI) root.UI.closeModal();
    } catch (e) {
      if (root.UI) root.UI.toast(friendlyError(e), 'error', 'Supabase');
    }
  }

  async function forceUpload(ask) {
    if (ask && root.UI) {
      var ok = await root.UI.confirm({
        title: 'Importar y subir datos locales a Supabase',
        message: 'Se enviarán todos los contratos, clientes, flota y finanzas que tienes en este navegador hacia Supabase para compartirlos en todos tus equipos.',
        confirmText: 'Subir a Supabase ahora'
      });
      if (!ok) return;
    }
    try {
      setStatus('syncing');
      var current = await getState();
      var base = current ? Number(current.version) || 0 : 0;
      var res = await saveState(S.data(), base);
      if (!res.ok && res.conflict) {
        setConflict(res.current);
        return;
      }
      cfg.version = Number(res.row.version) || base + 1;
      cfg.lastSync = now();
      cfg.pending = false;
      conflict = null;
      conflictShown = false;
      setStatus('online');
      if (root.UI) { root.UI.closeModal(); root.UI.toast('Datos subidos y sincronizados en Supabase.', 'success', 'Supabase'); }
    } catch (e) {
      setStatus('error');
      if (root.UI) root.UI.toast(friendlyError(e), 'error', 'Supabase');
    }
  }

  async function push() {
    if (!cfg.enabled || !cfg.token || busy || applying) return;
    if (root.navigator.onLine === false) { setStatus('offline'); return; }
    busy = true;
    setStatus('syncing');
    try {
      var res = await saveState(S.data(), cfg.version);
      if (res.ok) {
        cfg.version = Number(res.row.version) || cfg.version + 1;
        cfg.lastSync = now();
        cfg.pending = false;
        conflict = null;
        conflictShown = false;
        setStatus('online');
        save();
      } else {
        cfg.pending = true;
        setConflict(res.current);
      }
    } catch (e) {
      if (e.status === 401) {
        clearAuth(true);
        setStatus('auth');
        renderAuthGate();
      } else {
        cfg.pending = true;
        setStatus('offline');
      }
    } finally {
      busy = false;
    }
  }

  async function pull(silent) {
    if (!cfg.enabled || !cfg.token || busy || applying || conflict) return;
    if (root.navigator.onLine === false) { setStatus('offline'); return; }
    try {
      var row = await getState();
      if (!row || !row.data) return;
      if (Number(row.version) > cfg.version) {
        if (cfg.pending) { setConflict(row); return; }
        if (root.UI && root.UI.modalOpen) { remoteRow = row; setStatus('update'); return; }
        applyRow(row, !silent);
      }
    } catch (e) {
      if (e.status === 401) {
        clearAuth(true);
        setStatus('auth');
        renderAuthGate();
      } else if (root.navigator.onLine === false) {
        setStatus('offline');
      }
    }
  }

  async function syncNow() {
    if (!cfg.token) { renderAuthGate(); return; }
    if (conflict) { showConflict(); return; }
    if (cfg.pending) await push(); else await pull(false);
    if (cfg.status === 'online' && root.UI) root.UI.toast('Sincronización con Supabase al día.', 'success', 'Supabase');
  }

  function onLocalPersist() {
    if (!cfg.enabled || !cfg.token || applying) return;
    if (conflict) { cfg.pending = true; save(); return; }
    cfg.pending = true;
    setStatus(root.navigator.onLine === false ? 'offline' : 'pending');
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { push(); }, 1000);
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (root.document && root.document.hidden) return;
      if (!cfg.enabled || !cfg.token || conflict || cfg.pending) return;
      pull(true);
    }, 18000);
  }

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  /* ---------------- GATE DE INICIO DE SESIÓN OBLIGATORIO (SUPABASE) ---------------- */

  function hideAuthGate() {
    var gate = root.document && root.document.getElementById('auth-gate');
    if (gate) { gate.hidden = true; gate.innerHTML = ''; }
    var appEl = root.document && root.document.getElementById('app');
    if (appEl) appEl.hidden = false;
    if (root.UI && typeof root.UI.renderNow === 'function') root.UI.renderNow();
  }

  function renderAuthGate() {
    if (!root.document) return;
    var appEl = root.document.getElementById('app');
    if (appEl) appEl.hidden = true;
    var v = root.document.getElementById('view');
    if (v) v.innerHTML = '';
    var gate = root.document.getElementById('auth-gate');
    if (!gate) return;
    gate.hidden = false;

    gate.innerHTML =
      '<div class="auth-card">' +
        '<div class="auth-brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 17H3v-4l2-5h14l2 5v4h-2"/><path d="M5 17h14"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 13h14"/></svg></div>' +
        '<div><h2>Castillo Rent Car · ERP</h2><p>Acceso protegido con Supabase · v' + C.VERSION + '</p></div></div>' +
        '<div class="banner banner-info" style="margin-bottom:14px">' +
          '<span>Ingresa con tu correo y contraseña de <strong>Supabase Auth</strong> para cargar y sincronizar contratos, clientes y fianzas.</span>' +
        '</div>' +
        '<div class="stack gap-10">' +
          '<div class="field"><label class="label" for="gate-email">Correo electrónico <span class="req">*</span></label><input class="input" id="gate-email" type="email" placeholder="tu@correo.com" autocomplete="username"></div>' +
          '<div class="field"><label class="label" for="gate-pass">Contraseña <span class="req">*</span></label><input class="input" id="gate-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>' +
          '<details style="font-size:11.5px;color:var(--muted)"><summary style="cursor:pointer;font-weight:700">Configuración avanzada de proyecto Supabase</summary>' +
            '<div class="stack gap-8" style="margin-top:8px">' +
              '<div class="field"><label class="label">Project URL</label><input class="input sm" id="gate-url" value="' + C.esc(cfg.url) + '"></div>' +
              '<div class="field"><label class="label">Publishable / Anon Key</label><input class="input sm" id="gate-key" value="' + C.esc(cfg.key) + '"></div>' +
            '</div>' +
          '</details>' +
          '<div id="auth-gate-error" class="hint" style="color:var(--red);font-weight:700"></div>' +
          '<button type="button" class="btn btn-primary btn-lg btn-block" id="gate-login-btn">Iniciar sesión</button>' +
        '</div>' +
        '<div class="tiny muted center" style="margin-top:14px">Ninguna contraseña se almacena en el navegador · Roles RLS activos</div>' +
      '</div>';

    var emailEl = gate.querySelector('#gate-email');
    var passEl = gate.querySelector('#gate-pass');
    var urlEl = gate.querySelector('#gate-url');
    var keyEl = gate.querySelector('#gate-key');
    var btn = gate.querySelector('#gate-login-btn');
    var err = gate.querySelector('#auth-gate-error');

    async function submit() {
      err.textContent = '';
      var em = emailEl.value.trim();
      var pw = passEl.value;
      if (!em || !pw) { err.textContent = 'Escribe tu correo y contraseña.'; return; }
      if (urlEl && urlEl.value.trim()) cfg.url = normalizeUrl(urlEl.value);
      if (keyEl && keyEl.value.trim()) cfg.key = keyEl.value.trim();
      btn.disabled = true;
      btn.classList.add('is-loading');
      try {
        await login(em, pw);
        hideAuthGate();
        if (root.UI) {
          root.UI.render();
          root.UI.toast('Bienvenido, ' + (cfg.user && cfg.user.email ? cfg.user.email : em) + ' (' + (cfg.role === 'admin' ? 'Administrador' : 'Operador') + ').', 'success', 'Conectado a Supabase');
        }
      } catch (ex) {
        btn.disabled = false;
        btn.classList.remove('is-loading');
        err.textContent = ex.message || 'No se pudo iniciar sesión.';
      }
    }

    btn.addEventListener('click', submit);
    [emailEl, passEl].forEach(function (el) {
      el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); submit(); } });
    });
    setTimeout(function () { try { emailEl.focus(); } catch (e) {} }, 60);
  }

  async function fetchLiveExchangeRate() {
    var resp = await fetch('https://open.er-api.com/v6/latest/USD', { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) throw new Error('No se pudo conectar al servicio de tasa cambiaria.');
    var json = await resp.json();
    var rate = Number(json && json.rates && json.rates.DOP);
    if (!rate || rate < 30 || rate > 150) throw new Error('Tasa recibida fuera de rango.');
    return {
      ok: true,
      tasa: C.r2(rate),
      updatedAt: C.nowStamp(),
      fuente: 'Mercado Cambiario (Automática)'
    };
  }

  function connect(url, key) {
    var u = normalizeUrl(url || cfg.url);
    var k = String(key || cfg.key || '').trim();
    if (!/^https?:\/\//i.test(u)) throw new Error('La URL de Supabase debe empezar con https://');
    if (!k) throw new Error('Falta la Publishable Key de Supabase.');
    cfg.url = u;
    cfg.key = k;
    cfg.enabled = true;
    save();
    updateUI();
    if (!cfg.token) renderAuthGate();
    return status();
  }

  function init() {
    load();
    updateUI();
    if (!S) return;
    S.onPersist(onLocalPersist);
    root.addEventListener('online', function () {
      if (!cfg.token) return;
      if (cfg.pending) push(); else pull(true);
    });
    root.addEventListener('offline', function () {
      if (cfg.token) setStatus('offline');
    });

    // En modo autotest (?selftest=1), desbloquear para correr las pruebas automáticas
    if (/[?&]selftest=1/.test(root.location.search || '')) {
      cfg.user = { email: 'elmer@castillorentcar.com', app_metadata: { erp_role: 'admin' } };
      cfg.role = 'admin';
      hideAuthGate();
      updateUI();
      return;
    }

    if (!cfg.token) {
      setStatus('auth');
      renderAuthGate();
      return;
    }

    setStatus('connecting');
    (async function () {
      try {
        var me = await http('/auth/v1/user');
        cfg.user = me.data || cfg.user;
        cfg.role = roleOf(cfg.user);
        hideAuthGate();
        enforceActorRole();
        var row = await getState();
        if (row && hasData(row.data)) {
          if (cfg.pending) setConflict(row);
          else if (Number(row.version) > cfg.version) applyRow(row, false);
          else setStatus('online');
        } else if (hasData(S.data())) {
          var res = await saveState(S.data(), row ? row.version : 0);
          if (res.ok && res.row) cfg.version = Number(res.row.version) || 1;
          setStatus('online');
        } else {
          setStatus('online');
        }
        startPolling();
        save();
        if (root.UI) root.UI.render();
      } catch (e) {
        if (e.status === 401 || e.status === 403) {
          clearAuth(true);
          setStatus('auth');
          renderAuthGate();
        } else {
          // Si ya tenía sesión válida pero abrió sin internet, permite trabajar offline
          hideAuthGate();
          enforceActorRole();
          setStatus('offline');
        }
      }
    })();
  }

  function status() {
    return {
      enabled: cfg.enabled,
      url: cfg.url,
      user: cfg.user,
      role: cfg.role || (S && S.actorRole ? S.actorRole() : 'admin'),
      version: cfg.version,
      lastSync: cfg.lastSync,
      pending: cfg.pending,
      status: cfg.status,
      conflict: conflict,
      hasToken: !!cfg.token
    };
  }

  root.Cloud = {
    init: init,
    connect: connect,
    login: login,
    logout: logout,
    showLogin: renderAuthGate,
    showConflict: showConflict,
    syncNow: syncNow,
    push: push,
    pull: pull,
    forceUpload: forceUpload,
    forceDownload: forceDownload,
    fetchLiveExchangeRate: fetchLiveExchangeRate,
    status: status,
    config: function () { return { enabled: cfg.enabled, url: cfg.url, key: cfg.key }; },
    isAdmin: function () { return (cfg.role || (S && S.actorRole ? S.actorRole() : 'admin')) === 'admin'; },
    updateUI: updateUI,
    url: DEFAULT_URL,
    key: DEFAULT_KEY
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ==== integrations.js ==== */
/* Castillo Rent Car ERP — integraciones: vuelos, WhatsApp, respaldos */
(function (root) {
  'use strict';
  var C = root.Core;
  var S = root.Store;

  var flightLastAt = '';
  var flightBusy = false;
  var bridgeStatus = { ok: null, message: 'Sin verificar', checked: '' };
  var pollTimer = null;
  var reminderTimer = null;
  var notified = {};

  function cfg() { return S.settings(); }
  function bridgeUrl() { return String(cfg().whatsapp.bridgeUrl || '').replace(/\/+$/, ''); }
  function bridgeReady() { return cfg().whatsapp.modo === 'puente' && !!bridgeUrl(); }
  function apiReady() { var v = cfg().vuelos; return v.modo === 'api' && !!v.endpoint; }

  async function fetchJSON(url, opts, ms) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = null;
    if (ctl) timer = setTimeout(function () { ctl.abort(); }, ms || 12000);
    try {
      var resp = await fetch(url, Object.assign({}, opts || {}, ctl ? { signal: ctl.signal } : {}));
      var text = await resp.text();
      var json = null;
      try { json = text ? JSON.parse(text) : {}; } catch (e) { throw new Error('La respuesta no es JSON válido'); }
      if (!resp.ok) throw new Error((json && (json.error || json.message)) || ('HTTP ' + resp.status));
      if (json && json.ok === false) throw new Error(json.error || 'La operación falló');
      return json;
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  /* ---------------- vuelos ---------------- */
  function vueloActual(res) {
    if (!res || !res.vuelo || !res.vuelo.activo) return null;
    if (res.vuelo.estado) {
      return {
        estado: res.vuelo.estado, etiqueta: res.vuelo.etiqueta || '', delay: Number(res.vuelo.retrasoMin) || 0,
        eta: res.vuelo.aterrizaje || '', fuente: res.vuelo.fuente || '', ultima: res.vuelo.ultima || ''
      };
    }
    return C.simularVuelo(res.vuelo);
  }

  function flightHeaders() {
    var v = cfg().vuelos;
    var h = { 'Accept': 'application/json' };
    if (v.apiKey) h[v.headerName || 'Authorization'] = String(v.headerPrefix || '') + v.apiKey;
    return h;
  }

  function parseFlight(json) {
    if (!json) return null;
    if (json.flight) return Object.assign({}, json.flight);
    if (json.status && (json.status.estado || json.status.etiqueta)) return Object.assign({}, json.status);
    if (json.estado) {
      return {
        estado: json.estado, etiqueta: json.etiqueta || '', delay: Number(json.delay != null ? json.delay : json.retrasoMin) || 0,
        eta: json.eta || json.aterrizaje || '', sched: json.sched || '', fuente: 'api'
      };
    }
    if (json.data) return C.normalizeFlightResponse(json);
    if (json.flight_status) return C.normalizeFlightResponse(json);
    return null;
  }

  async function trackReserva(res, opts) {
    opts = opts || {};
    var v = res && res.vuelo;
    if (!v || !v.activo || !v.numero) return { ok: false, error: 'El contrato no tiene un vuelo configurado.' };
    var previa = v.etiqueta || '';
    var previoEstado = v.estado || '';
    var state = null;
    var error = '';
    if (apiReady()) {
      try {
        var base = cfg().vuelos.endpoint;
        var sep = base.indexOf('?') >= 0 ? '&' : '?';
        var url = base + sep + 'flight=' + encodeURIComponent(v.numero) + '&num=' + encodeURIComponent(v.numero) + '&date=' + encodeURIComponent(v.fecha || C.todayISO());
        var json = await fetchJSON(url, { headers: flightHeaders() }, 12000);
        state = parseFlight(json);
        if (!state) throw new Error('La API devolvió un formato no reconocido');
      } catch (e) {
        error = e.name === 'AbortError' ? 'La consulta tardó demasiado' : e.message;
      }
    }
    if (!state) {
      state = C.simularVuelo(v);
      if (error) state.fuente = 'simulado (API con error)';
      else state.fuente = 'simulado';
    }
    var patch = {
      estado: state.estado || 'Programado', etiqueta: state.etiqueta || '', retrasoMin: Number(state.delay) || 0,
      aterrizaje: state.eta || '', fuente: state.fuente || '', horaSched: state.sched || ''
    };
    S.registrarVuelo(res.id, Object.assign(patch, { ultima: C.nowStamp() }));
    if (!opts.silent) { /* el guardado ya notifica a la interfaz */ }

    var alerta = '';
    var umbral = Number(cfg().vuelos.alertarMin) || 20;
    if (state.estado === 'Aterrizó' && previoEstado !== 'Aterrizó') alerta = 'El vuelo ' + v.numero + ' aterrizó. Coordina la entrega.';
    else if (state.etiqueta === 'Retrasado' && (previa !== 'Retrasado' || Math.abs((Number(state.delay) || 0) - (Number(v.retrasoMin) || 0)) >= 10)) alerta = 'El vuelo ' + v.numero + ' lleva ' + state.delay + ' min de retraso.';
    else if (state.etiqueta === 'Adelantado' && previa !== 'Adelantado') alerta = 'El vuelo ' + v.numero + ' se adelantó ' + Math.abs(state.delay) + ' min.';
    else if (state.estado === 'Abordando' && previoEstado !== 'Abordando') alerta = 'El vuelo ' + v.numero + ' está abordando.';
    if (error) alerta = (alerta ? alerta + ' ' : '') + 'No se pudo consultar la API: ' + error + '. Se muestra el estado simulado.';

    return { ok: !error, error: error, estado: state, alerta: alerta, fuente: patch.fuente };
  }

  async function trackAll(opts) {
    opts = opts || {};
    if (flightBusy) return { ok: false, error: 'Ya hay una consulta en curso.', alerts: [] };
    flightBusy = true;
    var list = S.vuelosProximos();
    var alerts = [];
    var errors = [];
    for (var i = 0; i < list.length; i++) {
      var r = await trackReserva(list[i], { silent: true });
      if (r.alerta) alerts.push({ reserva: list[i], texto: r.alerta });
      if (r.error) errors.push(r.error);
    }
    flightLastAt = C.nowHHMM();
    flightBusy = false;
    try { root.dispatchEvent(new CustomEvent('castillo:flights', { detail: { alerts: alerts, errors: errors } })); } catch (e) { }
    return { ok: errors.length === 0, count: list.length, alerts: alerts, errors: errors, at: flightLastAt };
  }

  function nextFlight() {
    var hoy = C.todayISO();
    return S.vuelosProximos().filter(function (r) {
      var v = vueloActual(r);
      return v && (v.estado === 'Programado' || v.estado === 'Abordando' || v.estado === 'En vuelo') && r.vuelo.fecha >= hoy;
    })[0] || null;
  }

  function statusClass(res) {
    var v = vueloActual(res);
    if (!v) return 'badge-slate';
    if (v.estado === 'Aterrizó') return 'status-pill landed';
    if (v.etiqueta === 'Retrasado' || v.estado === 'Cancelado') return 'status-pill delayed';
    if (v.etiqueta === 'Adelantado') return 'status-pill early';
    return 'status-pill on-time';
  }

  /* ---------------- WhatsApp ---------------- */
  function normalizarNumero(n) {
    var d = C.digits(n);
    if (!d) return '';
    if (d.length === 10 && d.charAt(0) !== '1') d = '1' + d;
    return d;
  }

  function waLink(numero, texto) {
    return 'https://wa.me/' + normalizarNumero(numero) + '?text=' + encodeURIComponent(texto || '');
  }

  function fianzaTexto(t) {
    var partes = [];
    if (t.fianzaUSD > 0) partes.push(C.money(t.fianzaUSD, 'USD'));
    if (t.fianzaDOP > 0) partes.push(C.money(t.fianzaDOP, 'DOP'));
    if (t.documentos && t.documentos.length) partes.push(t.documentos.map(function (d) { return d.tipo; }).join(' + '));
    return partes.length ? partes.join(' + ') : 'Sin fianza';
  }

  function varsReserva(res) {
    var t = S.totales(res);
    var v = S.vehiculoDeReserva ? S.vehiculoDeReserva(res) : S.vehiculo(res.vehiculoId);
    var emp = cfg().empresa;
    var vuelo = vueloActual(res) || {};
    return {
      cliente: String(res.clienteSnapshot.nombre || '').split(' ')[0],
      cliente_completo: res.clienteSnapshot.nombre || '',
      empresa: emp.nombre,
      vehiculo: v ? ((v.marca ? v.marca + ' ' : '') + v.modelo) : '',
      placa: v ? v.placa : '',
      salida: C.fmtDate(res.salida), hora_salida: res.horaSalida || '',
      retorno: C.fmtDate(res.retorno), hora_retorno: res.horaRetorno || '',
      total: C.money(t.total, res.tarifaMoneda),
      fianza: fianzaTexto(t),
      pendiente: C.money(t.pendienteUSD, 'USD'),
      pagado: C.money(t.pagadoUSD, 'USD'),
      contrato: res.id,
      vuelo: res.vuelo && res.vuelo.numero ? res.vuelo.numero : 'sin vuelo registrado',
      hora_vuelo: res.vuelo && res.vuelo.hora ? res.vuelo.hora : '',
      estado_vuelo: (vuelo.estado || '') + (vuelo.etiqueta ? ' · ' + vuelo.etiqueta : ''),
      punto_entrega: emp.puntoEntrega || emp.direccion || '',
      fecha: C.fmtDate(C.todayISO())
    };
  }

  function mensaje(tipo, res) {
    var plantillas = cfg().whatsapp.plantillas || {};
    var tpl = plantillas[tipo];
    if (!tpl) return '';
    return C.renderTemplate(tpl, varsReserva(res));
  }

  function registrarMensaje(numero, texto, estado, meta) {
    meta = meta || {};
    return S.addMensaje({
      para: numero, texto: texto, estado: estado,
      reservaId: meta.reservaId || '', proveedor: meta.proveedor || (bridgeReady() ? 'puente' : 'enlace'),
      waId: meta.waId || ''
    });
  }

  async function enviar(numero, texto, meta) {
    meta = meta || {};
    var to = normalizarNumero(numero);
    if (!to) return { ok: false, error: 'El cliente no tiene un número de WhatsApp válido.' };
    if (texto == null) texto = '';
    if (bridgeReady()) {
      try {
        var json = await fetchJSON(bridgeUrl() + '/wa/send', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: cfg().whatsapp.token, to: to, text: texto, meta: { reservaId: meta.reservaId || '' } })
        }, 15000);
        registrarMensaje(to, texto, 'Enviado', { reservaId: meta.reservaId, waId: json.id || json.messageId || '', proveedor: 'puente' });
        return { ok: true, via: 'puente', id: json.id || '' };
      } catch (e) {
        registrarMensaje(to, texto, 'Error: ' + e.message, { reservaId: meta.reservaId, proveedor: 'puente' });
        return { ok: false, error: e.message, fallbackUrl: waLink(to, texto) };
      }
    }
    registrarMensaje(to, texto, 'Abierto en WhatsApp', { reservaId: meta.reservaId, proveedor: 'enlace' });
    return { ok: true, via: 'enlace', url: waLink(to, texto) };
  }

  async function enviarPlantilla(tipo, res, extra) {
    var texto = mensaje(tipo, res);
    if (!texto) return { ok: false, error: 'La plantilla no está configurada.' };
    if (extra) texto += '\n\n' + extra;
    var out = await enviar(res.clienteSnapshot.tel, texto, { reservaId: res.id });
    if (out.ok && tipo === 'recordatorio') S.marcarRecordatorio(res.id, out.via === 'puente' ? 'WhatsApp (API)' : 'WhatsApp');
    return out;
  }

  function plantillasDisponibles() {
    return [
      { id: 'confirmacion', nombre: 'Confirmación de reserva', desc: 'Datos del vehículo, fechas, total y fianza.' },
      { id: 'recordatorio', nombre: 'Recordatorio de devolución', desc: 'Se envía 2 días antes del retorno.' },
      { id: 'saldo', nombre: 'Saldo pendiente', desc: 'Monto pendiente y cómo pagar.' },
      { id: 'entrega', nombre: 'Instrucciones de entrega', desc: 'Hora, documentos y depósito.' },
      { id: 'vuelo', nombre: 'Seguimiento de vuelo', desc: 'Estado del vuelo y punto de encuentro.' },
      { id: 'bienvenida', nombre: 'Bienvenida / cotización', desc: 'Respuesta inicial automática.' }
    ];
  }

  async function syncBridge() {
    if (!bridgeReady()) return { ok: false, skipped: true, error: 'Puente no configurado' };
    var hoy = C.todayISO();
    var items = S.data().reservas.filter(function (r) {
      return r.tipo === 'renta' && (r.estado === 'Activo' || r.estado === 'Confirmada') && r.retorno >= hoy;
    }).slice(0, 300).map(function (r) {
      var v = S.vehiculo(r.vehiculoId) || {};
      return {
        id: r.id, cliente: r.clienteSnapshot.nombre, tel: r.clienteSnapshot.tel, retorno: r.retorno,
        horaRetorno: r.horaRetorno, vehiculo: v.modelo || '', placa: v.placa || '',
        empresa: cfg().empresa.nombre, mensaje: mensaje('recordatorio', r)
      };
    });
    try {
      var out = await fetchJSON(bridgeUrl() + '/sync', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: cfg().whatsapp.token, recordatorioDias: cfg().operacion.recordatorioDias || 2, items: items })
      }, 12000);
      return { ok: true, count: out.count || items.length };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  async function fetchInbox() {
    if (!bridgeReady()) return { ok: false, error: 'Configura el puente de WhatsApp en Ajustes para recibir mensajes.' };
    try {
      var json = await fetchJSON(bridgeUrl() + '/wa/inbox?token=' + encodeURIComponent(cfg().whatsapp.token || '') + '&limit=50', {}, 12000);
      var nuevos = S.importInbox(json.messages || json.data || []);
      return { ok: true, nuevos: nuevos, total: (json.messages || []).length };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  async function testBridge() {
    if (!bridgeUrl()) { bridgeStatus = { ok: false, message: 'Falta la URL del puente', checked: C.nowHHMM() }; return bridgeStatus; }
    try {
      var json = await fetchJSON(bridgeUrl() + '/health?token=' + encodeURIComponent(cfg().whatsapp.token || ''), {}, 10000);
      bridgeStatus = { ok: true, message: (json.service || 'Puente conectado') + (json.whatsapp ? ' · WhatsApp ' + json.whatsapp : ''), checked: C.nowHHMM() };
    } catch (e) {
      bridgeStatus = { ok: false, message: e.message, checked: C.nowHHMM() };
    }
    return bridgeStatus;
  }

  function bridgeState() { return bridgeStatus; }

  /* ---------------- recordatorios / notificaciones ---------------- */
  async function pedirPermisoNotificaciones() {
    if (!('Notification' in root)) return 'unsupported';
    if (Notification.permission === 'granted') return 'granted';
    var p = await Notification.requestPermission();
    return p;
  }

  function notificar(titulo, cuerpo) {
    if (!('Notification' in root) || Notification.permission !== 'granted') return false;
    try { new Notification(titulo, { body: cuerpo, tag: titulo + cuerpo.slice(0, 20) }); return true; } catch (e) { return false; }
  }

  function revisarRecordatorios() {
    if (!cfg().operacion.notificaciones) return [];
    var pendientes = S.reminders().filter(function (r) { return !notified['rem-' + r.id]; });
    pendientes.forEach(function (r) {
      notified['rem-' + r.id] = true;
      notificar('Devolución en ' + (cfg().operacion.recordatorioDias || 2) + ' días', r.clienteSnapshot.nombre + ' · ' + (S.vehiculo(r.vehiculoId) || {}).placa + ' · ' + C.fmtDate(r.retorno));
    });
    return pendientes;
  }

  function iniciarPolling(onUpdate) {
    detenerPolling();
    var min = Math.max(2, Number(cfg().vuelos.intervalo) || 5);
    pollTimer = setInterval(function () {
      if (root.document && root.document.hidden) return;
      var targets = S.vuelosProximos();
      if (!targets.length) return;
      trackAll({ silent: true }).then(function (res) {
        if (onUpdate) onUpdate(res);
      });
    }, min * 60000);
    reminderTimer = setInterval(function () { revisarRecordatorios(); }, 30 * 60000);
  }

  function detenerPolling() {
    if (pollTimer) clearInterval(pollTimer);
    if (reminderTimer) clearInterval(reminderTimer);
    pollTimer = null; reminderTimer = null;
  }

  function flightMeta() {
    return { lastAt: flightLastAt, busy: flightBusy, apiReady: apiReady(), modo: cfg().vuelos.modo, bridge: bridgeStatus };
  }

  /* ---------------- descargas ---------------- */
  function download(nombre, contenido, mime) {
    try {
      var blob = new Blob([contenido], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = root.document.createElement('a');
      a.href = url; a.download = nombre;
      root.document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2500);
      return true;
    } catch (e) { return false; }
  }

  root.Integrations = {
    vueloActual: vueloActual, trackReserva: trackReserva, trackAll: trackAll, nextFlight: nextFlight,
    statusClass: statusClass, flightMeta: flightMeta, iniciarPolling: iniciarPolling, detenerPolling: detenerPolling,
    normalizarNumero: normalizarNumero, waLink: waLink, varsReserva: varsReserva, mensaje: mensaje,
    enviar: enviar, enviarPlantilla: enviarPlantilla, plantillasDisponibles: plantillasDisponibles,
    fetchInbox: fetchInbox, syncBridge: syncBridge, testBridge: testBridge, bridgeState: bridgeState, bridgeReady: bridgeReady,
    fianzaTexto: fianzaTexto, download: download, notificar: notificar,
    pedirPermisoNotificaciones: pedirPermisoNotificaciones, revisarRecordatorios: revisarRecordatorios
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== ui.js ==== */
/* Castillo Rent Car ERP — interfaz compartida */
(function (root) {
  'use strict';
  var C = root.Core;
  var S = root.Store;
  var I = root.Integrations;

  var renderQueued = false;
  var afterFns = [];
  var modalOpts = null;

  var TITLES = {
    dashboard: { title: 'Dashboard operativo', sub: 'Resumen del día, alertas y próximos movimientos' },
    calendario: { title: 'Calendario', sub: 'Disponibilidad de la flota · vista día, semana, mes, año y Gantt' },
    contratos: { title: 'Contratos y check-in', sub: 'Altas, entregas, devoluciones, pagos y fianzas' },
    flota: { title: 'Flota y taller', sub: 'Vehículos, mantenimiento, documentos y disponibilidad' },
    clientes: { title: 'Clientes y lista negra', sub: 'Historial, confiabilidad y contacto directo' },
    bitacora: { title: 'Bitácora', sub: 'Quejas, daños, observaciones e incidentes' },
    finanzas: { title: 'Finanzas y DGII', sub: 'Ingresos cobrados, gastos, impuestos y respaldos' },
    reportes: { title: 'Reportes gerenciales', sub: 'Rentabilidad, ocupación, cobranza, fianzas y canales' },
    whatsapp: { title: 'WhatsApp Business', sub: 'Plantillas, recordatorios y mensajes entrantes' },
    vuelos: { title: 'Vuelos en vivo', sub: 'Seguimiento de llegadas y alertas de cambios' },
    ajustes: { title: 'Ajustes', sub: 'Empresa, operación, equipo, integraciones y datos' }
  };

  function esc(v) { return C.esc(v); }
  function icon(name, cls) { return '<svg class="icon ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>'; }
  function money(n, cur) { return C.money(n, cur); }
  function fmtDate(v) { return C.fmtDate(v); }
  function fmtDateLong(v) { return C.fmtDateLong(v); }
  function initials(n) { return C.initials(n); }
  function badge(label, tone, ico) {
    return '<span class="badge badge-' + (tone || 'slate') + '">' + (ico ? icon(ico) : '') + esc(label) + '</span>';
  }
  function estadoBadge(estado) {
    var map = {
      'Activo': ['sky', 'En la calle'], 'Confirmada': ['lime', 'Confirmada'], 'Completado': ['slate', 'Completado'],
      'Cancelada': ['red', 'Cancelada'], 'Disponible': ['emerald', 'Disponible'], 'En Calle': ['sky', 'En la calle'],
      'Taller': ['amber', 'Taller'], 'Reservado': ['lime', 'Reservado'], 'Baja': ['slate', 'Fuera de servicio']
    };
    var m = map[estado] || ['slate', estado || '—'];
    return badge(m[1], m[0]);
  }
  function cobroBadge(t) {
    var tone = t.cobro === 'Pagado' ? 'emerald' : t.cobro === 'Parcial' ? 'amber' : t.cobro === 'Saldo a favor' ? 'violet' : 'slate';
    return badge(t.cobro, tone);
  }
  function avatar(nombre, cls) {
    return '<span class="avatar ' + (cls || '') + '">' + esc(initials(nombre)) + '</span>';
  }
  function docBadge(cli) {
    if (!cli || !cli.nivel || cli.nivel === 'Normal') return '';
    return badge(cli.nivel === 'Lista Negra' ? 'Lista negra' : 'VIP', cli.nivel === 'Lista Negra' ? 'red' : 'emerald', cli.nivel === 'Lista Negra' ? 'ban' : 'shield');
  }
  function empty(msg, sub, ico) {
    return '<div class="empty">' + icon(ico || 'info') + '<strong>' + esc(msg) + '</strong>' + (sub ? esc(sub) : '') + '</div>';
  }
  function field(label, input, opts) {
    opts = opts || {};
    return '<div class="field ' + (opts.span ? 'span-' + opts.span : '') + '">' +
      '<label class="label" ' + (opts.for ? 'for="' + esc(opts.for) + '"' : '') + '>' + esc(label) + (opts.req ? ' <span class="req">*</span>' : '') + '</label>' +
      input + (opts.hint ? '<span class="hint">' + opts.hint + '</span>' : '') + '</div>';
  }
  function options(list, selected, valueKey, labelKey, blank) {
    var html = blank != null ? '<option value="">' + esc(blank) + '</option>' : '';
    (list || []).forEach(function (item) {
      var val = valueKey ? item[valueKey] : item;
      var lab = labelKey ? item[labelKey] : item;
      html += '<option value="' + esc(val) + '"' + (String(val) === String(selected) ? ' selected' : '') + '>' + esc(lab) + '</option>';
    });
    return html;
  }
  function fuelOptions(selected) {
    var out = '<option value="">—</option>';
    for (var i = 8; i >= 1; i--) {
      var v = i + '/8';
      var label = v + (i === 8 ? ' (lleno)' : i === 4 ? ' (medio)' : i === 2 ? ' (1/4)' : '');
      out += '<option value="' + v + '"' + (selected === v ? ' selected' : '') + '>' + label + '</option>';
    }
    return out;
  }
  function toneFor(key) {
    return { 'En Calle': 'sky', 'Taller': 'amber', 'Disponible': 'emerald', 'Reservado': 'lime', 'Baja': 'slate' }[key] || 'slate';
  }
  function resumenCliente(res) {
    return esc(res.clienteSnapshot.nombre) + (res.clienteSnapshot.doc ? ' · ' + esc(res.clienteSnapshot.doc) : '');
  }
  function hoyTexto() { return C.fmtDateLong(C.todayISO()); }

  /* ---------------- render ---------------- */
  function renderNow() {
    var isSelfTest = /[?&]selftest=1/.test((root.location && root.location.search) || '');
    if (root.Cloud && typeof root.Cloud.status === 'function' && !root.Cloud.status().hasToken && !isSelfTest) {
      var v = document.getElementById('view');
      if (v) v.innerHTML = '';
      var appEl = document.getElementById('app');
      if (appEl) appEl.hidden = true;
      return;
    }
    var tab = S.ui.tab;
    if (!TITLES[tab]) tab = 'dashboard';
    var view = document.getElementById('view');
    if (!view) return;
    var fn = root.Views && root.Views[tab];
    var html = '';
    if (fn) {
      try { html = fn(); }
      catch (e) {
        console.error('Error renderizando ' + tab, e);
        html = '<div class="banner banner-danger">' + icon('alert') + '<div><strong>No se pudo dibujar esta sección.</strong><br>' + esc(e.message) + '</div></div>';
      }
    }
    view.innerHTML = html;
    var t = TITLES[tab];
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-sub').textContent = t.sub + ' · ' + hoyTexto();

    document.querySelectorAll('.nav-item').forEach(function (b) {
      var active = b.getAttribute('data-tab') === tab;
      b.classList.toggle('is-active', active);
      if (active) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    updateShell();
    if (root.PWA && root.PWA.updateUI) { try { root.PWA.updateUI(); } catch (e) { } }
    if (root.Cloud && root.Cloud.updateUI) { try { root.Cloud.updateUI(); } catch (e) { } }
    var fns = afterFns.slice(); afterFns = [];
    fns.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
  }

  function render() {
    if (renderQueued) return;
    renderQueued = true;
    root.requestAnimationFrame(function () { renderQueued = false; renderNow(); });
  }

  function afterRender(fn) { afterFns.push(fn); }

  function updateShell() {
    var k = S.kpis();
    var pend = S.pagosPendientes().length;
    var unread = S.data().inbox.filter(function (m) { return !m.leido; }).length;
    var vuelos = (S.data().reservas || []).filter(function (r) {
      if (!r.vuelo || !r.vuelo.activo) return false;
      return r.vuelo.estado === 'Aterrizó' || r.vuelo.etiqueta === 'Retrasado' || r.vuelo.etiqueta === 'Adelantado';
    }).length;
    setBadge('contratos', k.contratosActivos + k.proximas);
    setBadge('inbox', unread);
    setBadge('vuelos', vuelos);
    setBadge('flota', k.taller || 0);

    var alerts = S.alerts();
    var bell = document.getElementById('alert-count');
    if (bell) {
      bell.hidden = alerts.length === 0;
      bell.textContent = alerts.length;
    }

    var sel = document.getElementById('actor-select');
    if (sel && document.activeElement !== sel) {
      var emps = S.settings().empleados;
      var wanted = emps.map(function (e) { return e.id + '|' + e.nombre; }).join('~');
      if (sel.getAttribute('data-sig') !== wanted) {
        sel.innerHTML = emps.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.nombre) + '</option>'; }).join('');
        sel.setAttribute('data-sig', wanted);
      }
      if (sel.value !== S.ui.actorId) sel.value = S.ui.actorId;
    }
    var tasa = document.getElementById('tasa-input');
    if (tasa && document.activeElement !== tasa) tasa.value = S.tasa();
    var tInfo = S.tasaInfo ? S.tasaInfo() : { tasa: S.tasa(), updatedAt: '', fuente: 'Manual' };
    var tasaLbl = document.getElementById('tasa-updated-label');
    if (tasaLbl) {
      tasaLbl.textContent = 'Act.: ' + (tInfo.updatedAt ? C.fmtStamp(tInfo.updatedAt) : 'Hoy') + (tInfo.fuente ? ' (' + tInfo.fuente + ')' : '');
      tasaLbl.title = 'Última actualización de tasa USD → DOP: ' + (tInfo.updatedAt || '—');
    }

    var rolePill = document.getElementById('actor-role-pill');
    if (rolePill && S.actorRole) {
      var rRole = S.actorRole();
      rolePill.textContent = rRole === 'admin' ? 'Rol: Admin' : 'Rol: Operador';
      rolePill.className = 'role-pill ' + (rRole === 'admin' ? 'admin' : 'operator');
    }

    document.querySelectorAll('.mobile-bottom-nav button[data-tab]').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-tab') === S.ui.tab);
    });

    var st = S.storageStatus();
    var line = document.getElementById('storage-status');
    var txt = document.getElementById('storage-text');
    if (line && txt) {
      line.classList.toggle('is-error', !!st.error);
      line.querySelector('.dot').className = 'dot ' + (st.error ? 'bad' : 'ok');
      txt.textContent = st.error ? 'No se pudo guardar' : 'Respaldo local' + (st.lastSavedAt ? ' · ' + st.lastSavedAt : '');
      line.title = st.error || ('Almacenamiento: ' + Math.round(st.bytes / 1024) + ' KB');
    }
    var fs = document.getElementById('footer-status');
    if (fs) fs.textContent = st.error || ('Tasa RD$ ' + S.tasa().toFixed(2) + ' · Guardado ' + (st.lastSavedAt ? 'a las ' + st.lastSavedAt : 'en vivo'));
    var ver = document.getElementById('app-version');
    if (ver) ver.textContent = 'v' + C.VERSION;
    var sver = document.getElementById('sidebar-version');
    if (sver) sver.textContent = 'RENT CAR · ERP v' + C.VERSION;
  }

  function setBadge(name, n) {
    var el = document.querySelector('[data-badge="' + name + '"]');
    if (!el) return;
    el.textContent = n > 99 ? '99+' : (n || '');
    el.classList.toggle('is-visible', n > 0);
  }

  /* ---------------- modal ---------------- */
  function openModal(opts) {
    opts = opts || {};
    var rootEl = document.getElementById('modal-root');
    if (!rootEl) return;
    modalOpts = opts;
    var size = opts.size === 'wide' ? 'wide' : opts.size === 'xwide' ? 'xwide' : opts.size === 'narrow' ? 'narrow' : '';
    rootEl.innerHTML =
      '<div class="modal-backdrop" data-modal-backdrop>' +
      '<div class="modal-card ' + size + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || 'Diálogo') + '">' +
      '<div class="modal-head"><div><h3>' + esc(opts.title || '') + '</h3>' + (opts.subtitle ? '<p>' + esc(opts.subtitle) + '</p>' : '') + '</div>' +
      '<button type="button" class="icon-btn" data-act="close-modal" aria-label="Cerrar">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot ' + (opts.footerBetween ? 'between' : '') + '">' + opts.footer + '</div>' : '') +
      '</div></div>';
    document.body.classList.add('modal-open');
    var back = rootEl.querySelector('[data-modal-backdrop]');
    if (back && opts.dismissible !== false) {
      back.addEventListener('mousedown', function (e) { if (e.target === back) closeModal(); });
    }
    if (opts.onMount) { try { opts.onMount(rootEl); } catch (e) { console.error(e); } }
    setTimeout(function () {
      var first = rootEl.querySelector('input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), .modal-foot .btn-primary');
      if (first) { try { first.focus(); } catch (e) { } }
      if (opts.onReady) { try { opts.onReady(rootEl); } catch (e) { console.error(e); } }
      var sigCanvas = rootEl.querySelector('#firma-canvas');
      if (sigCanvas && sigCanvas.__sig) { try { sigCanvas.__sig.resize(); } catch (e) {} }
    }, 40);
  }

  function closeModal() {
    var rootEl = document.getElementById('modal-root');
    if (rootEl) rootEl.innerHTML = '';
    document.body.classList.remove('modal-open');
    if (modalOpts && modalOpts.onClose) { try { modalOpts.onClose(); } catch (e) { } }
    modalOpts = null;
  }

  function confirm(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      openModal({
        title: opts.title || 'Confirmar',
        subtitle: opts.subtitle || '',
        size: 'narrow',
        body: '<div class="stack" style="font-size:13px;color:var(--ink-2)">' + (opts.message || '') + '</div>',
        footer: '<button type="button" class="btn btn-outline" data-cancel>' + esc(opts.cancelText || 'Cancelar') + '</button>' +
          '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(opts.confirmText || 'Confirmar') + '</button>',
        onMount: function (rootEl) {
          rootEl.querySelector('[data-ok]').addEventListener('click', function () { resolve(true); closeModal(); });
          rootEl.querySelector('[data-cancel]').addEventListener('click', function () { resolve(false); closeModal(); });

  function ask(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var id = 'ask-' + Date.now();
      var input = opts.multiline
        ? '<textarea class="textarea" id="' + id + '" rows="3" placeholder="' + esc(opts.placeholder || '') + '">' + esc(opts.value || '') + '</textarea>'
        : '<input class="input" id="' + id + '" type="' + (opts.type || 'text') + '" placeholder="' + esc(opts.placeholder || '') + '" value="' + esc(opts.value || '') + '">';
      openModal({
        title: opts.title || 'Escribe',
        subtitle: opts.subtitle || '',
        size: 'narrow',
        body: '<div class="field"><label class="label" for="' + id + '">' + esc(opts.label || 'Valor') + (opts.required ? ' <span class="req">*</span>' : '') + '</label>' + input +
          (opts.hint ? '<span class="hint">' + opts.hint + '</span>' : '') + '<span class="hint" data-error style="color:var(--red)"></span></div>',
        footer: '<button type="button" class="btn btn-outline" data-cancel>Cancelar</button><button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(opts.confirmText || 'Aceptar') + '</button>',
        onMount: function (rootEl) {
          var el = rootEl.querySelector('#' + id);
          var err = rootEl.querySelector('[data-error]');
          function submit() {
            var v = el.value.trim();
            if (opts.required && !v) { err.textContent = 'Este dato es obligatorio.'; el.focus(); return; }
            resolve(v); closeModal();
          }
          rootEl.querySelector('[data-ok]').addEventListener('click', submit);
          rootEl.querySelector('[data-cancel]').addEventListener('click', function () { resolve(null); closeModal(); });
          el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !opts.multiline) { e.preventDefault(); submit(); } });
        },
        onClose: function () { resolve(null); }
      });
    });
  }

    type = type || 'info';
    var rootEl = document.getElementById('toast-root');
    if (!rootEl) return;
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = icon(type === 'success' ? 'check' : type === 'error' ? 'alert' : type === 'warn' ? 'alert' : 'info') +
      '<div><strong>' + esc(title || (type === 'success' ? 'Listo' : type === 'error' ? 'Error' : type === 'warn' ? 'Atención' : 'Aviso')) + '</strong>' +

  /* ---------------- signature ---------------- */
  function initSignature(canvas) {
    if (!canvas || canvas.__sig) return canvas && canvas.__sig;
    var ctx = canvas.getContext('2d');
    var dpr = Math.max(1, Math.min(3, root.devicePixelRatio || 1));
    var drawing = false;
    var hasInk = false;

    function resize() {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var img = hasInk ? canvas.toDataURL() : null;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 2.1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0f172a';
      if (img) {
        var im = new Image();
        im.onload = function () { ctx.drawImage(im, 0, 0, rect.width, rect.height); };
        im.src = img;
      }
    }
    function pos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function down(e) {
      drawing = true;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
      var p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      e.preventDefault();
    }
    function move(e) {
      if (!drawing) return;
      var p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      hasInk = true;
      e.preventDefault();
    }
    function up(e) {
      if (!drawing) return;
      drawing = false;
      ctx.beginPath();
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) { }
    }
    canvas.addEventListener('pointerdown', down);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('pointerleave', function (e) { if (drawing) up(e); });
    root.addEventListener('resize', resize);
    resize();
    canvas.__sig = {
      clear: function () {
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
        hasInk = false;
      },
      isEmpty: function () { return !hasInk; },
      toDataURL: function () { return hasInk ? canvas.toDataURL('image/png') : ''; },
      resize: resize
    };
    return canvas.__sig;
  }
