})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-people.js ==== */
/* Vistas: Clientes y Bitácora */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH;

  function db() { return S.data(); }

  function clientRows() {
    var f = S.ui.filtroClientes || 'TODOS';
    var q = String(S.ui.busquedaClientes || '').trim().toLowerCase();
    var list = S.clientesConStats().filter(function (x) {
      if (f !== 'TODOS' && x.cliente.nivel !== f) return false;
      if (q && (x.cliente.nombre + ' ' + x.cliente.doc + ' ' + x.cliente.tel).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!list.length) return '<tr><td colspan="6">' + U.empty('Sin clientes en este filtro', 'Agrega un cliente o cambia el filtro.', 'users') + '</td></tr>';
    return list.map(function (x) {
      var c = x.cliente, s = x.stats;
      return '<tr><td><div class="cell-client">' + U.avatar(c.nombre, c.nivel === 'Lista Negra' ? 'red' : c.nivel === 'VIP' ? 'green' : '') +
        '<div><div class="strong">' + U.esc(c.nombre) + ' ' + U.docBadge(c) + '</div><div class="sub">' + U.esc(c.doc || 'Sin documento') + ' · ' + U.esc(c.pais || '—') + '</div></div></div></td>' +
        '<td><div>' + U.esc(c.tel || '—') + '</div><div class="sub">' + U.esc(c.email || '') + '</div></td>' +
        '<td class="num"><strong>' + s.rentas + '</strong><div class="sub">' + C.money(s.gastoUSD, 'USD') + '</div></td>' +
        '<td>' + (s.ultima ? '<div>' + C.fmtDate(s.ultima) + '</div><div class="sub">' + C.relativeDay(s.ultima) + '</div>' : '<span class="muted">—</span>') + '</td>' +
        '<td>' + U.badge(c.nivel === 'Lista Negra' ? 'Lista negra' : c.nivel, c.nivel === 'Lista Negra' ? 'red' : c.nivel === 'VIP' ? 'emerald' : 'slate') + '</td>' +
        '<td><div class="row-actions">' +
        '<button class="icon-btn" data-act="client-detail" data-id="' + U.esc(c.id) + '" aria-label="Ver cliente">' + U.icon('eye') + '</button>' +
        (c.tel ? '<button class="icon-btn" data-act="wa-client" data-id="' + U.esc(c.id) + '" aria-label="WhatsApp">' + U.icon('whatsapp') + '</button>' : '') +
        '<button class="icon-btn" data-act="edit-client" data-id="' + U.esc(c.id) + '" aria-label="Editar">' + U.icon('edit') + '</button>' +
        '</div></td></tr>';
    }).join('');
  }

  root.Views = root.Views || {};
  root.Views.clientsRows = clientRows;

  root.Views.clientes = function () {
    var stats = S.clientesConStats();
    var counts = {
      TODOS: stats.length,
      VIP: stats.filter(function (x) { return x.cliente.nivel === 'VIP'; }).length,
      Normal: stats.filter(function (x) { return x.cliente.nivel === 'Normal'; }).length,
      'Lista Negra': stats.filter(function (x) { return x.cliente.nivel === 'Lista Negra'; }).length
    };
    var conActiva = stats.filter(function (x) { return db().reservas.some(function (r) { return r.clienteId === x.cliente.id && r.estado === 'Activo'; }); }).length;
    return '<div class="page">' +
      '<div class="page-top"><div><h2>Clientes y confiabilidad</h2><p>' + counts.TODOS + ' clientes registrados · ' + counts.VIP + ' VIP · ' + counts['Lista Negra'] + ' en lista negra.</p></div>' +
      '<div class="page-actions"><button class="btn btn-primary btn-sm" data-act="new-client">' + U.icon('plus') + ' Agregar cliente</button></div></div>' +
      '<div class="grid g4">' +
      VH.kpi('Clientes', counts.TODOS, 'Clic para ver todos →', 'users', '', 'data-act="client-filter" data-filter="TODOS" role="button"') +
      VH.kpi('VIP confiables', counts.VIP, 'Clic para filtrar VIP →', 'shield', 'emerald', 'data-act="client-filter" data-filter="VIP" role="button"') +
      VH.kpi('Con renta activa', conActiva, 'Clic para ver contratos activos →', 'route', 'sky', 'data-act="kpi-contracts" data-filter="ACTIVOS" role="button"') +
      VH.kpi('Lista negra', counts['Lista Negra'], 'Clic para ver lista negra →', 'ban', counts['Lista Negra'] ? 'amber' : '', 'data-act="client-filter" data-filter="Lista Negra" role="button"') +
      '</div>' +
      '<div class="card"><div class="card-head" style="gap:10px"><div class="row wrap gap-4" style="flex:1">' +
      [['TODOS', 'Todos'], ['VIP', 'VIP'], ['Normal', 'Normal'], ['Lista Negra', 'Lista negra']].map(function (f) {
        return '<button class="chip ' + (S.ui.filtroClientes === f[0] || (!S.ui.filtroClientes && f[0] === 'TODOS') ? 'is-active' : '') + '" data-act="client-filter" data-filter="' + f[0] + '">' + f[1] + ' <span class="count">' + counts[f[0]] + '</span></button>';
      }).join('') + '</div>' +
      '<div class="searchbox" style="width:240px;display:block">' + U.icon('search', 'search-ico') +
      '<input id="client-search" type="search" value="' + U.esc(S.ui.busquedaClientes || '') + '" placeholder="Buscar cliente o documento…" aria-label="Buscar clientes"></div></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Contacto</th><th class="num">Rentas</th><th>Última</th><th>Nivel</th><th></th></tr></thead>' +
      '<tbody id="clients-tbody">' + clientRows() + '</tbody></table></div></div></div>';
  };

  root.Views.clientForm = function (id) {
    var c = id ? S.cliente(id) : null;
    var body = '<div class="form-grid g2">' +
      U.field('Nombre completo', '<input class="input" id="cli-nombre" value="' + U.esc(c ? c.nombre : '') + '">', { req: true }) +
      U.field('Cédula / Pasaporte', '<input class="input" id="cli-doc" value="' + U.esc(c ? c.doc : '') + '">') +
      U.field('Teléfono / WhatsApp', '<input class="input" id="cli-tel" value="' + U.esc(c ? c.tel : '') + '">') +
      U.field('Email', '<input class="input" id="cli-email" type="email" value="' + U.esc(c ? c.email : '') + '">') +
      U.field('País', '<input class="input" id="cli-pais" value="' + U.esc(c ? c.pais : 'República Dominicana') + '">') +
      U.field('Licencia de conducir', '<input class="input" id="cli-licencia" value="' + U.esc(c ? c.licencia : '') + '">') +
      '<div class="span-2">' + U.field('Notas internas', '<textarea class="textarea" id="cli-notas" rows="2">' + U.esc(c ? c.notas : '') + '</textarea>') + '</div></div>' +
      (c ? '<div class="banner banner-info" style="margin-top:12px">' + U.icon('shield') + '<span>La clasificación (VIP / lista negra) se cambia desde el detalle del cliente, dejando motivo.</span></div>' : '');
    U.openModal({
      title: c ? 'Editar cliente' : 'Nuevo cliente', subtitle: c ? c.nombre : 'Registra los datos de contacto y documento', size: 'wide', body: body,
      footer: '<button class="btn btn-outline" data-act="close-modal">Cancelar</button>' +
        (c ? '<button class="btn btn-danger-soft" data-act="delete-client" data-id="' + U.esc(c.id) + '">' + U.icon('trash') + ' Eliminar</button>' : '') +
        '<button class="btn btn-primary" data-act="save-client" data-id="' + U.esc(c ? c.id : '') + '">' + U.icon('check') + ' Guardar</button>'
    });
  };

  root.Views.clientDetail = function (id) {
    var c = S.cliente(id);
    if (!c) return U.toast('Cliente no encontrado', 'error');
    var s = S.clienteStats(id);
    var rs = S.reservasOrdenadas().filter(function (r) { return r.clienteId === id; }).slice(0, 8);
    var body = '<div class="detail-hero" style="margin-bottom:14px">' + U.avatar(c.nombre, c.nivel === 'Lista Negra' ? 'red' : '') +
      '<div class="grow"><div class="row wrap gap-6"><h3>' + U.esc(c.nombre) + '</h3>' + U.docBadge(c) + '</div><p>' + U.esc(c.doc || 'Sin documento') + ' · ' + U.esc(c.tel || 'Sin teléfono') + ' · ' + U.esc(c.pais || '') + '</p></div>' +
      '<div class="hero-stats"><div class="hero-stat"><span>Rentas</span><strong>' + s.rentas + '</strong></div>' +
      '<div class="hero-stat"><span>Facturado</span><strong>' + C.money(s.gastoUSD, 'USD') + '</strong></div>' +
      '<div class="hero-stat"><span>Pagado</span><strong style="color:#4ade80">' + C.money(s.pagadoUSD, 'USD') + '</strong></div></div></div>' +
      (c.nivel === 'Lista Negra' ? '<div class="banner banner-danger">' + U.icon('ban') + '<div><strong>Cliente en lista negra.</strong> ' + U.esc(c.motivoLista || 'Sin motivo registrado') + '</div></div>' : '') +
      '<div class="grid g2" style="gap:14px;margin-top:12px">' +
      '<div class="settings-section"><div class="section-title">' + U.icon('user') + ' Contacto</div>' +
      '<div class="kv"><span>Email</span><strong>' + U.esc(c.email || '—') + '</strong></div>' +
      '<div class="kv"><span>Licencia</span><strong>' + U.esc(c.licencia || '—') + '</strong></div>' +
      '<div class="kv"><span>Última renta</span><strong>' + (s.ultima ? C.fmtDate(s.ultima) : '—') + '</strong></div>' +
      '<div class="kv"><span>Clasificación</span><strong>' + U.badge(c.nivel, c.nivel === 'Lista Negra' ? 'red' : c.nivel === 'VIP' ? 'emerald' : 'slate') + '</strong></div>' +
      '</div>' +
      '<div class="settings-section"><div class="section-title">' + U.icon('note') + ' Notas</div><div class="note-box">' + U.esc(c.notas || 'Sin notas internas.') + '</div>' +
      '<div class="row wrap gap-6" style="margin-top:10px"><button class="btn btn-outline btn-sm" data-act="edit-client" data-id="' + U.esc(c.id) + '">' + U.icon('edit') + ' Editar</button>' +
      (c.tel ? '<button class="btn btn-success btn-sm" data-act="wa-client" data-id="' + U.esc(c.id) + '">' + U.icon('whatsapp') + ' WhatsApp</button>' : '') + '</div></div></div>' +
      '<div class="card" style="margin-top:14px"><div class="card-head"><h3>' + U.icon('file') + ' Últimos contratos</h3></div><div class="table-wrap"><table class="table compact"><thead><tr><th>Contrato</th><th>Vehículo</th><th>Fechas</th><th>Estado</th><th class="num">Total</th></tr></thead><tbody>' +
      (rs.length ? rs.map(function (r) {
        var t = S.totales(r);
        return '<tr><td><button class="link-btn" data-act="open-contract" data-id="' + U.esc(r.id) + '">' + U.esc(r.id) + '</button></td><td>' + U.esc(VH.vehiculoFull(S.vehiculo(r.vehiculoId))) + '</td>' +
          '<td>' + C.fmtDate(r.salida) + ' → ' + C.fmtDate(r.retorno) + '</td><td>' + U.estadoBadge(r.estado) + '</td><td class="num">' + C.money(t.total, r.tarifaMoneda) + '</td></tr>';
      }).join('') : '<tr><td colspan="5">' + U.empty('Sin contratos', '', 'file') + '</td></tr>') +
      '</tbody></table></div></div>';
    U.openModal({
      title: 'Cliente', subtitle: c.nombre, size: 'wide', body: body,
      footer: '<button class="btn btn-outline btn-sm" data-act="set-client-level" data-id="' + U.esc(c.id) + '" data-level="VIP">' + U.icon('shield') + ' VIP</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="set-client-level" data-id="' + U.esc(c.id) + '" data-level="Normal">Normal</button>' +
        '<button class="btn btn-danger-soft btn-sm" data-act="set-client-level" data-id="' + U.esc(c.id) + '" data-level="Lista Negra">' + U.icon('ban') + ' Lista negra</button>' +
        '<button class="btn btn-primary btn-sm" data-act="new-contract" data-client="' + U.esc(c.id) + '" style="margin-left:auto">' + U.icon('plus') + ' Nuevo contrato</button>' +
        '<button class="btn btn-dark btn-sm" data-act="close-modal">Cerrar</button>'
    });
  };

  /* ---------------- bitácora ---------------- */
  root.Views.bitacora = function () {
    var notas = db().bitacora.slice().sort(function (a, b) { return (b.fecha + (b.createdAt || '')) < (a.fecha + (a.createdAt || '')) ? -1 : 1; });
    var f = S.ui.filtroNotas || 'TODOS';
    var q = String(S.ui.busquedaNotas || '').trim().toLowerCase();
    var list = notas.filter(function (n) {
      if (f === 'ABIERTOS' && n.resuelto) return false;
      if (f === 'RESUELTOS' && !n.resuelto) return false;
      if (f !== 'TODOS' && f !== 'ABIERTOS' && f !== 'RESUELTOS' && n.tipo !== f) return false;
      if (q && (n.texto + ' ' + n.cliente + ' ' + n.tipo).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var abiertos = notas.filter(function (n) { return !n.resuelto; }).length;
    var vehOpts = db().flota.map(function (v) { return '<option value="' + U.esc(v.id) + '">' + U.esc(VH.vehicleOption(v)) + '</option>'; }).join('');
    return '<div class="page">' +
      '<div class="page-top"><div><h2>Bitácora de observaciones</h2><p>' + abiertos + ' nota(s) abierta(s) · ' + notas.length + ' en total. Daños, quejas, incidentes y taller.</p></div></div>' +
      '<div class="grid g-1-2"><div class="card"><div class="card-head"><h3>' + U.icon('plus') + ' Nueva nota</h3></div><div class="card-body stack">' +
      U.field('Vehículo', '<select class="select" id="nota-vehiculo">' + vehOpts + '</select>') +
      U.field('Tipo', '<select class="select" id="nota-tipo">' + C.TIPOS_NOTA.map(function (t) { return '<option value="' + U.esc(t.id) + '">' + U.esc(t.label) + '</option>'; }).join('') + '</select>') +
      U.field('Cliente / mecánico', '<input class="input" id="nota-cliente" placeholder="Ej. Carlos Gómez / Taller">') +
      U.field('Detalle', '<textarea class="textarea" id="nota-texto" rows="3" placeholder="Describe el daño, queja o trabajo realizado…"></textarea>', { req: true }) +
      '<button class="btn btn-primary btn-block" data-act="save-note">' + U.icon('check') + ' Guardar nota</button>' +
      '</div></div>' +
      '<div class="card"><div class="card-head" style="gap:10px"><div class="row wrap gap-4" style="flex:1">' +
      [['TODOS', 'Todas'], ['ABIERTOS', 'Abiertas'], ['RESUELTOS', 'Resueltas'], ['Queja de Cliente', 'Quejas'], ['Alerta de Cliente', 'Alertas'], ['Taller / Mantenimiento', 'Taller']].map(function (x) {
        return '<button class="chip ' + ((S.ui.filtroNotas || 'TODOS') === x[0] ? 'is-active' : '') + '" data-act="note-filter" data-filter="' + U.esc(x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="searchbox" style="width:210px;display:block">' + U.icon('search', 'search-ico') +
      '<input id="note-search" type="search" value="' + U.esc(S.ui.busquedaNotas || '') + '" placeholder="Buscar nota…" aria-label="Buscar notas"></div></div>' +
      '<div class="card-body stack">' + (list.length ? list.map(function (n) {
        var def = C.TIPOS_NOTA.filter(function (t) { return t.id === n.tipo; })[0] || { tone: 'slate', label: n.tipo };
        var nv = S.vehiculo(n.vehiculoId);
        return '<div class="note-box" style="border-left:4px solid var(--' + (def.tone === 'sky' ? 'sky' : def.tone === 'amber' ? 'amber' : def.tone === 'red' ? 'red' : def.tone === 'violet' ? 'violet' : 'line-strong') + ')">' +
          '<div class="between" style="gap:8px"><div class="row wrap gap-6">' + U.badge(def.label, def.tone) + (n.resuelto ? U.badge('Resuelta', 'emerald', 'check') : U.badge('Abierta', 'amber')) + '</div>' +
          '<span class="tiny muted">' + C.fmtDate(n.fecha) + '</span></div>' +
          '<div style="margin-top:7px;font-size:12px">' + U.esc(n.texto) + '</div>' +
          '<div class="between" style="margin-top:8px"><span class="tiny muted">' + (nv ? U.esc(nv.modelo + ' (' + nv.placa + ')') + ' · ' : '') + U.esc(n.cliente || 'Interno') + ' · ' + U.esc(n.autor) + '</span>' +
          '<div class="row gap-4"><button class="btn btn-ghost btn-sm" data-act="toggle-note" data-id="' + U.esc(n.id) + '">' + U.icon('check') + ' ' + (n.resuelto ? 'Reabrir' : 'Resolver') + '</button>' +
          '<button class="icon-btn" data-act="delete-note" data-id="' + U.esc(n.id) + '" aria-label="Eliminar nota" style="width:28px;height:28px">' + U.icon('trash') + '</button></div></div></div>';
      }).join('') : U.empty('Sin notas', 'Registra la primera observación o queja.', 'note')) + '</div></div></div></div>';
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-finance.js ==== */
/* Vista: Finanzas */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH;

  function db() { return S.data(); }

  function monthLabel(key) {
    if (!key) return '—';
    var p = key.split('-');
    return C.MESES_CORTOS[Number(p[1]) - 1] + ' ' + p[0].slice(2);
  }

  function movementsOfMonth(key) {
    return db().finanzas.filter(function (m) { return String(m.fecha).slice(0, 7) === key; });
  }

  function chartHTML() {
    var now = new Date();
    var months = [];
    for (var i = 5; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      var key = d.getFullYear() + '-' + C.pad2(d.getMonth() + 1);
      var ms = movementsOfMonth(key);
      months.push({
        key: key,
        label: C.MESES_CORTOS[d.getMonth()],
        ing: ms.filter(function (m) { return m.tipo === 'Ingreso'; }).reduce(function (a, m) { return a + m.montoUSD; }, 0),
        gas: ms.filter(function (m) { return m.tipo === 'Gasto'; }).reduce(function (a, m) { return a + m.montoUSD; }, 0)
      });
    }
    var max = Math.max.apply(null, months.map(function (m) { return Math.max(m.ing, m.gas); }).concat([1]));
    return '<div class="fin-chart">' + months.map(function (m) {
      return '<div class="fin-col"><div class="fin-bars">' +
        '<div class="fin-bar ing" style="height:' + (m.ing > 0 ? Math.max(3, m.ing / max * 100) : 0) + '%" title="Ingresos ' + C.money(m.ing, 'USD') + '"></div>' +
        '<div class="fin-bar gas" style="height:' + (m.gas > 0 ? Math.max(3, m.gas / max * 100) : 0) + '%" title="Gastos ' + C.money(m.gas, 'USD') + '"></div></div>' +
        '<span class="fin-label">' + m.label + '</span></div>';
    }).join('') + '</div>' +
      '<div class="row gap-14" style="margin-top:8px;font-size:10.5px;color:var(--muted)">' +
      '<span class="row gap-4"><i style="width:9px;height:9px;border-radius:2px;background:var(--green);display:inline-block"></i> Ingresos</span>' +
      '<span class="row gap-4"><i style="width:9px;height:9px;border-radius:2px;background:var(--red);display:inline-block"></i> Gastos</span></div>';
  }

  root.Views = root.Views || {};
  root.Views.financeRows = function () {
    var list = S.movimientosFiltrados();
    if (!list.length) return '<tr><td colspan="8">' + U.empty('Sin movimientos', 'Registra un ingreso o gasto o cambia el mes.', 'cash') + '</td></tr>';
    return list.map(function (m) {
      var esPago = !!m.pagoId;
      return '<tr><td class="nowrap">' + C.fmtDate(m.fecha) + '</td>' +
        '<td><div class="strong">' + U.esc(m.concepto) + '</div><div class="sub">' + U.esc(m.categoria || '') + (m.reservaId ? ' · <button class="link-btn" data-act="open-contract" data-id="' + U.esc(m.reservaId) + '">' + U.esc(m.reservaId) + '</button>' : '') + (m.vehicleId && S.vehiculo(m.vehicleId) ? ' · ' + U.esc(S.vehiculo(m.vehicleId).placa) : '') + (m.nota ? ' · ' + U.esc(m.nota) : '') + (esPago ? ' · <span class="badge badge-slate">Contrato</span>' : '') + '</div></td>' +
        '<td><span class="badge badge-' + (m.tipo === 'Ingreso' ? 'emerald' : 'red') + '">' + U.esc(m.tipo) + '</span></td>' +
        '<td class="num"><div class="strong" style="color:' + (m.tipo === 'Ingreso' ? 'var(--green)' : 'var(--red)') + '">' + (m.tipo === 'Ingreso' ? '+' : '-') + ' ' + C.money(m.monto, m.moneda) + '</div><div class="sub">' + C.money(m.montoUSD, 'USD') + ' · ' + C.money(m.montoDOP, 'DOP') + '</div></td>' +
        '<td class="num">' + (m.dgii > 0 ? C.money(m.dgii, 'DOP') : '—') + '</td>' +
        '<td><div>' + U.esc(m.metodo) + '</div><div class="sub">' + U.esc(m.banco || '—') + '</div></td>' +
        '<td class="row-actions">' + (esPago ? '' : '<button class="icon-btn" data-act="delete-movement" data-id="' + U.esc(m.id) + '" aria-label="Eliminar movimiento">' + U.icon('trash') + '</button>') + '</td></tr>';
    }).join('');
  };

  root.Views.finanzas = function () {
    var mes = S.ui.mesFinanzas || C.todayISO().slice(0, 7);
    var ms = movementsOfMonth(mes);
    var ing = ms.filter(function (m) { return m.tipo === 'Ingreso'; }).reduce(function (a, m) { return a + m.montoUSD; }, 0);
    var gas = ms.filter(function (m) { return m.tipo === 'Gasto'; }).reduce(function (a, m) { return a + m.montoUSD; }, 0);
    var dgii = ms.reduce(function (a, m) { return a + (Number(m.dgii) || 0); }, 0);
    var neto = C.r2(ing - gas);
    var pend = S.pagosPendientes().reduce(function (a, r) { return a + S.totales(r).pendienteUSD; }, 0);
    var cats = C.CATEGORIAS_INGRESO.concat(C.CATEGORIAS_GASTO.filter(function (x) { return C.CATEGORIAS_INGRESO.indexOf(x) < 0; }));

    return '<div class="page">' +
      '<div class="page-top"><div><h2>Control financiero</h2><p>Ingresos cobrados, gastos y cálculo de retenciones · ' + U.esc(monthLabel(mes)) + '.</p></div>' +
      '<div class="page-actions"><button class="btn btn-outline btn-sm" data-act="export-dgii-607">' + U.icon('file') + ' 607 (Ingresos)</button>' +
      '<button class="btn btn-outline btn-sm" data-act="export-dgii-606">' + U.icon('file') + ' 606 (Gastos)</button>' +
      '<button class="btn btn-outline btn-sm" data-act="export-csv">' + U.icon('download') + ' Exportar CSV</button>' +
      '<button class="btn btn-primary btn-sm" data-act="export-json">' + U.icon('database') + ' Respaldar todo</button></div></div>' +

      '<div class="grid g5">' +
      VH.kpi('Ingresos', C.money(ing, 'USD'), 'Clic para filtrar ingresos →', 'cash', 'emerald', 'data-act="finance-filter" data-filter="Ingreso" role="button"') +
      VH.kpi('Gastos', C.money(gas, 'USD'), 'Clic para filtrar gastos →', 'wallet', '', 'data-act="finance-filter" data-filter="Gasto" role="button"') +
      VH.kpi('Neto', C.money(neto, 'USD'), C.money(C.r2(neto * S.tasa()), 'DOP') + ' · ver todos →', 'dashboard', 'ink', 'data-act="finance-filter" data-filter="" role="button"') +
      VH.kpi('DGII 0.20%', C.money(dgii, 'DOP'), 'Clic para descargar 607 →', 'file', '', 'data-act="export-dgii-607" role="button"') +
      VH.kpi('Por cobrar', C.money(pend, 'USD'), S.pagosPendientes().length + ' contrato(s) · clic para detallar →', 'clock', 'violet', 'data-act="open-ar-detail" role="button"') +
      '</div>' +

      '<div class="grid g-2-1"><div class="stack">' +
      '<div class="card"><div class="card-head"><div><h3>' + U.icon('dashboard') + ' Flujo de los últimos 6 meses</h3><p>En dólares, según la tasa registrada en cada movimiento</p></div></div><div class="card-body">' + chartHTML() + '</div></div>' +

      '<div class="card"><div class="card-head" style="gap:10px"><div class="row wrap gap-4" style="flex:1">' +
      ['', 'Ingreso', 'Gasto'].map(function (t) {
        return '<button class="chip ' + ((S.ui.filtroFinanzas || '') === t ? 'is-active' : '') + '" data-act="finance-filter" data-filter="' + t + '">' + (t || 'Todos') + '</button>';
      }).join('') +
      '<input class="input sm" id="fin-month" type="month" value="' + U.esc(mes) + '" style="width:150px" aria-label="Mes">' +
      '</div><span class="tiny muted">' + ms.length + ' movimiento(s)</span></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th class="num">Monto</th><th class="num">DGII</th><th>Método</th><th></th></tr></thead>' +
      '<tbody id="finance-tbody">' + root.Views.financeRows() + '</tbody></table></div></div>' +

      '</div><div class="stack">' +
      '<div class="card"><div class="card-head"><h3>' + U.icon('plus') + ' Registrar movimiento</h3></div><div class="card-body stack">' +
      U.field('Tipo', '<select class="select" id="fin-tipo"><option value="Ingreso">Ingreso</option><option value="Gasto">Gasto</option></select>') +
      U.field('Concepto', '<input class="input" id="fin-concepto" placeholder="Ej. cambio de aceite, lavado, abono…">', { req: true }) +
      U.field('Categoría', '<select class="select" id="fin-categoria">' + cats.map(function (c) { return '<option>' + U.esc(c) + '</option>'; }).join('') + '</select>') +
      U.field('Vehículo (opcional)', '<select class="select" id="fin-vehiculo"><option value="">Sin asignar</option>' + S.data().flota.filter(function (v) { return v.estadoBase !== 'baja'; }).map(function (v) { return '<option value="' + U.esc(v.id) + '">' + U.esc(VH.vehicleOption(v)) + '</option>'; }).join('') + '</select>', { hint: 'Así el gasto entra en la rentabilidad de ese vehículo.' }) +
      U.field('Monto', '<div class="input-group"><input class="input" id="fin-monto" type="number" min="0" step="0.01" placeholder="0.00"><select class="select" id="fin-moneda"><option value="USD">US$</option><option value="DOP">RD$</option></select></div>') +
      U.field('Fecha', '<input class="input" id="fin-fecha" type="date" value="' + C.todayISO() + '">') +
      U.field('Método', '<select class="select" id="fin-metodo">' + VH.paymentMethodOptions('Efectivo') + '</select>') +
      U.field('Banco / entidad', '<select class="select" id="fin-banco">' + VH.bankOptions('') + '</select>') +
      U.field('Referencia', '<input class="input" id="fin-referencia" placeholder="Opcional">') +
      U.field('Nota', '<input class="input" id="fin-nota" placeholder="Detalle opcional">') +
      '<button class="btn btn-success btn-block" data-act="save-movement">' + U.icon('check') + ' Guardar movimiento</button>' +
      '<div class="hint">Los pagos de contratos se registran desde el contrato y aparecen aquí automáticamente.</div>' +
      '</div></div>' +
      '<div class="card"><div class="card-body"><div class="section-title">' + U.icon('info') + ' Cómo se calcula</div>' +
      '<p class="small muted" style="line-height:1.55">Cada pago guarda la tasa del día en que se cobró. El impuesto DGII se aplica solo a transferencias, depósitos y tarjeta, sobre el equivalente en pesos. Puedes cambiar el porcentaje en Ajustes → Operación.</p></div></div>' +
      '</div></div></div>';
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== views-reports.js ==== */
/* Vista: Reportes gerenciales */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, VH = root.VH, R = root.Reports;

  function currentConfig() {
    var hoy = C.todayISO();
    var saved = S.ui.reportes || {};
    var base = saved.desde ? { desde: saved.desde, hasta: saved.hasta || hoy } : R.presetRange(saved.preset || 'mes', hoy);
    if (!base.desde) base = R.presetRange('mes', hoy);
    return {
      desde: base.desde,
      hasta: base.hasta,
      vehiculoId: saved.vehiculoId || '',
      preset: saved.preset || 'mes'
    };
  }

  function remember(cfg) {
    if (!S.ui.reportes) S.ui.reportes = {};
    S.ui.reportes.desde = cfg.desde;
    S.ui.reportes.hasta = cfg.hasta;
    S.ui.reportes.vehiculoId = cfg.vehiculoId;
    S.ui.reportes.preset = cfg.preset;
  }

  function chart(rep) {
    var months = rep.monthly || [];
    if (!months.length) return U.empty('Sin movimientos en el período', 'Cambia el rango de fechas o registra movimientos.', 'chart');
    var max = Math.max.apply(null, months.map(function (m) { return Math.max(m.income, m.costs); }).concat([1]));
    return '<div class="stack"><div class="fin-chart">' + months.map(function (m) {
      return '<div class="fin-col"><div class="fin-bars">' +
        '<div class="fin-bar ing" style="height:' + (m.income > 0 ? Math.max(3, m.income / max * 100) : 0) + '%" title="Ingresos ' + U.esc(C.money(m.income, 'USD')) + '"></div>' +
        '<div class="fin-bar gas" style="height:' + (m.costs > 0 ? Math.max(3, m.costs / max * 100) : 0) + '%" title="Costos ' + U.esc(C.money(m.costs, 'USD')) + '"></div>' +
        '</div><span class="fin-label">' + U.esc(m.label) + '</span></div>';
    }).join('') + '</div>' +
      '<div class="row gap-14" style="font-size:10.5px;color:var(--muted)">' +
      '<span class="row gap-4"><i style="width:9px;height:9px;border-radius:2px;background:var(--green);display:inline-block"></i> Ingresos</span>' +
      '<span class="row gap-4"><i style="width:9px;height:9px;border-radius:2px;background:var(--red);display:inline-block"></i> Costos</span>' +
      '<span style="margin-left:auto">' + months.length + ' mes(es) en el rango</span></div></div>';
  }

  function kpiBlock(rep) {
    var t = rep.totals;
    var fianzaTone = (rep.depositTotals.usd + rep.depositTotals.dop) > 0 ? 'amber' : '';
    return '<div class="grid g4">' +
      VH.kpi('Ingresos cobrados', C.money(t.income, 'USD'), '≈ ' + C.money(C.r2(t.income * S.tasa()), 'DOP') + ' · ver en Finanzas →', 'cash', 'emerald', 'data-act="kpi-finance" data-filter="Ingreso" role="button"') +
      VH.kpi('Costos', C.money(t.costs, 'USD'), 'Mant.: ' + C.money(t.maintenance, 'USD') + ' · ver gastos →', 'wallet', '', 'data-act="kpi-finance" data-filter="Gasto" role="button"') +
      VH.kpi('Margen operativo', C.money(t.margin, 'USD'), (t.income > 0 ? Math.round(t.margin / t.income * 100) + '% de ingresos' : 'Sin ingresos') + ' · ver tabla →', 'chart', t.margin >= 0 ? 'ink' : 'amber', 'data-act="scroll-section" data-target="rep-sec-vehicles" role="button"') +
      VH.kpi('Ocupación', t.occupancy + '%', t.occupied + ' de ' + t.available + ' días · abrir Gantt →', 'calendar', 'sky', 'data-act="go-gantt" role="button"') +
      VH.kpi('ADR', C.money(t.adr, 'USD'), 'Tarifa media · ver vehículos →', 'cash', '', 'data-act="scroll-section" data-target="rep-sec-vehicles" role="button"') +
      VH.kpi('RevPAR', C.money(t.revpar, 'USD'), 'Ingreso/día disp. · ver vehículos →', 'dashboard', 'violet', 'data-act="scroll-section" data-target="rep-sec-vehicles" role="button"') +
      VH.kpi('Por cobrar', C.money(rep.arTotal, 'USD'), rep.ar.length + ' contrato(s) con saldo · clic para detallar →', 'clock', rep.arTotal > 0 ? 'amber' : '', 'data-act="open-ar-detail" role="button"') +
      VH.kpi('Fianzas retenidas', C.money(rep.depositTotals.usd, 'USD'), (rep.depositTotals.dop > 0 ? '+ ' + C.money(rep.depositTotals.dop, 'DOP') + ' · ' : '') + rep.depositTotals.documentos + ' doc(s) · ver detalle →', 'shield', fianzaTone, 'data-act="scroll-section" data-target="rep-sec-deposits" role="button"') +
      VH.kpi('Pago a propietarios', C.money((rep.ownerTotals && rep.ownerTotals.netoUSD) || 0, 'USD'), ((rep.ownerTotals && rep.ownerTotals.pendienteUSD > 0) ? 'Pend.: ' + C.money(rep.ownerTotals.pendienteUSD, 'USD') : 'Todo liquidado') + ' · ver liquidaciones →', 'briefcase', (rep.ownerTotals && rep.ownerTotals.pendienteUSD > 0) ? 'amber' : 'emerald', 'data-act="scroll-section" data-target="rep-sec-owners" role="button"') +
      VH.kpi('Ganancia subarriendos', C.money((rep.ownerTotals && rep.ownerTotals.gananciaAgenciaUSD) || 0, 'USD'), ((rep.ownerTotals && rep.ownerTotals.count) || 0) + ' renta(s) de terceros · ver detalle →', 'route', 'ink', 'data-act="scroll-section" data-target="rep-sec-owners" role="button"') +
      '</div>';
  }

  function vehicleTable(rep) {
    var rows = rep.vehicles.map(function (v) {
      return '<tr><td><button class="link-btn strong" data-act="vehicle-history" data-id="' + U.esc(v.id) + '">' + U.esc(v.nombre) + '</button><div class="sub">' + U.esc(v.placa) + '</div></td>' +
        '<td class="num">' + v.available + '</td><td class="num">' + v.occupied + '</td><td class="num">' + v.blocked + '</td>' +
        '<td><div class="row gap-6"><div class="progress ' + (v.occupancy >= 60 ? 'green' : v.occupancy >= 30 ? '' : 'amber') + '" style="width:54px"><span style="width:' + Math.min(100, v.occupancy) + '%"></span></div><span class="nowrap">' + v.occupancy + '%</span></div></td>' +

<script>
/* ==== actions.js ==== */
/* Castillo Rent Car ERP — acciones de interfaz */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, I = root.Integrations, V = root.Views, VH = root.VH, R = root.Reports;
  var A = {};

  function q(id) { return document.getElementById(id); }
  function qv(id) { var e = q(id); return e ? e.value : ''; }
  function qn(id) { var x = Number(qv(id)); return isFinite(x) ? x : 0; }
  function qc(id) { var e = q(id); return !!(e && e.checked); }
  function qsa(sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); }
  function modalRoot() { return q('modal-root'); }
  function modalOpen() { var m = modalRoot(); return !!(m && m.children.length); }
  function fail(msg) { U.toast(msg || 'Ocurrió un error', 'error'); }
  function okay(msg, title) { U.toast(msg, 'success', title); }
  function busy(el, on) { if (!el) return; el.classList.toggle('is-loading', !!on); el.disabled = !!on; }
  function closeSidebar() {
    var sb = q('sidebar'), sc = q('scrim');
    if (sb) sb.classList.remove('is-open');
    if (sc) sc.hidden = true;
  }
  function hideSearch() { var b = q('search-results'); if (b) { b.hidden = true; b.innerHTML = ''; } }

  /* ================= navegación ================= */
  A['nav'] = function (d) {
    var tab = d.tab || 'dashboard';
    S.ui.tab = tab;
    S.ui.sidebar = false;
    closeSidebar();
    hideSearch();
    S.setUI({ tab: tab });
  };
  A['toggle-sidebar'] = function () {
    var sb = q('sidebar'), sc = q('scrim');
    if (!sb) return;
    var open = !sb.classList.contains('is-open');
    sb.classList.toggle('is-open', open);
    if (sc) sc.hidden = !open;
  };
  A['close-modal'] = function () { U.closeModal(); };
  A['open-alerts'] = function () { U.openAlerts(); };
  A['alert-jump'] = function (d) { U.jumpAlert(d.key, d.target); };
  A['alerts-toggle-view'] = function (d) { S.ui.alertasVerLeidas = d.read === '1'; U.openAlerts(); };
  A['toggle-alert-read'] = function (d) {
    S.marcarAlertaLeida(d.key, d.read === '1');
    U.openAlerts();
  };
  A['mark-all-alerts-read'] = function () {
    S.marcarAlertaLeida('', true);
    U.openAlerts();
    okay('Todas las notificaciones quedaron marcadas como leídas.', 'Notificaciones');
  };
  A['open-contract'] = function (d) {
    hideSearch();
    if (S.marcarContratoLeido) S.marcarContratoLeido(d.id, true);
    V.contractDetail(d.id, 'resumen');
  };
  A['toggle-contract-read'] = function (d) {
    var r = S.reserva(d.id);
    if (!r) return;
    S.marcarContratoLeido(d.id, r.leido === false);
    U.render();
  };
  A['mark-all-contracts-read'] = function () {
    S.marcarTodosContratosLeidos();
    U.render();
    okay('Todos los contratos fueron marcados como leídos.', 'Contratos');
  };
  A['contract-tab'] = function (d) { V.contractDetail(d.id, d.tab); };
  A['settings-tab'] = function (d) { S.setUI({ settingsTab: d.tab }); };

  function readContract() {
    var deps = [];
    qsa('#deposit-rows .dep-row').forEach(function (row) {
      var tipo = row.querySelector('.dep-tipo').value;
      var def = C.TIPOS_DEPOSITO.filter(function (t) { return t.id === tipo; })[0] || {};
      var monto = def.monetario ? Number(row.querySelector('.dep-monto').value) || 0 : 0;
      var detalle = row.querySelector('.dep-detalle').value.trim();
      if (!def.monetario || monto > 0 || detalle) {
        deps.push({ tipo: tipo, monto: monto, moneda: row.querySelector('.dep-moneda').value, detalle: detalle });
      }
    });
    var checklist = {};
    qsa('.ct-check').forEach(function (x) { checklist[x.getAttribute('data-key')] = x.checked; });
    var pagoMonto = qn('ct-pago-monto');
    var pago = pagoMonto > 0 ? {
      monto: pagoMonto, moneda: qv('ct-pago-moneda'), metodo: qv('ct-pago-metodo'),
      banco: qv('ct-pago-banco'), referencia: qv('ct-pago-ref'), nota: qv('ct-pago-nota'),
      recibidoPor: qv('ct-pago-recibido'), fecha: C.todayISO()
    } : null;
    var vueloActivo = qc('ct-vuelo-activo');
    return {
      clienteId: qv('ct-cliente-id'),
      cliente: {
        nombre: qv('ct-nombre').trim(), doc: qv('ct-doc').trim(), tel: qv('ct-tel').trim(),
        email: qv('ct-email').trim(), licencia: qv('ct-licencia').trim(), pais: qv('ct-pais').trim()

  A['save-contract'] = function (d, el) {
    var editId = qv('ct-id');
    var input = readContract();
    if (!input.cliente.nombre) return fail('Indica el nombre del cliente.');
    if (!input.vehiculoId) return fail('Selecciona un vehículo.');
    if (input.vuelo.activo && !input.vuelo.numero) return fail('Escribe el número de vuelo o desactiva el seguimiento.');
    if (input.autorizacionListaNegra && !input.motivoAutorizacion) return fail('Escribe el motivo de la autorización de lista negra.');
    var faltaDocumento = input.depositos.some(function (dep) {
      var def = C.TIPOS_DEPOSITO.filter(function (t) { return t.id === dep.tipo; })[0];
      return def && !def.monetario && !dep.detalle;
    });
    if (faltaDocumento) return fail('Indica el número o detalle del pasaporte/licencia que queda retenido.');
    busy(el, true);
    var res = editId ? S.updateReserva(editId, input) : S.createReserva(input);
    busy(el, false);
    if (!res.ok) {
      if (res.error === 'cliente-lista-negra') {
        var ex = q('blacklist-extra');
        if (ex) ex.style.display = '';
        return fail('Cliente en lista negra: marca la autorización y escribe el motivo para continuar.');
      }
      return fail(res.error);
    }
    var id = res.reserva.id;
    var mr = modalRoot();
    var sig = mr && mr.__sig;
    if (sig && !sig.isEmpty()) S.setFirma(id, sig.toDataURL());
    if (!editId) {
      var inboxId = qv('ct-inbox');
      if (inboxId) S.convertirInbox(inboxId, id);
      okay('Contrato ' + id + ' creado correctamente.', 'Contrato guardado');
    } else {
      okay('Los cambios se guardaron.', 'Contrato actualizado');
    }
    V.contractDetail(id, 'resumen');
    if (!editId) setTimeout(function () { U.render(); }, 30);
  };

  A['export-dgii-607'] = function () {
    var list = S.movimientosFiltrados().filter(function (m) { return m.tipo === 'Ingreso'; });
    var headers = ['RNC_Cedula_Pasaporte', 'Tipo_Identificacion', 'NCF', 'Fecha_Comprobante', 'Monto_Facturado_DOP', 'ITBIS_Facturado_DOP', 'Metodo_Pago', 'Contrato_Ref'];
    var rows = list.map(function (m) {

      var doc = r && r.clienteSnapshot && r.clienteSnapshot.doc ? C.digits(r.clienteSnapshot.doc) : '';
      var tipoId = doc.length === 9 ? '1' : (doc.length === 11 ? '2' : '3');
      var itbisDOP = r && r.aplicarITBIS ? C.r2(m.montoDOP - (m.montoDOP / (1 + ((r.itbisPct || 18) / 100)))) : 0;
      var netoDOP = C.r2(m.montoDOP - itbisDOP);
      return [doc || (r && r.clienteSnapshot && r.clienteSnapshot.doc ? r.clienteSnapshot.doc : 'CONSUMIDOR FINAL'), tipoId, m.referencia || '', String(m.fecha || '').replace(/-/g, ''), netoDOP, itbisDOP, m.metodo, m.reservaId || ''];
    });

/* Castillo Rent Car ERP — instalación, service worker y almacenamiento */
(function (root) {
  'use strict';
  var deferredPrompt = null;

  var reloading = false;
  var registrationError = '';

  function isSecure() {
    return root.location.protocol === 'https:' || root.location.hostname === 'localhost' || root.location.hostname === '127.0.0.1';
  }
  function isStandalone() {
    return (root.matchMedia && root.matchMedia('(display-mode: standalone)').matches) || root.navigator.standalone === true;

      el.hidden = !st.canInstall;
    });
    root.document.querySelectorAll('[data-pwa-update]').forEach(function (el) {

    });

      else if (st.canInstall) el.textContent = isIOS() ? 'En iPhone/iPad: Compartir → Añadir a pantalla de inicio.' : 'Lista para instalar en este dispositivo.';
      else if (st.error) el.textContent = 'No se pudo registrar el service worker: ' + st.error;
      else el.textContent = 'Abre el menú del navegador y elige “Instalar app” o “Añadir a pantalla de inicio”.';
    });
    root.document.querySelectorAll('[data-pwa-standalone]').forEach(function (el) {
      el.textContent = st.standalone ? 'Instalada (app)' : 'Navegador web';
    });
    root.document.querySelectorAll('[data-pwa-controlled]').forEach(function (el) {

    updateUI();

  }

  function showIOSGuide() {
    if (!root.UI) return;
    root.UI.openModal({
      title: 'Instalar en iPhone o iPad', subtitle: 'Safari no muestra un botón automático', size: 'narrow',
      body: '<div class="stack" style="font-size:13px">' +
        '<div class="banner banner-info">' + root.UI.icon('info') + '<span>La app debe abrirse en <strong>Safari</strong> y con HTTPS.</span></div>' +
        '<div class="kv"><span>1</span><strong>Toca el botón Compartir</strong></div>' +
        '<div class="kv"><span>2</span><strong>Elige “Añadir a pantalla de inicio”</strong></div>' +
        '<div class="kv"><span>3</span><strong>Confirma “Añadir”</strong></div>' +
        '<div class="hint">Quedará como una app. Los datos siguen guardados en este dispositivo, no se sincronizan con otros.</div>' +
        '</div>',
      footer: '<button class="btn btn-primary" data-act="close-modal">Entendido</button>'
    });
  }

  async function install() {
    if (deferredPrompt) {
      try {
        deferredPrompt.prompt();
        var choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        updateUI();
        if (choice && choice.outcome === 'accepted') {
          if (root.UI) root.UI.toast('Instalando Castillo ERP en este dispositivo…', 'success', 'Instalación');
        } else if (root.UI) {
          root.UI.toast('Puedes instalarla luego desde el menú del navegador.', 'info', 'Instalación cancelada');
        }
      } catch (e) {
        if (root.UI) root.UI.toast(e.message || 'No se pudo abrir la instalación.', 'error');
      }
      return;
    }
    if (isIOS()) { showIOSGuide(); return; }
    if (!isSecure()) {
      if (root.UI) root.UI.toast('La instalación requiere HTTPS o localhost. Abre la app desde el servidor publicado.', 'warn', 'PWA');
      return;
    }
    if (root.UI) root.UI.toast('Abre el menú del navegador y elige “Instalar app”.', 'info', 'Instalar');
  }

  function applyUpdate() {
    reloading = true;
    if (registration && registration.waiting) {
      registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      if (root.UI) root.UI.toast('Actualizando la aplicación…', 'info', 'Nueva versión');
      setTimeout(function () { if (!root.document.hidden) root.location.reload(); }, 1500);

      root.location.reload();
    }

    if (!root.navigator.storage || !root.navigator.storage.persist) {
      if (root.UI) root.UI.toast('Este navegador no permite solicitar almacenamiento persistente.', 'warn');

      var already = root.navigator.storage.persisted ? await root.navigator.storage.persisted() : false;
      if (already) {

        return true;
      }
      var ok = await root.navigator.storage.persist();
      if (root.UI) root.UI.toast(ok ? 'El navegador protegerá mejor los datos.' : 'El navegador no concedió la persistencia. Descarga respaldos con frecuencia.', ok ? 'success' : 'warn', 'Almacenamiento');
      return ok;
    } catch (e) {
      if (root.UI) root.UI.toast('No se pudo solicitar el almacenamiento persistente.', 'error');
      return false;
    }
  }

  root.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    updateUI();
  });
  root.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    updateUI();
    if (root.UI) root.UI.toast('Castillo ERP quedó instalada en este dispositivo.', 'success', 'Instalación completa');
  });

  function init() {
    if (!supported() || !isSecure()) {
      updateUI();
      return;
    }

    root.navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
      registration = reg;

        });

    }).catch(function (err) {

    });

  }

  root.PWA = { init: init, install: install, update: applyUpdate, persist: persist, status: status, updateUI: updateUI, isStandalone: isStandalone };

<script>
/* ==== app.js ==== */
/* Castillo Rent Car ERP — arranque y eventos globales */
(function (root) {
  'use strict';
  var C = root.Core, S = root.Store, U = root.UI, I = root.Integrations, A = root.Actions, V = root.Views;

  var actionLocks = {};
  function handleAction(el) {
    var act = el.getAttribute('data-act');
    var fn = A[act];
    if (!fn) { console.warn('Acción sin implementar:', act); return; }
    var isMutating = /^(save-|delete-|liquidar-|cloud-|wa-send|create-|reset-|wipe-|load-demo|fetch-fx)/.test(act);
    var nowMs = Date.now();
    if (isMutating) {
      if (el.disabled || el.classList.contains('is-loading') || (actionLocks[act] && nowMs - actionLocks[act] < 900)) {
        return; // Evita guardado doble al hacer doble clic rápido
      }
      actionLocks[act] = nowMs;
    }
    try {
      var r = fn(el.dataset || {}, el);
      if (r && typeof r.then === 'function') {
        r.catch(function (err) { console.error(err); U.toast(err && err.message ? err.message : 'Error inesperado', 'error'); })
         .finally(function () { if (isMutating) setTimeout(function () { delete actionLocks[act]; }, 350); });
      } else if (isMutating) {
        setTimeout(function () { delete actionLocks[act]; }, 450);
      }
    } catch (err) {
      delete actionLocks[act];
      console.error(err);
      U.toast(err && err.message ? err.message : 'Error inesperado', 'error');
    }
  }

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) {
        if (!e.target.closest || !e.target.closest('#searchbox')) {
          var box = document.getElementById('search-results');
          if (box) { box.hidden = true; box.innerHTML = ''; }
        }
        if (!e.target.closest || !e.target.closest('#modal-root')) {
          // clic fuera del modal no cierra: se evita cerrar por accidente
        }
        return;
      }
      if (el.tagName === 'A' && el.getAttribute('href') && !el.getAttribute('data-act')) return;
      e.preventDefault();
      handleAction(el);
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.id) return;
      if (t.id === 'contract-search') {
        S.ui.busquedaContratos = t.value;
        var tb = document.getElementById('contracts-tbody');
        if (tb) tb.innerHTML = V.contractsRows();
      } else if (t.id === 'client-search') {
        S.ui.busquedaClientes = t.value;
        var cb = document.getElementById('clients-tbody');
        if (cb) cb.innerHTML = V.clientsRows();
      } else if (t.id === 'global-search') {
        U.renderSearchResults(t.value);
      }
    });

    document.addEventListener('change', function (e) {
      var t = e.target;
      if (!t || !t.id) return;
      if (t.id === 'contract-period-date') {
        S.setUI({ fechaContratos: t.value || C.todayISO() });
      } else if (t.id === 'note-search') {
        S.setUI({ busquedaNotas: t.value });
      } else if (t.id === 'fin-month') {
        S.setUI({ mesFinanzas: t.value });
      } else if (t.id === 'tasa-input') {
        var tasa = Number(t.value);
        if (!isFinite(tasa) || tasa <= 0) { U.toast('La tasa debe ser mayor que cero.', 'error'); t.value = S.tasa(); return; }
        S.updateSettings({ operacion: { tasa: C.r2(tasa), tasaUpdatedAt: C.nowStamp(), tasaFuente: 'Manual' } });
        if (U.modalOpen) {
          var mr = document.getElementById('modal-root');
          if (mr && V.previewContract) V.previewContract(mr);
        }
        U.toast('Tasa actualizada a RD$ ' + tasa.toFixed(2) + ' (' + C.fmtStamp(C.nowStamp()) + ').', 'success', 'Tasa de cambio');
      } else if (t.id === 'actor-select') {
        if (root.Cloud && root.Cloud.status && root.Cloud.status().user && root.Cloud.status().role === 'operator') {
          U.toast('Tu usuario tiene rol de Operador y no puede cambiar de perfil.', 'warn', 'Control de rol');
          t.value = S.ui.actorId;
          return;
        }
        S.setActor(t.value);
        var actEmp = S.actor();
        U.toast('Operando como ' + actEmp.nombre + ' (' + (S.actorRole() === 'admin' ? 'Administrador' : 'Operador') + ').', 'info', 'Perfil activo');
      } else if (t.id === 'rep-desde' || t.id === 'rep-hasta') {
        var rc = S.ui.reportes || {};
        if (t.id === 'rep-desde') rc.desde = t.value; else rc.hasta = t.value;
        rc.preset = 'personalizado';
        S.setUI({ reportes: rc });
      } else if (t.id === 'rep-vehiculo') {
        var rv = S.ui.reportes || {};
        rv.vehiculoId = t.value;
        S.setUI({ reportes: rv });
      } else if (t.id === 'import-file') {
        var file = t.files && t.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var out = S.importJSON(String(reader.result || ''));
          if (!out.ok) U.toast(out.error, 'error', 'No se pudo restaurar');
          else { U.toast('Respaldo restaurado correctamente.', 'success', 'Datos importados'); U.render(); }
        };
        reader.onerror = function () { U.toast('No se pudo leer el archivo.', 'error'); };
        reader.readAsText(file);
        t.value = '';
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (U.modalOpen) { U.closeModal(); return; }
        var sb = document.getElementById('sidebar');
        if (sb && sb.classList.contains('is-open')) {
          sb.classList.remove('is-open');
          var sc = document.getElementById('scrim'); if (sc) sc.hidden = true;
          return;
        }
        var box = document.getElementById('search-results');
        if (box) { box.hidden = true; }
        return;
      }
      if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) {
        e.preventDefault();
        var search = document.getElementById('global-search');
        if (search) search.focus();
        return;
      }
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement) {
        var el = document.activeElement;
        if (el.getAttribute && el.getAttribute('role') === 'button' && el.getAttribute('data-act') && el.tagName !== 'BUTTON') {
          e.preventDefault();
          handleAction(el);
        }
      }
    });

    root.addEventListener('castillo:flights', function (e) {
      var d = e.detail || {};
      if (d.alerts && d.alerts.length) {
        U.toast(d.alerts[0].texto, 'warn', 'Novedad de vuelo');
      }
      U.updateShell();
    });

    root.addEventListener('resize', function () {
      if (root.innerWidth > 960) {
        var sb = document.getElementById('sidebar');
        if (sb) sb.classList.remove('is-open');
        var sc = document.getElementById('scrim');
        if (sc) sc.hidden = true;
      }
    });
  }

  function runSelfTest() {
    var box = document.getElementById('selftest');
    if (!box) return;
    var out = [];
    function check(name, fn) {
      try { fn(); out.push('OK   ' + name); }
      catch (e) { out.push('FAIL ' + name + ' :: ' + e.message); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg || 'assert'); }
    check('Base de datos válida', function () {
      var errs = C.validateDB(S.data());
      assert(errs.length === 0, errs.join('; '));
    });
    check('Semilla y secuencias', function () {
      assert(S.data().flota.length >= 0);
      assert(S.data().meta.schema === 3);
    });
    ['dashboard', 'calendario', 'contratos', 'flota', 'clientes', 'bitacora', 'finanzas', 'reportes', 'whatsapp', 'vuelos', 'ajustes'].forEach(function (tab) {
      check('Vista ' + tab, function () {
        var old = S.ui.tab;
        S.ui.tab = tab;
        U.renderNow();
        var view = document.getElementById('view');
        assert(view && view.innerHTML.length > 200, 'HTML muy corto');
        S.ui.tab = old;
      });
    });
    check('Totales de contrato', function () {
      var r = S.data().reservas[0];
      if (r) { var t = S.totales(r); assert(isFinite(t.totalUSD)); }
    });
    check('Abrir y cerrar modal de contrato', function () {
      var r = S.data().reservas[0];
      if (!r) return;
      V.contractDetail(r.id, 'resumen');
      assert(document.querySelector('#modal-root .modal-card'), 'No se abrió el modal');
      U.closeModal();
      assert(!document.querySelector('#modal-root .modal-card'), 'No se cerró el modal');
    });
    check('Formulario de contrato', function () {
      V.contractForm(null, {});
      assert(document.getElementById('ct-nombre'), 'Falta el formulario');
      U.closeModal();
    });
    check('Simulación de vuelo', function () {
      var v = C.simularVuelo({ numero: 'AA1234', fecha: C.todayISO(), hora: '14:00' });
      assert(v.estado, 'Sin estado');
    });
    check('WhatsApp link', function () {
      var url = I.waLink('809-555-0101', 'Hola');
      assert(url.indexOf('https://wa.me/') === 0, 'URL inválida');
    });
    check('CSV', function () {
      var csv = C.toCSV(['a'], [['b']]);
      assert(csv.charCodeAt(0) === 65279, 'Sin BOM');
    });
    S.ui.tab = 'dashboard';
    U.renderNow();
    box.hidden = false;
    box.textContent = 'AUTOTEST ' + (out.every(function (x) { return x.indexOf('OK') === 0; }) ? 'PASS' : 'FAIL') + '\n\n' + out.join('\n');
    document.body.setAttribute('data-selftest', out.every(function (x) { return x.indexOf('OK') === 0; }) ? 'pass' : 'fail');
    console.log(box.textContent);
  }

  function init() {
    S.init();
    var allowedTabs = ['dashboard', 'calendario', 'contratos', 'flota', 'clientes', 'bitacora', 'finanzas', 'reportes', 'whatsapp', 'vuelos', 'ajustes'];
    var m = /[?&]tab=([a-z]+)/.exec(root.location.search || '');
    if (m && allowedTabs.indexOf(m[1]) >= 0) S.ui.tab = m[1];
    bindEvents();
    var syncTimer = null;
    S.subscribe(function () {
      U.render();
      if (I.bridgeReady()) {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(function () { I.syncBridge(); }, 3000);
      }
    });
    U.renderNow();
    if (root.PWA) { try { root.PWA.init(); } catch (e) { console.error(e); } }
    if (root.Cloud) { try { root.Cloud.init(); } catch (e) { console.error(e); } }
    if (I.bridgeReady()) setTimeout(function () { I.syncBridge(); }, 1800);

    var st = S.storageStatus();
    if (st.error) U.toast(st.error, 'error', 'Almacenamiento');

    I.iniciarPolling(function (res) {
      if (res && res.alerts && res.alerts.length) U.toast(res.alerts[0].texto, 'warn', 'Novedad de vuelo');
      U.updateShell();
    });

    setTimeout(function () {
      try { I.revisarRecordatorios(); } catch (e) { }
      if (S.reminders().length && !S.settings().operacion.notificaciones) {
        // Sin permiso de notificaciones: el dashboard ya muestra el aviso.
      }
    }, 1800);

    if (/[?&]selftest=1/.test(root.location.search)) {
      setTimeout(runSelfTest, 250);
    }

    root.Castillo = { Core: C, Store: S, UI: U, Views: V, Actions: A, Integrations: I, Reports: root.Reports, PWA: root.PWA, Cloud: root.Cloud, version: C.VERSION };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
