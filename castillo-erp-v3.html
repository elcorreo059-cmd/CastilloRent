.check input { width: 15px; height: 15px; accent-color: var(--brand); margin: 0; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #cbd5e1; border-radius: 99px; transition: .18s; }
.switch span:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 99px; transition: .18s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span:before { transform: translateX(16px); }
.section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
.section-title .icon { width: 14px; height: 14px; color: var(--brand); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; max-width: 100%; }
.table { width: 100%; border-collapse: collapse; font-size: 12px; }
.table th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted-2); font-weight: 800; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: #fbfcfe; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table .strong { font-weight: 700; }
.table .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.table.compact td { padding: 7px 9px; }
.table.compact th { padding: 7px 9px; }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }
.row-actions .icon-btn { width: 29px; height: 29px; border-radius: 8px; }
.row-actions .icon-btn .icon { width: 14px; height: 14px; }
.cell-client { display: flex; align-items: center; gap: 9px; min-width: 170px; }
.avatar { width: 32px; height: 32px; border-radius: 9px; background: var(--brand-soft); color: var(--brand-2); display: grid; place-items: center; font-size: 11px; font-weight: 850; flex: none; }
.avatar.sm { width: 25px; height: 25px; border-radius: 7px; font-size: 9.5px; }
.avatar.dark { background: #1e293b; color: #fff; }
.avatar.red { background: var(--red-soft); color: #b91c1c; }
.avatar.green { background: var(--green-soft); color: #047857; }

/* ---------- misc ---------- */
.empty { padding: 34px 18px; text-align: center; color: var(--muted); font-size: 12.5px; }
.empty .icon { width: 30px; height: 30px; color: #cbd5e1; margin-bottom: 8px; }
.empty strong { display: block; color: var(--ink-2); font-size: 13px; margin-bottom: 3px; }
.banner { display: flex; gap: 10px; padding: 11px 13px; border-radius: 10px; font-size: 12px; border: 1px solid; align-items: flex-start; }
.banner .icon { width: 16px; height: 16px; margin-top: 1px; flex: none; }
.banner strong { font-weight: 800; }
.banner-info { background: var(--brand-soft); border-color: #c7dbff; color: #1e40af; }
.banner-warn { background: var(--amber-soft); border-color: #fde3b6; color: #92400e; }
.banner-danger { background: var(--red-soft); border-color: #fecaca; color: #991b1b; }
.banner-success { background: var(--green-soft); border-color: #bbf7d0; color: #065f46; }
.banner-slate { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
.progress { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 99px; background: var(--brand); }
.progress.green > span { background: var(--green); }
.progress.amber > span { background: #f59e0b; }
.progress.red > span { background: var(--red); }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv strong { font-weight: 700; text-align: right; }
.kv.big { font-size: 14px; padding: 9px 0; }
.kv.big strong { font-size: 17px; letter-spacing: -.01em; }
.note-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
.alert-card { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--muted-2); border-radius: 10px; cursor: pointer; text-align: left; width: 100%; }
.alert-card:hover { background: var(--surface-2); }
.alert-card[data-tone="red"] { border-left-color: var(--red); }
.alert-card[data-tone="amber"] { border-left-color: #f59e0b; }
.alert-card[data-tone="sky"] { border-left-color: var(--sky); }
.alert-card[data-tone="lime"] { border-left-color: var(--lime); }
.alert-card[data-tone="violet"] { border-left-color: var(--violet); }
.alert-card[data-tone="emerald"] { border-left-color: var(--green); }
.alert-card .a-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--surface-3); color: var(--ink-2); }
.alert-card strong { display: block; font-size: 12px; }
.alert-card small { color: var(--muted); font-size: 10.5px; }
.alert-card .count { margin-left: auto; font-size: 18px; font-weight: 850; color: var(--ink); }
.alert-card[data-tone="red"] .a-ico { background: var(--red-soft); color: #b91c1c; }
.alert-card[data-tone="amber"] .a-ico { background: var(--amber-soft); color: #b45309; }
.alert-card[data-tone="sky"] .a-ico { background: var(--sky-soft); color: #0369a1; }
.alert-card[data-tone="lime"] .a-ico { background: var(--lime-soft); color: #4d7c0f; }
.alert-card[data-tone="violet"] .a-ico { background: var(--violet-soft); color: #6d28d9; }
.alert-card[data-tone="emerald"] .a-ico { background: var(--green-soft); color: #047857; }

/* ---------- modal / toast ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 0; animation: fade .13s ease-out; }
.modal-card { background: #fff; width: 100%; max-width: 620px; min-width: 0; max-height: 94vh; border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slideUp .18s ease-out; }
.modal-card.wide { max-width: 980px; }
.modal-card.xwide { max-width: 1180px; }
.modal-card.narrow { max-width: 460px; }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); flex: none; }
.modal-head h3 { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.modal-head p { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.modal-head .icon-btn { margin-left: auto; border: 0; background: var(--surface-2); width: 32px; height: 32px; }
.modal-body { padding: 18px 20px; overflow-y: auto; overflow-x: hidden; flex: 1; min-width: 0; }
.modal-foot { padding: 13px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 0 0; flex: none; }
.modal-foot.between { justify-content: space-between; }
@keyframes fade { from { opacity: 0; } }
@keyframes slideUp { from { transform: translateY(14px); opacity: .6; } }
@media (min-width: 700px) {
  .modal-backdrop { align-items: center; padding: 24px; }
  .modal-card { border-radius: 18px; max-height: 90vh; }
  .modal-foot { border-radius: 0 0 18px 18px; }
}
.toast-root { position: fixed; left: 18px; bottom: 18px; right: auto; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
.toast { display: flex; gap: 9px; align-items: flex-start; background: #0f172a; color: #f8fafc; border-radius: 11px; padding: 11px 13px; box-shadow: var(--shadow-lg); font-size: 12.5px; animation: toastIn .18s ease-out; }
.toast .icon { width: 16px; height: 16px; margin-top: 1px; flex: none; }
.toast.success .icon { color: #4ade80; }
.toast.error .icon { color: #f87171; }
.toast.warn .icon { color: #fbbf24; }
.toast.info .icon { color: #60a5fa; }
.toast strong { font-weight: 800; display: block; margin-bottom: 1px; }
.toast small { color: #cbd5e1; font-size: 11px; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } }

/* ---------- calendar ---------- */
.cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.cal-nav { display: flex; align-items: center; gap: 6px; }
.cal-nav .icon-btn { width: 32px; height: 32px; }
.cal-title { font-size: 16px; font-weight: 800; letter-spacing: -.01em; margin-left: 8px; text-transform: capitalize; }
.cal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
.cal-legend i { width: 9px; height: 9px; border-radius: 99px; display: inline-block; }
.cal-wrap { padding: 0; }
.cal-month-head, .cal-week-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cal-month-head div, .cal-week-head div { padding: 8px 6px; text-align: center; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-cell { min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; background: #fff; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell.is-out { background: #fafbfd; color: var(--muted-2); }
.cal-cell.is-clickable { cursor: pointer; }
.cal-cell.is-clickable:hover { background: #f7faff; }
.cal-cell.is-today { background: #eff6ff; box-shadow: inset 0 0 0 2px #2563eb; }
.cal-cell.has-active { background: #f0f9ff; box-shadow: inset 0 3px 0 0 #0284c7; }
.cal-cell.has-confirmed { background: #f7fee7; box-shadow: inset 0 3px 0 0 #65a30d; }
.cal-cell.has-block { background: #fffbeb; box-shadow: inset 0 3px 0 0 #d97706; }
.cal-daynum { font-size: 12px; font-weight: 850; color: var(--ink); display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.cal-daynum .today-dot { width: 22px; height: 22px; border-radius: 99px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 11px; box-shadow: 0 2px 6px rgba(37,99,235,.4); }
.cal-events { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal-ev { display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; text-align: left; width: 100%; box-shadow: 0 2px 4px rgba(15, 23, 42, .15); transition: transform .1s, box-shadow .1s; letter-spacing: -.01em; }
.cal-ev:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(15, 23, 42, .22); }
.cal-ev.sky { background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; border-left: 3px solid #38bdf8; }
.cal-ev.lime { background: linear-gradient(135deg, #65a30d, #4d7c0f); color: #ffffff; border-left: 3px solid #bef264; }
.cal-ev.amber { background: linear-gradient(135deg, #d97706, #b45309); color: #ffffff; border-left: 3px solid #fde68a; }
.cal-ev.slate { background: #475569; color: #ffffff; border-left: 3px solid #cbd5e1; }
.cal-ev.red { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #ffffff; border-left: 3px solid #fca5a5; }
.cal-ev .icon { width: 11px; height: 11px; stroke-width: 2.3; }
.cal-more { font-size: 9px; color: var(--muted); font-weight: 700; padding-left: 3px; }
.cal-week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); min-height: 420px; }
.cal-week-col { border-right: 1px solid var(--line); min-width: 0; }
.cal-week-col:last-child { border-right: 0; }
.cal-week-col .cal-week-day { padding: 7px 6px; text-align: center; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cal-week-col .cal-week-day strong { font-size: 15px; display: block; }
.cal-week-col.is-today .cal-week-day { background: var(--brand-soft); }
.cal-week-body { padding: 5px; display: flex; flex-direction: column; gap: 4px; }
.cal-unit { border-radius: 8px; padding: 7px 8px; border: 0; font-size: 11px; cursor: pointer; text-align: left; color: #fff; box-shadow: 0 2px 5px rgba(15,23,42,.16); }
.cal-unit .u-time { font-size: 9.5px; color: rgba(255,255,255,.9); font-weight: 800; text-transform: uppercase; }
.cal-unit .tiny.muted { color: rgba(255,255,255,.85) !important; }
.cal-unit.sky { background: linear-gradient(135deg, #0284c7, #0369a1); border-left: 4px solid #38bdf8; }
.cal-unit.lime { background: linear-gradient(135deg, #65a30d, #4d7c0f); border-left: 4px solid #bef264; }
.cal-unit.amber { background: linear-gradient(135deg, #d97706, #b45309); border-left: 4px solid #fde68a; }
.cal-unit.red { background: linear-gradient(135deg, #dc2626, #b91c1c); border-left: 4px solid #fca5a5; }
.cal-unit.slate { background: #475569; border-left: 4px solid #cbd5e1; }

/* year */
.year-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px; }
.mini-month { border: 1px solid var(--line); border-radius: 11px; padding: 10px; background: #fff; }
.mini-month h4 { font-size: 12px; font-weight: 800; text-transform: capitalize; margin-bottom: 6px; cursor: pointer; color: var(--brand); }
.mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.mini-dow { font-size: 8px; color: var(--muted-2); text-align: center; font-weight: 800; padding: 2px 0; }
.mini-day { aspect-ratio: 1; display: grid; place-items: center; font-size: 9px; border-radius: 99px; color: var(--ink-2); border: 0; background: transparent; }
.mini-day:hover { background: var(--surface-3); }
.mini-day.has { background: var(--brand); color: #fff; font-weight: 800; }
.mini-day.today { box-shadow: inset 0 0 0 1.5px var(--brand); }
.mini-day.blank { visibility: hidden; }

/* day view */
.day-list { display: flex; flex-direction: column; gap: 10px; }
.day-event { display: flex; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; background: #fff; align-items: flex-start; }
.day-event .time { font-size: 11px; font-weight: 800; color: var(--muted); width: 52px; flex: none; }
.day-event .bar { width: 4px; border-radius: 99px; align-self: stretch; flex: none; }
.day-event.sky .bar { background: var(--sky); }
.day-event.lime .bar { background: var(--lime); }
.day-event.amber .bar { background: #f59e0b; }
.day-event.slate .bar { background: #94a3b8; }
.day-section-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); margin: 10px 0 2px; }

/* gantt */
.gantt-wrap { overflow-x: auto; }
.gantt { border-collapse: separate; border-spacing: 0; font-size: 10.5px; min-width: 100%; }
.gantt th, .gantt td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; height: 40px; text-align: center; min-width: 34px; }
.gantt th { background: var(--surface-2); font-size: 9px; color: var(--muted); font-weight: 800; height: 42px; position: sticky; top: 0; z-index: 2; }
.gantt th.veh, .gantt td.veh { text-align: left; padding: 0 10px; min-width: 190px; position: sticky; left: 0; background: #fff; z-index: 1; border-right: 1px solid var(--line-strong); }
.gantt th.veh { background: var(--surface-2); z-index: 3; }
.gantt td.veh { font-weight: 700; font-size: 11px; }
.gantt .g-cell { cursor: pointer; color: #fff; font-weight: 800; }
.gantt .g-cell.sky { background: #0284c7; color: #fff; }
.gantt .g-cell.lime { background: #65a30d; color: #fff; }
.gantt .g-cell.amber { background: #d97706; color: #fff; }
.gantt .g-cell.red { background: #dc2626; color: #fff; }
.gantt .g-cell.slate { background: #475569; color: #fff; }
.gantt .g-cell.edge-start { border-left: 3px solid #0f172a; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.gantt .g-cell.edge-end { border-right: 3px solid #0f172a; border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.gantt .g-cell.today { box-shadow: inset 0 0 0 2px #fde047; }
.gantt .g-idle { background: #fff; }
.gantt .g-today-col { background: #eff6ff; }
.gantt .g-label { font-size: 9.5px; font-weight: 800; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; padding: 0 3px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }

/* ---------- contract detail ---------- */
.detail-hero { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; padding: 16px 18px; background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; border-radius: 14px; }
.detail-hero .avatar { width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .12); color: #fff; font-size: 14px; }
.detail-hero h3 { font-size: 17px; font-weight: 800; }
.detail-hero p { font-size: 11.5px; color: #cbd5e1; }
.detail-hero .hero-stats { margin-left: auto; display: flex; gap: 20px; flex-wrap: wrap; }
.detail-hero .hero-stat span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; display: block; font-weight: 800; }
.detail-hero .hero-stat strong { font-size: 16px; font-weight: 800; }
.tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 12px 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.is-active { color: var(--brand); border-bottom-color: var(--brand); }
.tab .count { font-size: 9.5px; background: var(--surface-3); border-radius: 99px; padding: 1px 5px; margin-left: 4px; }
.timeline { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 10px; padding: 8px 0; position: relative; }
.tl-item:not(:last-child):before { content: ""; position: absolute; left: 5px; top: 20px; bottom: -2px; width: 1px; background: var(--line); }
.tl-dot { width: 11px; height: 11px; border-radius: 99px; background: #cbd5e1; margin-top: 4px; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.tl-item.ok .tl-dot { background: var(--green); }
.tl-item.warn .tl-dot { background: #f59e0b; }
.tl-item.info .tl-dot { background: var(--brand); }
.tl-body { font-size: 11.5px; }
.tl-body strong { font-size: 12px; }
.tl-body small { color: var(--muted); display: block; font-size: 10px; }

/* ---------- flight ---------- */
.flight-card { border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.flight-top { display: flex; align-items: center; gap: 9px; }
.flight-top .plane-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--sky-soft); color: var(--sky); display: grid; place-items: center; }
.flight-route { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; }
.flight-route .line { flex: 1; height: 1px; background: var(--line-strong); position: relative; }
.flight-route .line:after { content: ""; position: absolute; right: 0; top: -2.5px; border: 3px solid transparent; border-left-color: var(--line-strong); }
.flight-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); }
.flight-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 10.5px; }
.status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; font-size: 10px; font-weight: 800; background: var(--surface-3); color: var(--ink-2); }
.status-pill.on-time { background: var(--green-soft); color: #047857; }
.status-pill.delayed { background: var(--amber-soft); color: #92400e; }
.status-pill.early { background: var(--sky-soft); color: #0369a1; }
.status-pill.landed { background: var(--violet-soft); color: #5b21b6; }
.status-pill.cancelled { background: var(--red-soft); color: #991b1b; }
.pulse { width: 7px; height: 7px; border-radius: 99px; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

/* ---------- whatsapp ---------- */
.wa-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; }
.wa-list { display: flex; flex-direction: column; gap: 7px; max-height: 560px; overflow-y: auto; }
.wa-item { text-align: left; width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 11px; }
.wa-item:hover { background: var(--surface-2); }

  /* ---------- fechas ---------- */
  function pad2(n) { return String(n).padStart(2, '0'); }

    var d = parseISO(iso);

  /* ---------- números / dinero ---------- */

      return r.vehiculoId === v.id && r.tipo === 'renta' && r.estado === 'Confirmada' && hoy >= r.salida && hoy <= r.retorno;
    })[0];
    if (futura) return { key: 'Reservado', label: 'Reservado', tone: 'lime', reserva: futura };
    return { key: 'Disponible', label: 'Disponible', tone: 'emerald' };
  }

  function flotaConEstado() {
    return db.flota.map(function (v) { return { vehiculo: v, estado: estadoVehiculo(v) }; });
  }

  function disponibles(desde, hasta, opts) {
    opts = opts || {};
    return db.flota.filter(function (v) {
      if (v.estadoBase !== 'operativo') return false;
      if (!desde || !hasta) return true;
      var cs = C.conflictosDe(db, v.id, desde, hasta, {
        horaSalida: opts.horaSalida || db.settings.operacion.horaEntrega,
        horaRetorno: opts.horaRetorno || db.settings.operacion.horaRetorno,
        excluirId: opts.excluirId,
        permitirMismoDia: db.settings.operacion.permitirMismoDia
      });
      return cs.length === 0;
    });
  }

  function conflictos(vehiculoId, desde, hasta, opts) {
    return C.conflictosDe(db, vehiculoId, desde, hasta, {
      horaSalida: (opts && opts.horaSalida) || db.settings.operacion.horaEntrega,
      horaRetorno: (opts && opts.horaRetorno) || db.settings.operacion.horaRetorno,
      excluirId: opts && opts.excluirId,
      permitirMismoDia: db.settings.operacion.permitirMismoDia
    });
  }

  function reservasOrdenadas() {
    return db.reservas.slice().sort(function (a, b) {
      if (a.salida === b.salida) return a.id < b.id ? 1 : -1;
      return a.salida < b.salida ? 1 : -1;
    });
  }

  function activas() {
    var hoy = C.todayISO();
    return db.reservas.filter(function (r) { return r.tipo === 'renta' && r.estado === 'Activo'; })
      .sort(function (a, b) { return a.retorno < b.retorno ? -1 : 1; });
  }

  function proximas() {
    var hoy = C.todayISO();
    return db.reservas.filter(function (r) {
      return r.tipo === 'renta' && r.estado === 'Confirmada' && r.retorno >= hoy;
    }).sort(function (a, b) { return a.salida < b.salida ? -1 : 1; });
  }

  function devolucionesHoy() {
    var hoy = C.todayISO();
    return db.reservas.filter(function (r) { return r.tipo === 'renta' && r.estado === 'Activo' && r.retorno === hoy; });
  }

  function entregasHoy() {
    var hoy = C.todayISO();
    return db.reservas.filter(function (r) { return r.tipo === 'renta' && (r.estado === 'Confirmada' || r.estado === 'Activo') && r.salida === hoy; });
  }

  function vencidas() {
    var hoy = C.todayISO();
    return db.reservas.filter(function (r) { return r.tipo === 'renta' && r.estado === 'Activo' && r.retorno < hoy; });
  }

  function reminders() {
    var dias = Number(db.settings.operacion.recordatorioDias) || 2;
    var objetivo = C.addDays(C.todayISO(), dias);
    return db.reservas.filter(function (r) {
      return r.tipo === 'renta' && r.estado === 'Activo' && r.retorno === objetivo && !r.recordatorioEnviado;
    });
  }

  function pagosPendientes() {
    return db.reservas.filter(function (r) {
      if (r.tipo !== 'renta' || (r.estado !== 'Activo' && r.estado !== 'Confirmada')) return false;
      var t = totales(r);
      return t.pendienteUSD > 0.01;
    }).sort(function (a, b) {
      var ta = totales(a), tb = totales(b);
      return tb.pendienteUSD - ta.pendienteUSD;
    });
  }

  function alertasMantenimiento() {
    return db.flota.map(function (v) {
      var restante = (Number(v.kmMant) || 0) - (Number(v.km) || 0);
      var vencido = restante <= 0;
      var proximo = restante > 0 && restante <= 500;
      return { vehiculo: v, restante: restante, vencido: vencido, proximo: proximo };
    }).filter(function (x) { return x.vencido || x.proximo; });
  }

  function alertasDocumentos() {
    var hoy = C.todayISO();
    var limite = C.addDays(hoy, 30);
    var out = [];
    db.flota.forEach(function (v) {
      [['Seguro', v.seguro && v.seguro.vence], ['Marbete', v.marbeteVence], ['Revisión', v.revisionVence]].forEach(function (par) {
        if (par[1] && par[1] <= limite) out.push({ vehiculo: v, tipo: par[0], vence: par[1], vencido: par[1] < hoy });
      });
    });
    return out;
  }

  function vuelosProximos() {
    var hoy = C.todayISO();
    var limite = C.addDays(hoy, 3);
    return db.reservas.filter(function (r) {
      return r.tipo === 'renta' && r.vuelo && r.vuelo.activo && r.vuelo.fecha && r.vuelo.fecha >= hoy && r.vuelo.fecha <= limite && r.estado !== 'Cancelada';
    }).sort(function (a, b) {
      return (a.vuelo.fecha + a.vuelo.hora) < (b.vuelo.fecha + b.vuelo.hora) ? -1 : 1;
    });
  }

  function nombreArchivo(ext) {
    return 'CastilloRentCar_' + C.todayISO() + '.' + ext;
  }

  function alertSignature(a) {
    return a.key + ':' + ((a.ids && a.ids.length) ? a.ids.slice().sort().join(',') : a.detalle);
  }

  function rawAlerts() {
    var out = [];
    var av = vencidas();
    if (av.length) out.push({ key: 'vencidas', tone: 'red', icon: 'alert', titulo: 'Rentas vencidas', detalle: av.length + ' contrato(s) sin devolver', ids: av.map(function (r) { return r.id; }), accion: 'contratos' });
    var rec = reminders();
    if (rec.length) out.push({ key: 'recordatorios', tone: 'amber', icon: 'bell', titulo: 'Recordatorios de devolución', detalle: rec.length + ' cliente(s) a contactar (' + (db.settings.operacion.recordatorioDias || 2) + ' días antes)', ids: rec.map(function (r) { return r.id; }), accion: 'recordatorios' });
    var dh = devolucionesHoy();
    if (dh.length) out.push({ key: 'devoluciones', tone: 'sky', icon: 'key', titulo: 'Devoluciones de hoy', detalle: dh.length + ' vehículo(s) deben entrar', ids: dh.map(function (r) { return r.id; }), accion: 'devoluciones' });
    var eh = entregasHoy();
    if (eh.length) out.push({ key: 'entregas', tone: 'lime', icon: 'check', titulo: 'Entregas de hoy', detalle: eh.length + ' contrato(s) por entregar', ids: eh.map(function (r) { return r.id; }), accion: 'entregas' });
    var pp = pagosPendientes();
    if (pp.length) {
      var totalPend = pp.reduce(function (a, r) { return a + totales(r).pendienteUSD; }, 0);
      out.push({ key: 'cobros', tone: 'violet', icon: 'cash', titulo: 'Cobros pendientes', detalle: C.money(totalPend, 'USD') + ' en ' + pp.length + ' contrato(s)', ids: pp.map(function (r) { return r.id; }), accion: 'cobros' });
    }
    var man = alertasMantenimiento();
    if (man.length) out.push({ key: 'mantenimiento', tone: 'amber', icon: 'wrench', titulo: 'Mantenimiento', detalle: man.length + ' vehículo(s) requieren servicio', ids: man.map(function (x) { return x.vehiculo.id; }), accion: 'flota' });
    var docs = alertasDocumentos();
    if (docs.length) out.push({ key: 'documentos', tone: 'amber', icon: 'file', titulo: 'Documentos por vencer', detalle: docs.length + ' documento(s) en 30 días', ids: docs.map(function (d) { return d.vehiculo.id + '-' + d.tipo; }), accion: 'flota' });
    var negros = db.clientes.filter(function (c) { return c.nivel === 'Lista Negra'; });
    if (negros.length) {
      var riesgos = db.reservas.filter(function (r) {
        return (r.estado === 'Activo' || r.estado === 'Confirmada') && negros.some(function (c) { return c.id === r.clienteId; });
      });
      if (riesgos.length) out.push({ key: 'lista', tone: 'red', icon: 'ban', titulo: 'Clientes en lista negra con renta activa', detalle: riesgos.length + ' contrato(s) requieren atención', ids: riesgos.map(function (r) { return r.id; }), accion: 'clientes' });
    }
    var vuelos = vuelosProximos().filter(function (r) {
      return r.vuelo.estado === 'Aterrizó' || r.vuelo.etiqueta === 'Retrasado' || r.vuelo.etiqueta === 'Adelantado';
    });
    if (vuelos.length) out.push({ key: 'vuelos', tone: 'sky', icon: 'plane', titulo: 'Novedades de vuelos', detalle: vuelos.length + ' vuelo(s) con cambio de estado', ids: vuelos.map(function (r) { return r.id; }), accion: 'vuelos' });
    if (db.inbox.some(function (m) { return !m.leido; })) {
      var sinLeer = db.inbox.filter(function (m) { return !m.leido; }).length;
      out.push({ key: 'whatsapp', tone: 'emerald', icon: 'whatsapp', titulo: 'Mensajes de WhatsApp', detalle: sinLeer + ' mensaje(s) sin leer', ids: db.inbox.filter(function (m) { return !m.leido; }).map(function (m) { return m.id; }), accion: 'whatsapp' });
    }
    var mapLeidas = (db.meta && db.meta.alertasLeidas) || {};
    return out.map(function (a) {
      var sig = alertSignature(a);
      a.sig = sig;
      a.leida = !!mapLeidas[sig];
      return a;
    });
  }

  function alerts(includeRead) {
    var all = rawAlerts();
    return includeRead ? all : all.filter(function (a) { return !a.leida; });
  }

  function marcarAlertaLeida(key, leida) {
    if (!db.meta.alertasLeidas) db.meta.alertasLeidas = {};
    var all = rawAlerts();
    all.forEach(function (a) {
      if (!key || a.key === key) {
        if (leida === false) delete db.meta.alertasLeidas[a.sig];
        else db.meta.alertasLeidas[a.sig] = C.nowStamp();
      }
    });
    if (key === 'whatsapp' && leida !== false) {
      db.inbox.forEach(function (m) { m.leido = true; });
    }
    commit();
    return { ok: true };
  }

  function marcarContratoLeido(id, leido) {
    var r = reserva(id);
    if (!r) return { ok: false };
    var nuevo = leido !== undefined ? !!leido : true;
    if (r.leido !== nuevo) {
      r.leido = nuevo;
      commit();
    }
    return { ok: true, leido: r.leido };
  }

  function marcarTodosContratosLeidos() {
    db.reservas.forEach(function (r) { r.leido = true; });
    commit();
    return { ok: true };
  }

  function kpis() {
    var mes = db.finanzas.filter(function (m) { return String(m.fecha).slice(0, 7) === C.todayISO().slice(0, 7); });
    var ing = mes.filter(function (m) { return m.tipo === 'Ingreso'; }).reduce(function (a, m) { return a + (Number(m.montoUSD) || 0); }, 0);
    var gas = mes.filter(function (m) { return m.tipo === 'Gasto'; }).reduce(function (a, m) { return a + (Number(m.montoUSD) || 0); }, 0);
    return {
      flota: db.flota.filter(function (v) { return v.estadoBase !== 'baja'; }).length,
      enCalle: db.flota.filter(function (v) { return estadoVehiculo(v).key === 'En Calle'; }).length,
      disponibles: db.flota.filter(function (v) { return estadoVehiculo(v).key === 'Disponible'; }).length,
      reservados: db.flota.filter(function (v) { return estadoVehiculo(v).key === 'Reservado'; }).length,
      taller: db.flota.filter(function (v) { return estadoVehiculo(v).key === 'Taller'; }).length,
      balanceUSD: C.r2(ing - gas),
      ingresosMesUSD: C.r2(ing),
      gastosMesUSD: C.r2(gas),
      pendienteUSD: C.r2(pagosPendientes().reduce(function (a, r) { return a + totales(r).pendienteUSD; }, 0)),
      contratosActivos: activas().length,
      proximas: proximas().length,
      recordatorios: reminders().length
    };
  }

  function movimientosFiltrados() {
    return db.finanzas.filter(function (m) {
      if (ui.mesFinanzas && String(m.fecha).slice(0, 7) !== ui.mesFinanzas) return false;
      if (ui.filtroFinanzas && m.tipo !== ui.filtroFinanzas) return false;
      return true;
    }).slice().sort(function (a, b) {
      var ka = a.fecha + (a.createdAt || ''), kb = b.fecha + (b.createdAt || '');
      return ka < kb ? 1 : -1;
    });
  }

  function clienteStats(id) {
    var rs = db.reservas.filter(function (r) { return r.clienteId === id && r.tipo === 'renta' && r.estado !== 'Cancelada'; });
    var gasto = rs.reduce(function (a, r) { return a + totales(r).totalUSD; }, 0);
    var pagado = rs.reduce(function (a, r) { return a + totales(r).pagadoUSD; }, 0);
    var ultima = rs.slice().sort(function (a, b) { return a.salida < b.salida ? 1 : -1; })[0];
    return { rentas: rs.length, gastoUSD: C.r2(gasto), pagadoUSD: C.r2(pagado), ultima: ultima ? ultima.salida : '', reserva: ultima || null };
  }

  function clientesConStats() {
    return db.clientes.map(function (c) { return { cliente: c, stats: clienteStats(c.id) }; });
  }

  function buscarGlobal(q) {
    q = String(q || '').trim().toLowerCase();
    if (q.length < 2) return { reservas: [], clientes: [], flota: [] };
    return {
      reservas: db.reservas.filter(function (r) {
        return (r.id + ' ' + (r.clienteSnapshot.nombre || '') + ' ' + (r.clienteSnapshot.doc || '') + ' ' + (r.clienteSnapshot.tel || '')).toLowerCase().indexOf(q) >= 0;
      }).slice(0, 6),
      clientes: db.clientes.filter(function (c) { return (c.nombre + ' ' + c.doc + ' ' + c.tel).toLowerCase().indexOf(q) >= 0; }).slice(0, 4),
      flota: db.flota.filter(function (v) { return ((v.marca || '') + ' ' + v.modelo + ' ' + v.placa + ' ' + v.color).toLowerCase().indexOf(q) >= 0; }).slice(0, 4)
    };
  }

  /* ---------------- mutaciones: flota ---------------- */
  function addVehiculo(data) {
    if (!data.modelo || !String(data.modelo).trim()) return { ok: false, error: 'Indica la marca y modelo del vehículo.' };
    var id = nextId('V', 'veh');
    var v = {
      id: id, marca: String(data.marca || '').trim(), modelo: String(data.modelo || '').trim(),
      anio: Number(data.anio) || new Date().getFullYear(), color: String(data.color || '').trim(),
      placa: String(data.placa || '').trim() || 'A-PENDIENTE', vin: String(data.vin || '').trim(),
      tarifaUSD: C.r2(Number(data.tarifaUSD) || 0), tarifaDOP: C.r2(Number(data.tarifaDOP) || 0),
      esPropio: data.esPropio !== false,
      propietarioNombre: String(data.propietarioNombre || '').trim(),
      propietarioTel: String(data.propietarioTel || '').trim(),
      costoDiaUSD: C.r2(Number(data.costoDiaUSD) || 0),
      km: Number(data.km) || 0, kmMant: Number(data.kmMant) || 0,
      estadoBase: ['operativo', 'taller', 'baja'].indexOf(data.estadoBase) >= 0 ? data.estadoBase : 'operativo',
      gps: String(data.gps || '').trim(), nota: String(data.nota || '').trim(),
      seguro: { aseguradora: String((data.seguro && data.seguro.aseguradora) || '').trim(), poliza: String((data.seguro && data.seguro.poliza) || '').trim(), vence: (data.seguro && data.seguro.vence) || '' },
      marbeteVence: data.marbeteVence || '', revisionVence: data.revisionVence || '',
      createdAt: C.nowStamp()
    };
    db.flota.push(v);
    audit('Crear', 'Vehículo', id, nombreVehiculo(v));
    commit();
    return { ok: true, vehiculo: v };
  }

  function updateVehiculo(id, data) {
    var v = vehiculo(id);
    if (!v) return { ok: false, error: 'Vehículo no encontrado.' };
    if (!data.modelo || !String(data.modelo).trim()) return { ok: false, error: 'Indica la marca y modelo del vehículo.' };
    var patch = {
      marca: String(data.marca || '').trim(), modelo: String(data.modelo || '').trim(),
      anio: Number(data.anio) || v.anio, color: String(data.color || '').trim(),
      placa: String(data.placa || '').trim() || 'A-PENDIENTE', vin: String(data.vin || '').trim(),
      tarifaUSD: C.r2(Number(data.tarifaUSD) || 0), tarifaDOP: C.r2(Number(data.tarifaDOP) || 0),
      esPropio: data.esPropio !== false,
      propietarioNombre: String(data.propietarioNombre || '').trim(),
      propietarioTel: String(data.propietarioTel || '').trim(),
      costoDiaUSD: C.r2(Number(data.costoDiaUSD) || 0),
      km: Number(data.km) || 0, kmMant: Number(data.kmMant) || 0,
      estadoBase: ['operativo', 'taller', 'baja'].indexOf(data.estadoBase) >= 0 ? data.estadoBase : v.estadoBase,
      gps: String(data.gps || '').trim(), nota: String(data.nota || '').trim(),
      seguro: { aseguradora: String((data.seguro && data.seguro.aseguradora) || '').trim(), poliza: String((data.seguro && data.seguro.poliza) || '').trim(), vence: (data.seguro && data.seguro.vence) || '' },
      marbeteVence: data.marbeteVence || '', revisionVence: data.revisionVence || '',
      updatedAt: C.nowStamp()
    };
    Object.assign(v, patch);
    audit('Actualizar', 'Vehículo', id, v.placa);
    commit();
    return { ok: true, vehiculo: v };
  }

  function deleteVehiculo(id) {
    var v = vehiculo(id);
    if (!v) return { ok: false, error: 'Vehículo no encontrado.' };
    var usos = db.reservas.filter(function (r) { return r.vehiculoId === id; });
    if (usos.length) return { ok: false, error: 'No se puede eliminar: tiene ' + usos.length + ' contrato(s) asociado(s). Puedes darlo de baja para conservar el historial.' };
    db.flota = db.flota.filter(function (x) { return x.id !== id; });
    audit('Eliminar', 'Vehículo', id, v.placa);
    commit();
    return { ok: true };
  }

  function setEstadoBase(id, estado) {
    var v = vehiculo(id);
    if (!v) return { ok: false, error: 'Vehículo no encontrado.' };
    v.estadoBase = estado;
    v.updatedAt = C.nowStamp();
    audit('Actualizar', 'Vehículo', id, 'Estado base: ' + estado);
    commit();
    return { ok: true };
  }

  function crearBloqueo(vehiculoId, desde, hasta, motivo, horaIni, horaFin) {
    if (!vehiculoId) return { ok: false, error: 'Selecciona un vehículo.' };
    var vBloqueo = vehiculo(vehiculoId);
    if (!vBloqueo) return { ok: false, error: 'El vehículo no existe.' };
    if (vBloqueo.estadoBase === 'baja') return { ok: false, error: 'Ese vehículo está fuera de servicio.' };
    if (!desde || !hasta || hasta < desde) return { ok: false, error: 'Revisa las fechas del bloqueo.' };
    var cs = conflictos(vehiculoId, desde, hasta, { horaSalida: horaIni, horaRetorno: horaFin });
    if (cs.length) return { ok: false, error: 'El vehículo ya tiene una renta o bloqueo en esas fechas: ' + cs.map(function (r) { return r.id; }).join(', ') };
    var r = {
      id: nextReservaId(), tipo: 'bloqueo', vehiculoId: vehiculoId, clienteId: '',
      clienteSnapshot: { nombre: motivo || 'Taller / mantenimiento', doc: '', tel: '', email: '', licencia: '', pais: '' },
      salida: desde, retorno: hasta, horaSalida: horaIni || '08:00', horaRetorno: horaFin || '18:00',
      tarifaMonto: 0, tarifaMoneda: 'USD', dias: C.diasRenta(desde, hasta, db.settings.operacion.conteoDias), extras: [], descuento: 0,
      aplicarITBIS: false, itbisPct: 0, total: 0, tasa: tasa(), totalUSD: 0, totalDOP: 0,
      estado: 'Activo', canal: 'Mostrador', vendedorId: ui.actorId, entregaId: '', recepcionId: '',
      combustibleSalida: '', combustibleRetorno: '', kmSalida: 0, kmRetorno: null,
      depositos: [], pagos: [], vuelo: { activo: false },
      checklist: {}, notas: motivo || '', motivoCancelacion: '',
      historial: [{ fecha: C.nowStamp(), tipo: 'Bloqueo', detalle: motivo || 'Bloqueo por taller' }],
      createdAt: C.nowStamp(), updatedAt: C.nowStamp()
    };
    db.reservas.push(r);
    audit('Crear', 'Bloqueo', r.id, motivo || 'Taller');
    commit();
    return { ok: true, reserva: r };
  }

  /* ---------------- mutaciones: clientes ---------------- */
  function findClienteByDoc(doc, tel, nombre) {
    doc = String(doc || '').trim().toLowerCase();
    tel = C.digits(tel);
    nombre = String(nombre || '').trim().toLowerCase();
    if (doc) {
      var byDoc = db.clientes.filter(function (c) { return String(c.doc || '').trim().toLowerCase() === doc; })[0];
      if (byDoc) return byDoc;
    }
    if (tel) {
      var byTel = db.clientes.filter(function (c) { return C.digits(c.tel) === tel; })[0];
      if (byTel) return byTel;
    }
    if (nombre) {
      var byName = db.clientes.filter(function (c) { return String(c.nombre || '').trim().toLowerCase() === nombre; })[0];
      if (byName) return byName;
    }
    return null;
  }

  function ensureCliente(snap) {
    var found = findClienteByDoc(snap.doc, snap.tel, snap.nombre);
    if (found) {
      if (!found.tel && snap.tel) found.tel = snap.tel;
      if (!found.email && snap.email) found.email = snap.email;
      if (!found.doc && snap.doc) found.doc = snap.doc;
      return found;
    }
    var c = {
      id: nextId('CLI', 'cli'), nombre: String(snap.nombre || '').trim(), doc: String(snap.doc || '').trim(),
      tel: String(snap.tel || '').trim(), email: String(snap.email || '').trim(), pais: String(snap.pais || '').trim(),
      licencia: String(snap.licencia || '').trim(), nivel: 'Normal', motivoLista: '', notas: '', createdAt: C.nowStamp()
    };
    db.clientes.push(c);
    return c;
  }

  function addCliente(data) {
    if (!data.nombre || !String(data.nombre).trim()) return { ok: false, error: 'El nombre es obligatorio.' };
    var dup = findClienteByDoc(data.doc, data.tel, '');
    if (dup) return { ok: false, error: 'Ya existe un cliente con ese documento o teléfono: ' + dup.nombre };
    var c = {
      id: nextId('CLI', 'cli'), nombre: String(data.nombre).trim(), doc: String(data.doc || '').trim(),
      tel: String(data.tel || '').trim(), email: String(data.email || '').trim(), pais: String(data.pais || '').trim(),
      licencia: String(data.licencia || '').trim(), nivel: data.nivel === 'VIP' ? 'VIP' : 'Normal',
      motivoLista: '', notas: String(data.notas || '').trim(), createdAt: C.nowStamp()
    };
    db.clientes.push(c);
    audit('Crear', 'Cliente', c.id, c.nombre);
    commit();
    return { ok: true, cliente: c };
  }

  function updateCliente(id, data) {
    var c = cliente(id);
    if (!c) return { ok: false, error: 'Cliente no encontrado.' };
    if (!data.nombre || !String(data.nombre).trim()) return { ok: false, error: 'El nombre es obligatorio.' };
    if (data.doc) {
      var dup = findClienteByDoc(data.doc, '', '');
      if (dup && dup.id !== id) return { ok: false, error: 'Otro cliente ya usa ese documento: ' + dup.nombre };
    }
    Object.assign(c, {
      nombre: String(data.nombre).trim(), doc: String(data.doc || '').trim(), tel: String(data.tel || '').trim(),
      email: String(data.email || '').trim(), pais: String(data.pais || '').trim(), licencia: String(data.licencia || '').trim(),
      notas: String(data.notas || '').trim(), updatedAt: C.nowStamp()
    });
    audit('Actualizar', 'Cliente', id, c.nombre);
    commit();
    return { ok: true, cliente: c };
  }

  function setNivelCliente(id, nivel, motivo) {
    var c = cliente(id);
    if (!c) return { ok: false, error: 'Cliente no encontrado.' };
    if (['VIP', 'Normal', 'Lista Negra'].indexOf(nivel) < 0) return { ok: false, error: 'Nivel inválido.' };
    if (nivel === 'Lista Negra' && !String(motivo || '').trim()) return { ok: false, error: 'Para lista negra indica el motivo.' };
    c.nivel = nivel;
    c.motivoLista = nivel === 'Lista Negra' ? String(motivo).trim() : '';
    c.updatedAt = C.nowStamp();
    audit('Clasificar', 'Cliente', id, nivel + (motivo ? ' · ' + motivo : ''));
    commit();
    return { ok: true };
  }

  function deleteCliente(id) {
    var c = cliente(id);
    if (!c) return { ok: false, error: 'Cliente no encontrado.' };
    var usos = db.reservas.filter(function (r) { return r.clienteId === id; });
    if (usos.length) return { ok: false, error: 'No se puede eliminar: tiene ' + usos.length + ' contrato(s). Puedes clasificarlo como lista negra.' };
    db.clientes = db.clientes.filter(function (x) { return x.id !== id; });
    audit('Eliminar', 'Cliente', id, c.nombre);
    commit();
    return { ok: true };
  }

  /* ---------------- mutaciones: reservas ---------------- */
  function depositoObj(d) {
    var tipoDef = C.TIPOS_DEPOSITO.filter(function (t) { return t.id === d.tipo; })[0] || C.TIPOS_DEPOSITO[0];
    var monetario = tipoDef.monetario;
    return {
      id: d.id || nextId('DEP', 'dep'),
      tipo: d.tipo || 'Hold en TC',
      monto: monetario ? C.r2(Number(d.monto) || 0) : 0,
      moneda: d.moneda === 'DOP' ? 'DOP' : 'USD',
      detalle: String(d.detalle || '').trim(),
      estado: ['Retenido', 'Devuelto', 'Aplicado'].indexOf(d.estado) >= 0 ? d.estado : 'Retenido',
      fecha: d.fecha || C.todayISO()
    };
  }

  function pagoObj(res, p) {
    var tasaPago = Number(p.tasa) || tasa();
    var monto = C.r2(Number(p.monto) || 0);
    return {
      id: nextId('PAG', 'pag'),
      fecha: p.fecha || C.todayISO(),
      monto: monto,
      moneda: p.moneda === 'DOP' ? 'DOP' : 'USD',
      metodo: p.metodo || 'Efectivo',
      banco: String(p.banco || '').trim(),
      referencia: String(p.referencia || '').trim(),
      nota: String(p.nota || '').trim(),
      tasa: tasaPago,
      montoUSD: p.moneda === 'DOP' ? C.r2(monto / tasaPago) : monto,
      recibidoPor: p.recibidoPor || ui.actorId
    };
  }

  function movimientoDePago(res, pago) {
    var montoDOP = pago.moneda === 'DOP' ? pago.monto : C.r2(pago.monto * pago.tasa);
    var dgii = C.METODOS_BANCO.indexOf(pago.metodo) >= 0 ? C.r2(montoDOP * (Number(db.settings.operacion.dgii) || 0) / 100) : 0;
    return {
      id: nextId('MOV', 'mov'), fecha: pago.fecha, tipo: 'Ingreso', categoria: 'Renta',
      concepto: 'Pago ' + res.id + ' · ' + (res.clienteSnapshot && res.clienteSnapshot.nombre ? res.clienteSnapshot.nombre : 'Cliente'),
      moneda: pago.moneda, monto: pago.monto, tasa: pago.tasa, montoUSD: pago.montoUSD,
      montoDOP: montoDOP, metodo: pago.metodo, banco: pago.banco, referencia: pago.referencia,
      dgii: dgii, reservaId: res.id, pagoId: pago.id, vehicleId: res.vehiculoId, empleadoId: pago.recibidoPor, nota: pago.nota,
      createdAt: C.nowStamp()
    };
  }

  function normalizarVuelo(v) {
    if (!v || !v.activo) return { activo: false };
    return {
      activo: true,
      aerolinea: String(v.aerolinea || '').trim(),
      numero: String(v.numero || '').trim().toUpperCase(),
      origen: String(v.origen || '').trim(),
      destino: String(v.destino || 'Santo Domingo (SDQ)').trim(),
      fecha: v.fecha || '',
      hora: v.hora || '',
      terminal: String(v.terminal || '').trim(),
      maletas: Number(v.maletas) || 0,
      notas: String(v.notas || '').trim(),
      estado: v.estado || '', etiqueta: v.etiqueta || '', retrasoMin: Number(v.retrasoMin) || 0,
      ultima: v.ultima || '', aterrizaje: v.aterrizaje || '', fuente: v.fuente || '', alertado: v.alertado || ''
    };
  }

  function registrarGastoPropietario(res, t) {
    t = t || C.calcTotales(res, db.settings);
    if (!(t.costoPropietarioTotalUSD > 0) || res.propietarioPagado) return null;
    var v = vehiculoDeReserva(res);
    var prop = (v && v.propietarioNombre) || (res.vehiculoSnapshot && res.vehiculoSnapshot.propietarioNombre) || 'Propietario externo';
    var tasaMov = Number(res.tasa) || tasa();
    var montoDOP = C.r2(t.costoPropietarioTotalUSD * tasaMov);
    var descTxt = t.descuentoPropietarioUSD > 0 ? ' - Desc. US$' + t.descuentoPropietarioUSD + (res.conceptoDescuentoPropietario ? ' [' + res.conceptoDescuentoPropietario + ']' : '') : '';
    var mov = {
      id: nextId('MOV', 'mov'), fecha: C.todayISO(), tipo: 'Gasto', categoria: 'Subarriendo / Dueño',
      concepto: 'Pago subarriendo ' + res.id + ' · ' + prop + ' (' + (v ? nombreVehiculo(v) : 'Vehículo externo') + ' · ' + t.dias + 'd × US$' + t.costoDiaUSD + descTxt + ')',
      moneda: 'USD', monto: t.costoPropietarioTotalUSD, tasa: tasaMov,
      montoUSD: t.costoPropietarioTotalUSD, montoDOP: montoDOP,
      metodo: 'Transferencia bancaria', banco: '', referencia: res.id,
      dgii: C.r2(montoDOP * (Number(db.settings.operacion.dgii) || 0) / 100),
      reservaId: res.id, pagoId: '', vehicleId: res.vehiculoId !== 'INVITADO' ? res.vehiculoId : '',
      empleadoId: ui.actorId, nota: 'Liquidación a propietario tercero', createdAt: C.nowStamp()
    };
    db.finanzas.unshift(mov);
    res.propietarioPagado = true;
    res.gastoPropietarioId = mov.id;
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Pago a dueño', detalle: C.money(t.costoPropietarioTotalUSD, 'USD') + ' liquidado a ' + prop });
    return mov;
  }

  function liquidarPropietarioManual(id) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    var t = C.calcTotales(res, db.settings);
    if (!(t.costoPropietarioTotalUSD > 0)) return { ok: false, error: 'Este contrato no tiene costo de propietario tercero.' };
    if (res.propietarioPagado) return { ok: false, error: 'El pago al propietario ya fue registrado en Finanzas.' };
    var mov = registrarGastoPropietario(res, t);
    commit();
    return { ok: true, movimiento: mov };
  }

  function createReserva(input) {
    var tipo = input.tipo === 'bloqueo' ? 'bloqueo' : 'renta';
    var salida = input.salida, retorno = input.retorno;
    if (!salida || !retorno) return { ok: false, error: 'Completa la fecha de salida y de retorno.' };
    if (retorno < salida) return { ok: false, error: 'La fecha de retorno no puede ser anterior a la salida.' };
    if (retorno === salida && input.horaSalida && input.horaRetorno && C.timeToMin(input.horaRetorno) <= C.timeToMin(input.horaSalida)) {
      return { ok: false, error: 'Cuando la entrega y devolución son el mismo día, la hora de retorno debe ser posterior a la de salida.' };
    }
    if (!input.vehiculoId) return { ok: false, error: 'Selecciona un vehículo.' };
    var esInvitado = input.vehiculoId === 'INVITADO' || !!input.esVehiculoInvitado;
    var veh = null;
    if (esInvitado) {
      var g = input.vehiculoInvitado || {};
      if (!g.modelo || !String(g.modelo).trim()) return { ok: false, error: 'Escribe la marca y modelo del vehículo invitado.' };
      if (g.guardarEnFlota) {
        var added = addVehiculo({
          marca: g.marca || '', modelo: g.modelo, anio: Number(g.anio) || new Date().getFullYear(),
          color: g.color || 'Blanco', placa: g.placa || 'EXTERNO',
          tarifaUSD: Number(input.tarifaMonto) || 50, tarifaDOP: C.r2((Number(input.tarifaMonto) || 50) * tasa()),
          esPropio: false, propietarioNombre: g.propietarioNombre || 'Externo', propietarioTel: g.propietarioTel || '',
          costoDiaUSD: Number(input.costoPropietarioDiaUSD) || 0, km: Number(input.kmSalida) || 0, kmMant: (Number(input.kmSalida) || 0) + 5000
        });
        if (added.ok) { veh = added.vehiculo; input.vehiculoId = veh.id; esInvitado = false; }
      }
      if (!veh) {
        veh = {
          id: 'INVITADO', marca: String(g.marca || '').trim(), modelo: String(g.modelo || '').trim(),
          anio: Number(g.anio) || new Date().getFullYear(), color: String(g.color || 'Blanco').trim(),
          placa: String(g.placa || 'EXTERNO').trim(), esPropio: false, esInvitado: true,
          propietarioNombre: String(g.propietarioNombre || 'Propietario externo').trim(),
          propietarioTel: String(g.propietarioTel || '').trim(),
          costoDiaUSD: C.r2(Number(input.costoPropietarioDiaUSD) || 0), km: Number(input.kmSalida) || 0
        };
      }
    } else {
      veh = vehiculo(input.vehiculoId);
      if (!veh) return { ok: false, error: 'El vehículo seleccionado no existe.' };
      if (veh.estadoBase === 'baja') return { ok: false, error: 'Ese vehículo está fuera de servicio.' };
    }
    if (tipo === 'renta' && (!input.cliente || !String(input.cliente.nombre || '').trim())) return { ok: false, error: 'Indica el nombre del cliente.' };
    var estado = input.estado === 'Activo' ? 'Activo' : 'Confirmada';
    var cs = !esInvitado ? conflictos(input.vehiculoId, salida, retorno, { horaSalida: input.horaSalida, horaRetorno: input.horaRetorno }) : [];
    if (cs.length) return { ok: false, error: 'El vehículo no está disponible: se cruza con ' + cs.map(function (r) { return r.id + ' (' + r.salida + ' → ' + r.retorno + ')'; }).join(', '), conflictos: cs };

    var cli = null;
    if (tipo === 'renta') {
      cli = input.clienteId ? cliente(input.clienteId) : null;
      if (!cli) cli = ensureCliente(input.cliente);
      if (cli.nivel === 'Lista Negra' && !input.autorizacionListaNegra) {
        return { ok: false, error: 'cliente-lista-negra', cliente: cli, errorMsg: 'El cliente ' + cli.nombre + ' está en lista negra: ' + (cli.motivoLista || 'sin motivo registrado') + '. Se requiere autorización expresa.' };
      }
    }

    var dias = C.diasRenta(salida, retorno, db.settings.operacion.conteoDias);
    var id = nextReservaId();
    var snap = input.cliente || (cli ? { nombre: cli.nombre, doc: cli.doc, tel: cli.tel, email: cli.email, licencia: cli.licencia, pais: cli.pais } : { nombre: '', doc: '', tel: '', email: '', licencia: '', pais: '' });
    var res = {
      id: id, tipo: tipo, vehiculoId: input.vehiculoId, esVehiculoInvitado: esInvitado,
      vehiculoSnapshot: {
        marca: veh.marca || '', modelo: veh.modelo || '', anio: veh.anio || '', color: veh.color || '',
        placa: veh.placa || '', esPropio: veh.esPropio !== false, esInvitado: !!esInvitado,
        propietarioNombre: (input.vehiculoInvitado && input.vehiculoInvitado.propietarioNombre) || veh.propietarioNombre || '',
        propietarioTel: (input.vehiculoInvitado && input.vehiculoInvitado.propietarioTel) || veh.propietarioTel || ''
      },
      costoPropietarioDiaUSD: tipo === 'bloqueo' ? 0 : C.r2(input.costoPropietarioDiaUSD != null ? Number(input.costoPropietarioDiaUSD) : (veh.esPropio === false ? Number(veh.costoDiaUSD) || 0 : 0)),
      descuentoPropietarioUSD: tipo === 'bloqueo' ? 0 : C.r2(Number(input.descuentoPropietarioUSD) || 0),
      conceptoDescuentoPropietario: tipo === 'bloqueo' ? '' : String(input.conceptoDescuentoPropietario || '').trim(),
      propietarioPagado: false, gastoPropietarioId: '', leido: false,
      clienteId: cli ? cli.id : '',
      clienteSnapshot: tipo === 'bloqueo'
        ? { nombre: String(input.motivo || 'Taller / mantenimiento').trim(), doc: '', tel: '', email: '', licencia: '', pais: '' }
        : {
          nombre: String(snap.nombre || '').trim(), doc: String(snap.doc || '').trim(),
          tel: String(snap.tel || '').trim(), email: String(snap.email || '').trim(),
          licencia: String(snap.licencia || '').trim(), pais: String(snap.pais || '').trim()
        },
      salida: salida, retorno: retorno,
      horaSalida: input.horaSalida || db.settings.operacion.horaEntrega,
      horaRetorno: input.horaRetorno || db.settings.operacion.horaRetorno,
      tarifaMonto: tipo === 'bloqueo' ? 0 : C.r2(Number(input.tarifaMonto) || 0),
      tarifaMoneda: input.tarifaMoneda === 'DOP' ? 'DOP' : 'USD',
      dias: dias, extras: [], descuento: 0,
      aplicarITBIS: tipo === 'renta' ? !!input.aplicarITBIS : false,
      itbisPct: Number(db.settings.operacion.itbis) || 18,
      tasa: tasa(), total: 0, totalUSD: 0, totalDOP: 0,
      estado: tipo === 'bloqueo' ? 'Activo' : estado,
      canal: input.canal || 'Mostrador',
      vendedorId: input.vendedorId || ui.actorId,
      entregaId: input.entregaId || '',
      recepcionId: '',
      combustibleSalida: input.combustibleSalida || '8/8',
      combustibleRetorno: '',
      kmSalida: Number(input.kmSalida) || Number(veh.km) || 0,
      kmRetorno: null,
      fechaEntregaReal: estado === 'Activo' ? C.todayISO() : '',
      horaEntregaReal: estado === 'Activo' ? C.nowHHMM() : '',
      fechaRetornoReal: '', horaRetornoReal: '',
      depositos: tipo === 'renta' ? (input.depositos || []).map(depositoObj) : [],
      pagos: [], vuelo: tipo === 'renta' ? normalizarVuelo(input.vuelo) : { activo: false },
      checklist: input.checklist || { licencia: false, documentos: false, contrato: false, pago: false, fotos: false },
      notas: String(input.notas || '').trim(),
      motivoCancelacion: '',
      recordatorioEnviado: '',
      historial: [{ fecha: C.nowStamp(), tipo: 'Creación', detalle: 'Contrato creado por ' + actor().nombre }],
      createdAt: C.nowStamp(), updatedAt: C.nowStamp()
    };

    var t = C.calcTotales(res, db.settings);
    res.total = t.total; res.totalUSD = t.totalUSD; res.totalDOP = t.totalDOP;
    db.reservas.push(res);

    if (tipo === 'renta' && input.pagoInicial && Number(input.pagoInicial.monto) > 0) {
      var pago = pagoObj(res, input.pagoInicial);
      res.pagos.push(pago);
      db.finanzas.unshift(movimientoDePago(res, pago));
      res.historial.push({ fecha: C.nowStamp(), tipo: 'Pago', detalle: C.money(pago.monto, pago.moneda) + ' · ' + pago.metodo });
    }
    if (tipo === 'renta' && input.registrarGastoDueno && t.costoPropietarioTotalUSD > 0) {
      registrarGastoPropietario(res, t);
    }
    if (cli && cli.nivel === 'Lista Negra') {
      audit('Autorización', 'Cliente', cli.id, 'Renta autorizada pese a lista negra: ' + (input.motivoAutorizacion || 'sin motivo'));
    }
    audit('Crear', 'Contrato', res.id, (res.clienteSnapshot.nombre || '') + ' · ' + nombreVehiculo(veh) + ' · ' + res.salida + ' → ' + res.retorno);
    commit();
    return { ok: true, reserva: res };
  }

  function updateReserva(id, input) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    if (res.estado === 'Completado' || res.estado === 'Cancelada') return { ok: false, error: 'Los contratos cerrados o cancelados no se pueden editar. Crea uno nuevo si hace falta.' };
    var salida = input.salida || res.salida, retorno = input.retorno || res.retorno;
    if (retorno < salida) return { ok: false, error: 'La fecha de retorno no puede ser anterior a la salida.' };
    var hSal = input.horaSalida || res.horaSalida, hRet = input.horaRetorno || res.horaRetorno;
    if (retorno === salida && hSal && hRet && C.timeToMin(hRet) <= C.timeToMin(hSal)) {
      return { ok: false, error: 'Cuando la entrega y devolución son el mismo día, la hora de retorno debe ser posterior a la de salida.' };
    }
    var targetVehId = input.vehiculoId || res.vehiculoId;
    var esInv = targetVehId === 'INVITADO' || !!input.esVehiculoInvitado;
    var cs = !esInv ? conflictos(targetVehId, salida, retorno, { excluirId: id, horaSalida: input.horaSalida, horaRetorno: input.horaRetorno }) : [];
    if (cs.length) return { ok: false, error: 'El vehículo no está disponible en las nuevas fechas: ' + cs.map(function (r) { return r.id; }).join(', ') };
    res.vehiculoId = targetVehId;
    res.esVehiculoInvitado = esInv;
    if (esInv && input.vehiculoInvitado) {
      res.vehiculoSnapshot = {
        marca: input.vehiculoInvitado.marca || '', modelo: input.vehiculoInvitado.modelo || '',
        anio: Number(input.vehiculoInvitado.anio) || 2024, color: input.vehiculoInvitado.color || '',
        placa: input.vehiculoInvitado.placa || 'EXTERNO', esPropio: false, esInvitado: true,
        propietarioNombre: input.vehiculoInvitado.propietarioNombre || 'Externo',
        propietarioTel: input.vehiculoInvitado.propietarioTel || ''
      };
    } else if (!esInv) {
      var vRef = vehiculo(targetVehId);
      if (vRef) {
        res.vehiculoSnapshot = {
          marca: vRef.marca || '', modelo: vRef.modelo || '', anio: vRef.anio || '', color: vRef.color || '',
          placa: vRef.placa || '', esPropio: vRef.esPropio !== false, esInvitado: false,
          propietarioNombre: vRef.propietarioNombre || '', propietarioTel: vRef.propietarioTel || ''
        };
      }
    }
    if (input.costoPropietarioDiaUSD != null) res.costoPropietarioDiaUSD = C.r2(Number(input.costoPropietarioDiaUSD) || 0);
    if (input.descuentoPropietarioUSD != null) res.descuentoPropietarioUSD = C.r2(Number(input.descuentoPropietarioUSD) || 0);
    if (input.conceptoDescuentoPropietario != null) res.conceptoDescuentoPropietario = String(input.conceptoDescuentoPropietario || '').trim();

    var dias = C.diasRenta(salida, retorno, db.settings.operacion.conteoDias);
    res.salida = salida; res.retorno = retorno;
    res.horaSalida = input.horaSalida || res.horaSalida;
    res.horaRetorno = input.horaRetorno || res.horaRetorno;
    res.tarifaMonto = C.r2(Number(input.tarifaMonto != null ? input.tarifaMonto : res.tarifaMonto) || 0);
    res.tarifaMoneda = (input.tarifaMoneda || res.tarifaMoneda) === 'DOP' ? 'DOP' : 'USD';
    res.dias = dias;
    res.descuento = C.r2(Number(input.descuento != null ? input.descuento : res.descuento) || 0);
    res.aplicarITBIS = !!input.aplicarITBIS;
    res.itbisPct = Number(db.settings.operacion.itbis) || 18;
    res.notas = input.notas != null ? String(input.notas).trim() : res.notas;
    res.canal = input.canal || res.canal;
    res.entregaId = input.entregaId != null ? input.entregaId : res.entregaId;
    res.combustibleSalida = input.combustibleSalida || res.combustibleSalida;
    res.kmSalida = input.kmSalida != null ? Number(input.kmSalida) || 0 : res.kmSalida;
    res.vuelo = input.vuelo !== undefined ? normalizarVuelo(input.vuelo) : res.vuelo;
    if (input.checklist) res.checklist = Object.assign({}, res.checklist || {}, input.checklist);
    var oldClientId = res.clienteId;
    var targetCli = input.clienteId ? cliente(input.clienteId) : null;
    if (input.cliente) {
      res.clienteSnapshot = {
        nombre: String(input.cliente.nombre || res.clienteSnapshot.nombre).trim(),
        doc: String(input.cliente.doc || '').trim(), tel: String(input.cliente.tel || '').trim(),
        email: String(input.cliente.email || '').trim(), licencia: String(input.cliente.licencia || '').trim(),
        pais: String(input.cliente.pais || '').trim()
      };
      if (!targetCli) targetCli = ensureCliente(res.clienteSnapshot);
      res.clienteId = targetCli.id;
    }
    if (targetCli && targetCli.nivel === 'Lista Negra' && targetCli.id !== oldClientId && !input.autorizacionListaNegra) {
      return { ok: false, error: 'cliente-lista-negra', cliente: targetCli };
    }
    if (targetCli && targetCli.nivel === 'Lista Negra' && targetCli.id !== oldClientId) {
      audit('Autorización', 'Cliente', targetCli.id, 'Contrato editado pese a lista negra: ' + (input.motivoAutorizacion || 'sin motivo'));
    }
    var t = C.calcTotales(res, db.settings);
    res.total = t.total; res.totalUSD = t.totalUSD; res.totalDOP = t.totalDOP;
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Edición', detalle: 'Contrato actualizado por ' + actor().nombre });
    res.updatedAt = C.nowStamp();
    audit('Actualizar', 'Contrato', res.id, res.salida + ' → ' + res.retorno);
    commit();
    return { ok: true, reserva: res };
  }

  function setEstadoReserva(id, estado, motivo) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    if (['Confirmada', 'Activo', 'Completado', 'Cancelada'].indexOf(estado) < 0) return { ok: false, error: 'Estado inválido.' };
    if (estado === 'Activo') {
      var cs = conflictos(res.vehiculoId, res.salida, res.retorno, { excluirId: res.id, horaSalida: res.horaSalida, horaRetorno: res.horaRetorno });
      if (cs.length) return { ok: false, error: 'No se puede activar: se cruza con ' + cs.map(function (r) { return r.id; }).join(', ') };
    }
    if (estado === 'Cancelada' && !String(motivo || '').trim()) return { ok: false, error: 'Indica el motivo de la cancelación.' };
    res.estado = estado;
    if (estado === 'Cancelada') res.motivoCancelacion = String(motivo).trim();
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Estado', detalle: estado + (motivo ? ' · ' + motivo : '') + ' por ' + actor().nombre });
    res.updatedAt = C.nowStamp();
    audit('Estado', 'Contrato', id, estado + (motivo ? ' · ' + motivo : ''));
    commit();
    return { ok: true };
  }

  function extenderReserva(id, nuevoRetorno, nuevaTarifa, motivo) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    if (res.estado !== 'Activo' && res.estado !== 'Confirmada') return { ok: false, error: 'Solo se pueden extender contratos activos o confirmados.' };
    if (!nuevoRetorno || nuevoRetorno <= res.retorno) return { ok: false, error: 'La nueva fecha debe ser posterior a la actual (' + res.retorno + ').' };
    var cs = conflictos(res.vehiculoId, res.salida, nuevoRetorno, { excluirId: res.id, horaSalida: res.horaSalida, horaRetorno: res.horaRetorno });
    if (cs.length) return { ok: false, error: 'No se puede extender: el vehículo está ocupado por ' + cs.map(function (r) { return r.id; }).join(', ') };
    var diasAntes = res.dias;
    res.retorno = nuevoRetorno;
    if (nuevaTarifa != null && Number(nuevaTarifa) > 0) res.tarifaMonto = C.r2(Number(nuevaTarifa));
    res.dias = C.diasRenta(res.salida, nuevoRetorno, db.settings.operacion.conteoDias);
    var t = C.calcTotales(res, db.settings);
    res.total = t.total; res.totalUSD = t.totalUSD; res.totalDOP = t.totalDOP;
    res.recordatorioEnviado = '';
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Extensión', detalle: 'Retorno ' + nuevoRetorno + ' (' + diasAntes + ' → ' + res.dias + ' días)' + (motivo ? ' · ' + motivo : '') });
    res.updatedAt = C.nowStamp();
    audit('Extender', 'Contrato', id, nuevoRetorno);
    commit();
    return { ok: true, reserva: res };
  }

  function addPago(id, data) {

    var pago = pagoObj(res, data);
    res.pagos.push(pago);
    db.finanzas.unshift(movimientoDePago(res, pago));
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Pago', detalle: C.money(pago.monto, pago.moneda) + ' · ' + pago.metodo });
    res.updatedAt = C.nowStamp();
    audit('Pago', 'Contrato', id, C.money(pago.monto, pago.moneda) + ' · ' + pago.metodo);

    return { ok: true, pago: pago };

  function addDeposito(id, data) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    var dep = depositoObj(data);
    var defDep = C.TIPOS_DEPOSITO.filter(function (t) { return t.id === dep.tipo; })[0];
    if (!defDep) return { ok: false, error: 'Tipo de depósito inválido.' };
    if (dep.tipo !== 'Pasaporte' && dep.tipo !== 'Licencia' && !(dep.monto > 0)) return { ok: false, error: 'Indica el monto del depósito.' };
    if (!defDep.monetario && !dep.detalle) return { ok: false, error: 'Indica el detalle del documento retenido (número de pasaporte o licencia).' };
    res.depositos.push(dep);
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Fianza', detalle: dep.tipo + ' · ' + (dep.monto > 0 ? C.money(dep.monto, dep.moneda) : dep.detalle) });

  function setDepositoEstado(id, depId, estado) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    var dep = res.depositos.filter(function (d) { return d.id === depId; })[0];
    if (!dep) return { ok: false, error: 'Depósito no encontrado.' };
    if (['Retenido', 'Devuelto', 'Aplicado'].indexOf(estado) < 0) return { ok: false, error: 'Estado inválido.' };
    var anterior = dep.estado;
    if (estado === 'Aplicado' && anterior !== 'Aplicado') {
      if (!(Number(dep.monto) > 0)) return { ok: false, error: 'Este documento no tiene monto para aplicar.' };
      var pago = pagoObj(res, {
        monto: dep.monto, moneda: dep.moneda, metodo: 'Depósito aplicado',
        nota: 'Fianza aplicada · ' + dep.tipo + (dep.detalle ? ' · ' + dep.detalle : ''),
        tasa: tasa(), recibidoPor: ui.actorId
      });
      res.pagos.push(pago);
      db.finanzas.unshift(movimientoDePago(res, pago));
      dep.pagoId = pago.id;
    }
    if (estado !== 'Aplicado' && dep.pagoId) {
      var pid = dep.pagoId;
      res.pagos = res.pagos.filter(function (p) { return p.id !== pid; });
      db.finanzas = db.finanzas.filter(function (m) { return m.pagoId !== pid; });
      dep.pagoId = '';
    }
    dep.estado = estado;
    dep.fechaEstado = C.todayISO();
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Fianza ' + estado, detalle: dep.tipo + ' · ' + (dep.monto > 0 ? C.money(dep.monto, dep.moneda) : dep.detalle) });
    res.updatedAt = C.nowStamp();
    audit('Fianza ' + estado, 'Contrato', id, dep.tipo);
    commit();
    return { ok: true };

  function checkout(id, data) {
    var res = reserva(id);

    res.historial.push({ fecha: C.nowStamp(), tipo: 'Check-out', detalle: 'Entrega · km ' + res.kmSalida + ' · combustible ' + res.combustibleSalida + ' · ' + actor().nombre });

  function checkin(id, data) {
    var res = reserva(id);
    if (!res) return { ok: false, error: 'Contrato no encontrado.' };
    if (res.tipo !== 'renta') return { ok: false, error: 'Operación no válida para un bloqueo.' };
    if (res.estado !== 'Activo') return { ok: false, error: 'Solo se pueden recibir contratos activos.' };
    if (data.kmRetorno != null && Number(data.kmRetorno) > 0 && Number(data.kmRetorno) < Number(res.kmSalida)) {
      return { ok: false, error: 'El kilometraje de retorno no puede ser menor al de salida (' + res.kmSalida + ' km).' };
    }
    res.fechaRetornoReal = data.fechaRetornoReal || C.todayISO();
    res.horaRetornoReal = data.horaRetornoReal || C.nowHHMM();
    res.kmRetorno = data.kmRetorno != null ? Number(data.kmRetorno) || 0 : res.kmRetorno;
    res.combustibleRetorno = data.combustibleRetorno || res.combustibleRetorno;
    res.recepcionId = data.recepcionId || ui.actorId;
    if (data.cargoConcepto && Number(data.cargoMonto) > 0) {
      res.extras.push({ id: C.uid('EXT'), concepto: String(data.cargoConcepto).trim(), monto: C.r2(Number(data.cargoMonto)), moneda: res.tarifaMoneda });
    }
    if (data.notas) res.notas = (res.notas ? res.notas + '\n' : '') + 'Check-in: ' + String(data.notas).trim();
    res.estado = 'Completado';
    res.historial.push({ fecha: C.nowStamp(), tipo: 'Check-in', detalle: 'Recibido · km ' + res.kmRetorno + ' · combustible ' + res.combustibleRetorno + ' · ' + actor().nombre });
    res.updatedAt = C.nowStamp();
    var veh = vehiculo(res.vehiculoId);
    if (veh && res.kmRetorno > 0 && res.kmRetorno > (Number(veh.km) || 0)) veh.km = res.kmRetorno;
    if (data.devolverFianza !== false) {
      res.depositos.forEach(function (d) {
        if (d.estado === 'Retenido') { d.estado = 'Devuelto'; d.fechaEstado = C.todayISO(); }
      });
    }
    var t = C.calcTotales(res, db.settings);
    res.total = t.total; res.totalUSD = t.totalUSD; res.totalDOP = t.totalDOP;
    if (t.costoPropietarioTotalUSD > 0 && !res.propietarioPagado && data.pagarPropietario !== false) {
      registrarGastoPropietario(res, t);
    }
    audit('Check-in', 'Contrato', id, 'km ' + res.kmRetorno + ' · saldo ' + C.money(t.pendienteUSD, 'USD'));
    commit();
    return { ok: true, reserva: res, totales: t };
  }

  /* ---------------- finanzas ---------------- */
  function addMovimiento(data) {
    if (!data.concepto || !String(data.concepto).trim()) return { ok: false, error: 'Escribe el concepto.' };
    if (data.vehicleId && !vehiculo(data.vehicleId)) return { ok: false, error: 'El vehículo seleccionado no existe.' };
    var monto = C.r2(Number(data.monto) || 0);
    if (!(monto > 0)) return { ok: false, error: 'El monto debe ser mayor que cero.' };
    var moneda = data.moneda === 'DOP' ? 'DOP' : 'USD';
    var tasaMov = Number(data.tasa) || tasa();
    var montoDOP = moneda === 'DOP' ? monto : C.r2(monto * tasaMov);
    var metodo = data.metodo || 'Efectivo';
    var dgii = C.METODOS_BANCO.indexOf(metodo) >= 0 ? C.r2(montoDOP * (Number(db.settings.operacion.dgii) || 0) / 100) : 0;
    var mov = {
      id: nextId('MOV', 'mov'), fecha: data.fecha || C.todayISO(), tipo: data.tipo === 'Gasto' ? 'Gasto' : 'Ingreso',
      categoria: data.categoria || (data.tipo === 'Gasto' ? 'Otros' : 'Renta'),
      concepto: String(data.concepto).trim(), moneda: moneda, monto: monto, tasa: tasaMov,
      montoUSD: moneda === 'DOP' ? C.r2(monto / tasaMov) : monto, montoDOP: montoDOP,
      metodo: metodo, banco: String(data.banco || '').trim(), referencia: String(data.referencia || '').trim(),
      dgii: dgii, reservaId: '', pagoId: '', vehicleId: data.vehicleId || '', empleadoId: data.empleadoId || ui.actorId,
      nota: String(data.nota || '').trim(), createdAt: C.nowStamp()
    };
    db.finanzas.unshift(mov);
    audit('Crear', 'Finanzas', mov.id, mov.tipo + ' · ' + C.money(monto, moneda));
    commit();
    return { ok: true, movimiento: mov };
  }

  function deleteMovimiento(id) {
    var m = db.finanzas.filter(function (x) { return x.id === id; })[0];
    if (!m) return { ok: false, error: 'Movimiento no encontrado.' };
    if (m.pagoId) return { ok: false, error: 'Este ingreso viene de un pago de contrato. Elimínalo desde el contrato para mantener la coherencia.' };
    db.finanzas = db.finanzas.filter(function (x) { return x.id !== id; });
    audit('Eliminar', 'Finanzas', id, m.concepto);
    commit();
    return { ok: true };
  }

  /* ---------------- ajustes / sistema ---------------- */
  function updateSettings(patch) {
    var prevTasa = Number(db.settings && db.settings.operacion && db.settings.operacion.tasa) || 60;
    db.settings = C.deepMerge(db.settings, patch);
    if (!(Number(db.settings.operacion.tasa) > 0)) db.settings.operacion.tasa = 60;
    var nuevaTasa = Number(db.settings.operacion.tasa) || 60;
    if (patch && patch.operacion && patch.operacion.tasa !== undefined) {
      db.settings.operacion.tasaUpdatedAt = (patch.operacion && patch.operacion.tasaUpdatedAt) || C.nowStamp();
      db.settings.operacion.tasaFuente = (patch.operacion && patch.operacion.tasaFuente) || 'Manual';
      // Sincronizar tarifas en DOP de la flota según la nueva tasa y actualizar equivalentes de reservas abiertas en USD
      (db.flota || []).forEach(function (v) {
        if (Number(v.tarifaUSD) > 0) v.tarifaDOP = C.r2(Number(v.tarifaUSD) * nuevaTasa);
      });
      (db.reservas || []).forEach(function (r) {
        if (r.estado === 'Activo' || r.estado === 'Confirmada') {
          var tot = C.calcTotales(r, db.settings);
          r.totalUSD = tot.totalUSD;
          r.totalDOP = tot.totalDOP;
        }
      });
    }
    audit('Actualizar', 'Ajustes', '', prevTasa !== nuevaTasa ? ('Tasa USD→DOP: RD$ ' + nuevaTasa.toFixed(2)) : 'Configuración general');
    commit();
    return { ok: true };
  }

  function setEmpleados(list) {
    db.settings.empleados = (list || []).map(function (e, i) {
      return { id: e.id || ('EMP-' + String(i + 1).padStart(3, '0')), nombre: String(e.nombre || '').trim(), rol: String(e.rol || '').trim(), tel: String(e.tel || '').trim(), activo: e.activo !== false };
    }).filter(function (e) { return e.nombre; });
    if (!db.settings.empleados.length) db.settings.empleados.push({ id: 'EMP-001', nombre: 'Operador', rol: '', tel: '', activo: true });
    if (!db.settings.empleados.some(function (e) { return e.id === ui.actorId; })) ui.actorId = db.settings.empleados[0].id;
    audit('Actualizar', 'Ajustes', '', 'Empleados');
    commit();
    return { ok: true };
  }

  function addMensaje(msg) {
    var m = Object.assign({ id: C.uid('MSG'), fecha: C.nowStamp(), direccion: 'out', estado: 'Enviado' }, msg);
    db.mensajes.unshift(m);
    if (db.mensajes.length > 300) db.mensajes.length = 300;

  function marcarInboxLeido(id) {
    db.inbox.forEach(function (m) { if (!id || m.id === id) m.leido = true; });
    commit();
  }

  function importInbox(list) {
    var nuevos = 0;
    (list || []).forEach(function (m) {
      var id = m.id || C.uid('WA');
      if (db.inbox.some(function (x) { return x.id === id; })) return;
      db.inbox.unshift({
        id: id, de: m.from || m.de || '', nombre: m.name || m.nombre || '', texto: m.text || m.texto || m.body || '',
        fecha: m.timestamp ? new Date(m.timestamp * 1000).toISOString() : (m.fecha || C.nowStamp()),
        leido: false, convertido: false, reservaId: ''
      });
      nuevos++;
    });
    if (nuevos) commit();
    return nuevos;

<script>
/* ==== reports.js ==== */
/* Castillo Rent Car ERP — cálculos puros de reportes */
(function (root) {
  'use strict';

  var RENT_CATS = ['Renta', 'Extensión', 'Cargo extra', 'Depósito aplicado'];

  function firstOfMonth(iso) { return String(iso || C.todayISO()).slice(0, 7) + '-01'; }
  function lastOfMonth(iso) {

  function monthKey(iso) { return String(iso || '').slice(0, 7); }

  }
  function pct(part, total) {

  }
  function sum(arr, fn) { return (arr || []).reduce(function (a, x) { return a + (Number(fn ? fn(x) : x) || 0); }, 0); }
  function inRange(iso, desde, hasta) { return !!iso && iso >= desde && iso <= hasta; }

  function presetRange(preset, hoy) {
    hoy = hoy || C.todayISO();

    if (preset === 'mes-anterior') {
      var prev = new Date(d.getFullYear(), d.getMonth() - 1, 1);

  function build(db, opts) {
    opts = opts || {};

    var desde = opts.desde || firstOfMonth(hoy);
    var hasta = opts.hasta || hoy;
    if (hasta < desde) { var tmp = desde; desde = hasta; hasta = tmp; }
    var maxEnd = C.addDays(desde, 366);

    (db.flota || []).forEach(function (v) { vehicleById[v.id] = v; });

    (db.reservas || []).forEach(function (r) { reservaById[r.id] = r; });

    var vehicles = (db.flota || []).filter(function (v) {
      if (vehicleFilter === 'PROPIOS') return v.estadoBase !== 'baja' && v.esPropio !== false;
      if (vehicleFilter === 'TERCEROS') return v.estadoBase !== 'baja' && v.esPropio === false;
      if (vehicleFilter) return v.id === vehicleFilter;
      return v.estadoBase !== 'baja';

    var rentals = (db.reservas || []).filter(function (r) { return r.tipo === 'renta' && r.estado !== 'Cancelada'; });
    var blocks = (db.reservas || []).filter(function (r) { return r.tipo === 'bloqueo' && r.estado !== 'Cancelada'; });
    var movs = (db.finanzas || []).filter(function (m) { return inRange(m.fecha, desde, hasta); });

    function vehicleOfMovement(m) {

    function isIncome(m) { return m.tipo === 'Ingreso'; }
    function isCost(m) { return m.tipo === 'Gasto'; }

    var rows = vehicles.map(function (v) {

        var used = rentals.some(function (r) {

        });
        if (used) occupied++;

      var mine = movs.filter(function (m) { return matchesVehicle(m) && vehicleOfMovement(m) === v.id; });
      var income = sum(mine.filter(isIncome), function (m) { return m.montoUSD; });
      var rentIncome = sum(mine.filter(isRentIncome), function (m) { return m.montoUSD; });
      var costs = sum(mine.filter(isCost), function (m) { return m.montoUSD; });
      var maintenance = sum(mine.filter(function (m) { return isCost(m) && m.categoria === 'Mantenimiento'; }), function (m) { return m.montoUSD; });
      var km = sum(rentals.filter(function (r) {
        return r.vehiculoId === v.id && r.kmRetorno != null && r.kmSalida != null && Number(r.kmRetorno) >= Number(r.kmSalida) &&
          inRange(r.fechaRetornoReal || r.retorno, desde, hasta);
      }), function (r) { return Number(r.kmRetorno) - Number(r.kmSalida); });

      return {

        placa: v.placa, marca: v.marca, modelo: v.modelo, anio: v.anio,

      income: C.r2(sum(filteredMovs.filter(isIncome), function (m) { return m.montoUSD; })),
      rentIncome: C.r2(sum(filteredMovs.filter(isRentIncome), function (m) { return m.montoUSD; })),
      costs: C.r2(sum(filteredMovs.filter(isCost), function (m) { return m.montoUSD; })),

    if (!vehicleFilter) {
